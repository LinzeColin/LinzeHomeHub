<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云平台总览 · status.linzezhang.com</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232a78d6'/><path d='M5 17h4l3-8 4 14 3-9h8' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
:root{
  --bg:#f6f6f4; --card:#fff; --soft:#f1f1ee; --line:#e4e3dc; --line2:#d7d6cd;
  --t1:#1b1b19; --t2:#57564f; --t3:#8b8a83;
  --accent:#2a78d6; --accent-bg:#e6f1fb; --accent-t:#0c447c;
  --pro:#4a3aa7; --pro-bg:#eeedfe; --pro-t:#26215c;
  --ok:#0f8a4d; --ok-bg:#e4f3ea; --warn:#c98500; --warn-bg:#fbf0d8;
  --danger:#cf3a3a; --danger-bg:#fbeaea;
  --h0:#eceada; --h1:#c6e6c1; --h2:#7bc47f; --h3:#3f9e57; --h4:#1e6b3a;
  --shadow:0 1px 2px rgba(20,20,15,.05),0 4px 14px rgba(20,20,15,.05);
  --shadow-lift:0 2px 6px rgba(20,20,15,.07),0 12px 28px rgba(20,20,15,.09);
  --r:13px; --ease:cubic-bezier(.22,.61,.36,1);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#141413; --card:#1d1d1b; --soft:#242422; --line:#33332f; --line2:#3f3f39;
    --t1:#f3f2ec; --t2:#c3c2b7; --t3:#8b8a83;
    --accent:#5a9bea; --accent-bg:#12314f; --accent-t:#b5d4f4;
    --pro:#9085e9; --pro-bg:#2a2560; --pro-t:#cecbf6;
    --ok:#3cc07f; --ok-bg:#123320; --warn:#e0a53a; --warn-bg:#3a2f12;
    --danger:#e26b6a; --danger-bg:#3a1a1a;
    --h0:#26261f; --h1:#0e4429; --h2:#006d32; --h3:#26a641; --h4:#39d353;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.24);
    --shadow-lift:0 2px 6px rgba(0,0,0,.36),0 14px 30px rgba(0,0,0,.34);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px 72px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h2{font-size:15px;font-weight:650;margin:30px 0 12px;letter-spacing:-.01em}
h2:first-child{margin-top:0}
h2 .hint{font-weight:400;color:var(--t3);font-size:12.5px;margin-left:8px}
.muted{color:var(--t3);font-size:13px}
.sub{font-size:12.5px;color:var(--t3);margin:-6px 0 12px;max-width:78ch}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(180%) blur(14px);border-bottom:.5px solid var(--line)}
.topbar .in{max-width:1180px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;padding:13px 0;font-weight:650;font-size:15px;color:var(--t1)}
.brand:hover{text-decoration:none}
.brand .lg{width:21px;height:21px;border-radius:6px;background:linear-gradient(140deg,var(--accent),var(--pro));flex:none}
.tabs{position:relative;display:flex;gap:2px;flex:1}
.tabs a{position:relative;padding:13px 15px;font-size:14.5px;color:var(--t2);white-space:nowrap;
  border-radius:9px 9px 0 0;transition:color .18s var(--ease),background .18s var(--ease)}
.tabs a:hover{color:var(--t1);background:var(--soft);text-decoration:none}
.tabs a:active{transform:translateY(.5px)}
.tabs a.on{color:var(--t1);font-weight:650}
.tabs a .n{font-size:11.5px;color:var(--t3);margin-left:5px;font-weight:400}
.tabs a.on .n{color:var(--accent)}
.tabink{position:absolute;bottom:-1px;height:2px;background:var(--accent);border-radius:2px;
  transition:transform .32s var(--ease),width .32s var(--ease);pointer-events:none}
.ext{display:flex;gap:6px;align-items:center;padding:9px 0}
.ext a{font-size:12px;padding:6px 12px;border:.5px solid var(--line);border-radius:9px;color:var(--t2);
  transition:all .18s var(--ease)}
.ext a:hover{background:var(--soft);color:var(--t1);text-decoration:none;transform:translateY(-1px);box-shadow:var(--shadow)}
.ext a:active{transform:translateY(0)}

/* ---------- 页头 + 实时心跳 ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin:26px 0 18px}
.head h1{font-size:22px;font-weight:680;margin:0;letter-spacing:-.02em}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--t2);
  background:var(--card);border:.5px solid var(--line);border-radius:999px;padding:5px 13px;box-shadow:var(--shadow)}
.live .beat{width:7px;height:7px;border-radius:50%;background:var(--ok);position:relative;flex:none}
.live .beat::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--ok);opacity:.28;
  animation:pulse 2s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.5}70%{transform:scale(1.5);opacity:0}100%{opacity:0}}
.live.stale .beat{background:var(--warn)} .live.stale .beat::after{background:var(--warn)}
.pill{font-size:12px;padding:5px 13px;border-radius:999px;font-weight:600}
.pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.bad{color:var(--danger);background:var(--danger-bg)}
.pill.warn{color:var(--warn);background:var(--warn-bg)}

/* ---------- 布局原子 ---------- */
.grid{display:grid;gap:13px}
.k5{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.k4{grid-template-columns:repeat(auto-fit,minmax(184px,1fr))}
.k3{grid-template-columns:repeat(auto-fit,minmax(232px,1fr))}
.k2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:.5px solid var(--line);border-radius:var(--r);padding:17px;
  box-shadow:var(--shadow);transition:box-shadow .24s var(--ease),transform .24s var(--ease),border-color .24s var(--ease)}
.card.p0{padding:4px 6px}
.card.hov:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px);border-color:var(--line2)}
.kpi{background:var(--card);border:.5px solid var(--line);border-radius:var(--r);padding:15px 16px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:box-shadow .24s var(--ease),transform .24s var(--ease)}
.kpi:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.kpi .lab{font-size:12.5px;color:var(--t2);display:flex;align-items:center;gap:6px}
.kpi .val{font-size:27px;font-weight:680;margin-top:4px;letter-spacing:-.025em;line-height:1.16}
.kpi .val .u{font-size:15px;font-weight:500;color:var(--t3);margin-left:2px}
.kpi .sub{font-size:12.5px;color:var(--t3);margin-top:3px}
.kpi .spark{position:absolute;right:0;bottom:0;width:74px;height:30px;opacity:.5}
.kpi.tone-ok::before,.kpi.tone-warn::before,.kpi.tone-bad::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.kpi.tone-ok::before{background:var(--ok)}
.kpi.tone-warn::before{background:var(--warn)}
.kpi.tone-bad::before{background:var(--danger)}

table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th{text-align:left;font-weight:550;color:var(--t2);padding:10px 11px;border-bottom:.5px solid var(--line);
  position:sticky;top:0;background:var(--card);z-index:1}
th.s{cursor:pointer;user-select:none;transition:color .16s var(--ease)}
th.s:hover{color:var(--t1)}
th.s::after{content:"";opacity:.35;margin-left:5px;font-size:10px}
th.s[data-dir="1"]::after{content:"▲";opacity:.9}
th.s[data-dir="-1"]::after{content:"▼";opacity:.9}
td{padding:10px 11px;border-bottom:.5px solid var(--line)}
tbody tr{transition:background .16s var(--ease)}
tbody tr:hover{background:var(--soft)}
tbody tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;margin-right:4px;display:inline-block}
.tag.fe{background:var(--accent-bg);color:var(--accent-t)}
.tag.be{background:var(--pro-bg);color:var(--pro-t)}
.badge{font-size:11.5px;padding:3px 9px;border-radius:7px;font-weight:550}
.badge.run{color:var(--ok);background:var(--ok-bg)}
.badge.access{color:var(--accent-t);background:var(--accent-bg)}
.badge.down{color:var(--danger);background:var(--danger-bg)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--danger)} .dot.unk{background:var(--t3)}
/* warn 原本没有样式 —— 用到它的地方会渲染成一个透明点,状态直接看不见。
   与自愈规则那处 failed 是同一个坑:没定义的状态不会变绿,但会变成「不存在」。 */
.dot.warn{background:var(--warn)}
.chartbox{position:relative;width:100%;height:186px}
.chartbox.sm{height:152px} .chartbox.xs{height:118px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:13px;border-bottom:.5px solid var(--line)}
.row:last-child{border-bottom:none}
.btn{font-size:12.5px;padding:7px 14px;border:.5px solid var(--line);background:var(--card);
  color:var(--t1)!important;border-radius:9px;cursor:pointer;display:inline-block;
  transition:all .18s var(--ease)}
.btn:hover{background:var(--soft);text-decoration:none;transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0) scale(.985)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--t2);font-size:12px;padding:6px 12px;border-radius:8px;
  cursor:pointer;transition:all .18s var(--ease)}
.seg button:hover{color:var(--t1)}
.seg button:active{transform:scale(.96)}
.seg button.on{background:var(--card);color:var(--t1);font-weight:600;box-shadow:var(--shadow)}

/* 用量条 */
.ub{background:var(--card);border:.5px solid var(--line);border-radius:var(--r);padding:14px 15px;
  box-shadow:var(--shadow);transition:all .24s var(--ease)}
.ub:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.ub .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.track{height:8px;background:var(--soft);border-radius:99px;margin-top:10px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .7s var(--ease)}
.src{font-size:10.5px;padding:2px 7px;border-radius:5px;margin-left:7px;font-weight:500}
.src.auto{background:var(--ok-bg);color:var(--ok)} .src.manual{background:var(--soft);color:var(--t3)}
/* 开关 */
.tg{position:relative;display:inline-block;width:40px;height:22px;vertical-align:middle}
.tg input{opacity:0;width:0;height:0;position:absolute}
.tg .sl{position:absolute;inset:0;background:var(--line2);border-radius:99px;transition:.24s var(--ease);cursor:pointer}
.tg .sl:before{content:"";position:absolute;height:18px;width:18px;left:2px;top:2px;background:#fff;
  border-radius:50%;transition:.24s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tg input:checked + .sl{background:var(--ok)}
.tg input:checked + .sl:before{transform:translateX(18px)}
.tg .sl:active:before{width:22px}
.tg.ro .sl{cursor:not-allowed;opacity:.45}
/* 行动清单 */
.act{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:.5px solid var(--line)}
.act:last-child{border-bottom:none}
.act .ic{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}
.act .ic.bad{background:var(--danger)} .act .ic.warn{background:var(--warn)} .act .ic.ok{background:var(--ok)}
.act .t{font-size:13.5px;font-weight:550}
.act .d{font-size:12.5px;color:var(--t3);margin-top:2px}
/* 自愈规则 */
.rule{display:flex;gap:11px;align-items:flex-start;padding:11px 2px;border-bottom:.5px solid var(--line)}
.rule:last-child{border-bottom:none}
.rule .ic{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.rule .ic.ok{background:var(--ok)}.rule .ic.warn{background:var(--warn)}
.rule .ic.acted{background:var(--accent)}.rule .ic.pending{background:var(--t3)}
.rule .ic.failed{background:var(--danger)}.rule .ic.unknown{background:var(--t3)}
/* 状态词:颜色只是辅助通道,状态本身必须能读出来(小圆点在弱视/色觉差异下不可靠) */
.rst{font-size:10px;padding:1px 6px;border-radius:5px;margin-left:6px;font-weight:600}
.rst.failed{background:var(--danger-bg);color:var(--danger)}
.rst.unknown{background:var(--warn-bg);color:var(--warn)}
.rst.warn{background:var(--warn-bg);color:var(--warn)}
.rule .rn{font-size:13px;font-weight:550}
.rule .rt{font-size:12px;color:var(--t2);margin-top:2px}
.rule .rd{font-size:12px;color:var(--t3);margin-top:2px}
.eng{font-size:10px;padding:1px 6px;border-radius:5px;margin-left:6px;font-weight:500}
.eng.builtin{background:var(--accent-bg);color:var(--accent-t)}
.eng.selfheal{background:var(--ok-bg);color:var(--ok)}
/* 供应商卡 */
.vcard{background:var(--card);border:.5px solid var(--line);border-radius:15px;padding:16px;
  display:flex;flex-direction:column;gap:11px;box-shadow:var(--shadow);
  transition:all .24s var(--ease)}
.vcard:hover{box-shadow:var(--shadow-lift);transform:translateY(-3px);border-color:var(--line2)}
.vhead{display:flex;align-items:center;gap:9px}
.vhead .nm{font-size:15px;font-weight:650}
.vrole{font-size:12px;color:var(--t3);line-height:1.55;margin-top:-6px}
.vsec{font-size:10.5px;color:var(--t3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.chip{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:7px;margin:0 5px 5px 0;font-weight:500}
.chip.ok{color:var(--ok);background:var(--ok-bg)}
.chip.warn{color:var(--warn);background:var(--warn-bg)}
.chip.danger{color:var(--danger);background:var(--danger-bg)}
.vmetrics{display:flex;flex-wrap:wrap;gap:8px}
.vmetric{background:var(--soft);border-radius:9px;padding:7px 11px;min-width:72px;transition:background .18s var(--ease)}
.vcard:hover .vmetric{background:color-mix(in srgb,var(--soft) 70%,var(--accent-bg))}
.vmetric .l{font-size:10.5px;color:var(--t3)}
.vmetric .v{font-size:14px;font-weight:650;margin-top:1px}
/* 贡献网格 */
.hmwrap{overflow-x:auto;padding-bottom:5px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;width:max-content}
.hm i{width:11px;height:11px;border-radius:2.5px;background:var(--h0);display:block;
  transition:transform .14s var(--ease)}
.hm i:hover{transform:scale(1.45);cursor:crosshair}
.hm i.l1{background:var(--h1)}.hm i.l2{background:var(--h2)}.hm i.l3{background:var(--h3)}.hm i.l4{background:var(--h4)}
.hmmon{display:grid;grid-auto-flow:column;gap:3px;width:max-content;font-size:10px;color:var(--t3);margin-bottom:4px;height:14px}
.hmleg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--t3);margin-top:9px;justify-content:flex-end}
.hmleg i{width:11px;height:11px;border-radius:2.5px;background:var(--h0);display:block}
.hmleg i.l1{background:var(--h1)}.hmleg i.l2{background:var(--h2)}.hmleg i.l3{background:var(--h3)}.hmleg i.l4{background:var(--h4)}
/* 骨架屏 */
.sk{background:linear-gradient(90deg,var(--soft) 25%,var(--line) 37%,var(--soft) 63%);
  background-size:400% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:7px;color:transparent!important}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
/* toast */
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,22px);z-index:60;opacity:0;
  background:var(--t1);color:var(--bg);padding:11px 20px;border-radius:11px;font-size:13.5px;
  box-shadow:var(--shadow-lift);transition:all .3s var(--ease);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
.err{background:var(--danger-bg);color:var(--danger);padding:13px 15px;border-radius:11px;font-size:13px}
.warnbox{background:var(--warn-bg);color:var(--warn);padding:12px 15px;border-radius:11px;font-size:13px;margin-bottom:14px}
.lock{border:1.5px dashed var(--line2);border-radius:15px;padding:24px 18px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:9px;color:var(--t3);text-align:center;
  transition:all .24s var(--ease)}
.lock:hover{border-color:var(--accent);background:var(--accent-bg)}
.fade{animation:fade .34s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.bar-mini{display:flex;align-items:flex-end;gap:2px;height:22px}
.bar-mini i{flex:1;background:var(--accent);border-radius:1.5px;opacity:.75;min-height:2px;
  transition:height .5s var(--ease)}

/* ---------- 仓库宇宙 ---------- */
.uni{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(120% 100% at 50% 0%,#f0f1f5 0%,#e9eaef 45%,#e3e4ea 100%);
  box-shadow:var(--shadow)}
@media (prefers-color-scheme:dark){
  .uni{background:radial-gradient(120% 100% at 50% 0%,#171a24 0%,#12141b 48%,#0d0f14 100%);
    border-color:#2a2d38}
}
.uni canvas{display:block;width:100%;height:520px;touch-action:none;cursor:grab}
.uni canvas:active{cursor:grabbing}
.uni .ubar{position:absolute;top:11px;left:12px;right:12px;display:flex;gap:7px;flex-wrap:wrap;
  align-items:center;pointer-events:none}
.uni .ubar>*{pointer-events:auto}
.uchip{font-size:11.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);
  background:color-mix(in srgb,var(--card) 82%,transparent);color:var(--t2);cursor:pointer;
  font-weight:550;backdrop-filter:blur(8px);transition:all .18s var(--ease);user-select:none}
.uchip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.uchip:active{transform:translateY(0) scale(.96)}
.uchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.uchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.uni .ustat{margin-left:auto;font-size:11.5px;color:var(--t3);padding:5px 11px;border-radius:999px;
  background:color-mix(in srgb,var(--card) 70%,transparent);backdrop-filter:blur(8px)}
.utip{position:absolute;pointer-events:none;z-index:5;min-width:172px;max-width:268px;
  background:var(--card);border:1px solid var(--line2);border-radius:11px;padding:11px 13px;
  box-shadow:var(--shadow-lift);font-size:12.5px;line-height:1.66;opacity:0;
  transform:translateY(5px);transition:opacity .16s var(--ease),transform .16s var(--ease)}
.utip.on{opacity:1;transform:none}
.utip b{font-size:13.5px} .utip .k{color:var(--t3);margin-right:7px}
.utip .row{display:flex;justify-content:space-between;gap:12px}
.uni .uhint{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--t3);
  background:color-mix(in srgb,var(--card) 62%,transparent);padding:4px 10px;border-radius:999px;
  backdrop-filter:blur(6px);pointer-events:none}
.ulegend{display:flex;gap:15px;flex-wrap:wrap;font-size:11.5px;color:var(--t3);margin-top:9px}
/* ---- 仓库画像 ---- */
.portrait{margin-top:13px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.psec{font-size:12.5px;font-weight:650;color:var(--t1);margin:17px 0 9px;
  padding-top:13px;border-top:.5px solid var(--line)}
.psec:first-of-type{border-top:0;padding-top:0}
.psec .muted{font-weight:400;font-size:11.5px;margin-left:6px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:9px}
.pstat{background:var(--soft);border-radius:9px;padding:9px 11px}
.pstat .k{font-size:11px;color:var(--t3)}
.pstat .v{font-size:19px;font-weight:640;margin-top:2px;letter-spacing:-.02em}
.pstat .v .u{font-size:12px;font-weight:400;color:var(--t3)}
.pstat .s{font-size:11px;color:var(--t3);margin-top:1px}
.pbars{display:flex;align-items:flex-end;gap:3px;height:46px;margin-top:11px}
.pbars i{flex:1;background:var(--accent);border-radius:2px 2px 0 0;opacity:.82;min-height:2px}
.plang{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--soft)}
.plang i{display:block;height:100%}
.plegend{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--t3);margin-top:7px}
.plegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.pcoup{display:flex;flex-direction:column;gap:7px}
.crow{display:grid;grid-template-columns:minmax(88px,auto) 1fr auto auto minmax(0,1.4fr);
  gap:9px;align-items:center;font-size:12.5px}
.crow .nm{font-weight:560}
.crow .bar{height:5px;background:var(--soft);border-radius:3px;overflow:hidden}
.crow .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.crow .muted{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psubs{display:flex;gap:7px;flex-wrap:wrap}
@media(max-width:640px){.crow{grid-template-columns:1fr auto auto}.crow .bar,.crow .muted{display:none}}
.ulegend i{display:inline-block;width:15px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
/* ---------- 「更多」气泡:三个整页出口收成一个 ---------- */
.more{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:550;
  padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  color:var(--t2);cursor:pointer;transition:all .18s var(--ease)}
.more:hover{border-color:var(--line2);color:var(--t1);transform:translateY(-1px)}
.more:active{transform:translateY(0) scale(.97)}
.more.on{background:var(--soft);border-color:var(--line2);color:var(--t1)}
.more:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.more i{width:0;height:0;border:4px solid transparent;border-top-color:currentColor;
  margin-top:3px;transition:transform .2s var(--ease)}
.more.on i{transform:rotate(180deg);margin-top:-3px}
.ext{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 9px);min-width:212px;background:var(--card);
  border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow-lift);padding:6px;
  opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;
  transition:opacity .17s var(--ease),transform .17s var(--ease);z-index:50}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.pop a{display:block;padding:9px 11px;border-radius:8px;text-decoration:none;
  transition:background .14s var(--ease)}
.pop a:hover{background:var(--soft)}
.pop a b{display:block;font-size:13px;color:var(--t1);font-weight:600}
.pop a span{display:block;font-size:11.5px;color:var(--t3);margin-top:1px}
.seg.big button{font-size:13.5px;padding:8px 18px}
/* ---------- 容量结论卡 ---------- */
.cap{border-left:4px solid var(--sc,var(--ok))}
.cap summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap}
.cap summary::-webkit-details-marker{display:none}
.cap summary .exp{font-size:12px;color:var(--t3);display:inline-flex;align-items:center;gap:5px;
  transition:color .16s var(--ease)}
.cap summary:hover .exp{color:var(--accent)}
.cap summary .exp i{width:0;height:0;border:4px solid transparent;border-top-color:currentColor;
  transition:transform .2s var(--ease)}
.cap[open] summary .exp i{transform:rotate(180deg)}
.cap .sig{display:grid;grid-template-columns:auto auto 1fr;gap:6px 12px;align-items:baseline;
  font-size:12.5px;margin-top:11px}
.cap .sig .lv{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.cap .rule{color:var(--t3);font-size:11.5px}
/* ---------- 业务流矩阵 ---------- */
table.mx td.fc{cursor:pointer;position:relative}
table.mx td.fc:hover{background:var(--soft)}
table.mx td.fc.on{background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent)}
table.mx td.fc .mm{color:var(--warn);font-weight:700;font-size:11px;margin-left:3px}
table.mx td.fc .ds{color:var(--danger);font-weight:700;font-size:11px;margin-left:2px}
table.mx td.fc .wk{color:var(--warn);font-weight:700;font-size:12px;margin-left:2px}
/* ---------- 业务基线矩阵 ---------- */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:5px}
table.mx th{white-space:nowrap;font-size:11.5px}
table.mx td.mxc{text-align:center;padding-left:0;padding-right:0;cursor:help}
table.mx td.mxc .dot{margin:0;transition:transform .16s var(--ease)}
table.mx td.mxc:hover .dot{transform:scale(1.55)}
tr.mxr{cursor:pointer;transition:background .16s var(--ease)}
tr.mxr:hover{background:var(--soft)}
tr.mxr.on{background:var(--accent-bg)}
tr.mxr.on td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
/* 端到端链路 */
.chain{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:5px}
.chain .seg{flex:1 0 116px;border:1px solid var(--line);border-left-width:3px;border-left-color:var(--sc);
  border-radius:9px;padding:9px 11px;background:var(--soft);transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.chain .seg:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.chain .segh{font-size:12px;font-weight:650;color:var(--t1);display:flex;align-items:center;gap:6px}
.chain .segh i{width:8px;height:8px;border-radius:50%;background:var(--sc);flex:0 0 auto}
.chain .segv{font-size:11.5px;color:var(--t2);margin-top:5px;line-height:1.55}
.chain .arw{flex:0 0 14px;align-self:center;height:2px;background:var(--line2);position:relative}
.chain .arw::after{content:'';position:absolute;right:0;top:-3px;border:4px solid transparent;
  border-left-color:var(--line2)}
/* 逐日图上的「上游还没发布」占位 */
.pend{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--warn);
  background:var(--warn-bg);padding:4px 10px;border-radius:999px;font-weight:550}
.arrive{animation:arrive 1.6s var(--ease)}
@keyframes arrive{0%{box-shadow:0 0 0 0 var(--ok)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
/* ---------- 时间轴 ---------- */
/* 未来时间轴(续费) */
.tlFuture{position:relative;padding:8px 0 20px}
.tlFuture .tick{position:absolute;top:2px;bottom:22px;width:.5px;background:var(--line);pointer-events:none}
.tlFuture .tick.lbl{position:absolute;top:-17px;transform:translateX(-50%);font-size:9.5px;color:var(--t3);white-space:nowrap;background:0;width:auto}
.tlFuture .row{position:relative;height:30px;margin-bottom:4px}
.tlFuture .bar{position:absolute;top:5px;left:0;height:22px;border-radius:7px;display:flex;align-items:center;padding:0 10px;font-size:12.5px;font-weight:600;color:#fff;min-width:42px}
.tlFuture .bar .tld{font-size:10.5px;opacity:.8;margin-left:5px}
/* 历史时间轴(共享刻度) */
.tlTrackHist{width:560px;margin:0 auto}
.tlfHdr{display:flex;height:20px;margin-bottom:4px;font-size:10.5px;color:var(--t3);position:relative}
.tlfHdr .mo{position:absolute;transform:translateX(-50%);white-space:nowrap;font-weight:550}
.tlfHdr .mo.now{color:var(--accent);font-weight:650}
.tlfGrid{position:relative;width:100%}
.tlfGrid .vline{position:absolute;top:-6px;bottom:0;width:.5px;background:var(--line);pointer-events:none}
.tlfGrid .tr{position:relative;height:25px;margin-bottom:6px}
.tlfGrid .tr .lbl{position:absolute;right:101%;top:4px;font-size:12.5px;font-weight:600;color:var(--t1);white-space:nowrap;text-align:right;padding-right:12px;display:flex;align-items:center;gap:5px}
.tlfGrid .tr .lbl .tag{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:550}
.tlfGrid .tr .seg{position:absolute;top:0;height:100%;border-radius:4px}
.tlfGrid .tr .seg.hist{background:var(--t3);opacity:.55}
.tlfGrid .tr .seg.cur-ok{background:var(--ok)}
.tlfGrid .tr .seg.cur-bad{background:var(--danger)}
.tlNow{position:absolute;top:-8px;bottom:0;width:1.5px;background:var(--accent);border-radius:1px;z-index:3}
.tlNow::after{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:8px;height:8px;background:var(--accent);border-radius:50%;box-shadow:0 0 0 2px rgba(42,120,214,.15)}
/* 动画 */
@keyframes tlBarIn{from{opacity:0;transform:translateX(-16px) scaleX(.9)}to{opacity:1;transform:translateX(0) scaleX(1)}}
@keyframes tlRowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes tlSegIn{from{opacity:0;transform:scaleX(.15)}to{opacity:1;transform:scaleX(1)}}
@keyframes tlNowIn{0%{opacity:0;transform:scale(.2)}60%{transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}

<div class="wrap">
  <div class="head">
    <div><h1 id="ptitle">云平台总览</h1><div class="muted" id="subtitle">正在连接…</div></div>
    <div style="display:flex;gap:10px;align-items:center">

</div>
<div id="toast"></div>

<script src="vendor/chart.umd.min.js"></script>
<script>
const D=document, C=Chart;
/* ★★ 图表一律**同步画**,不走动画。
   实测(2026-07-27):带动画时全站每一张 Chart 都是**纯空白** —— canvas 有实例、
   尺寸正常、数据正确,但 173,280 个像素里 alpha 全为 0。根因是 Chart.js 的动画
   只在 requestAnimationFrame 回调里推进,而实测这个渲染环境 600ms 内**一帧 rAF 都没触发**,
   于是永远停在「柱高为 0」的第一帧。同一 canvas 换成 animation:false 立刻画出 54,557 个像素。
   这已经是本项目第四次栽在「rAF 不触发」上(隐藏页数值滚动冻结、后台标签页星图位图
   停在 300×150、切页首帧、以及这次)。**凡是画到屏幕上的东西都不能只依赖 rAF**,
   要么同步画一次,要么在没拿到帧时仍能给出终值。 */
C.defaults.animation=false;
C.defaults.font.family='-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif';
const dark=matchMedia('(prefers-color-scheme:dark)').matches;
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
const ink='#8b8a83', grid=dark?'rgba(139,138,131,.16)':'rgba(139,138,131,.14)';
const PAL=['#2a78d6','#0f8a4d','#eda100','#4a3aa7','#e87ba4','#e34948','#1baf7a','#eb6834','#5a9bea','#9085e9'];
const REFRESH=15000;

let S=null, PREV=null, CAN_EDIT=false, PROBED=false, MOUNTED=null, lastAt=0;  // MOUNTED 用 null 哨兵:'' 是合法路由,首次加载必须挂载

/* ========== 4 个入口:总览 + 3 个二级 ========== */
const PAGES=[
  {id:'',       name:'总览'},
  {id:'flow',   name:'业务流'},   // 软件**内部**功能实现程度:业务基线 × 各项目自定义阶段
  {id:'runtime',name:'运行'},
  {id:'cost',   name:'成本'},
  {id:'timeline',name:'时间轴'},
  {id:'github', name:'GitHub'},
];
// 「运行」页内的分段:软件基线 / 主机与自愈。**分段不是二级入口**,不进 PAGES。
const RSEGS=[{id:'base',name:'软件基线'},{id:'host',name:'主机与自愈'}];
let RSEG=(localStorage.getItem('rseg')||'base');
/* ★ 路由必须**归一到已知入口**,不能把未知 hash 原样当路由用。
   实测 bug:访问 #/ops 时 paint() 回落画了总览的 HTML,但 MOUNTED 仍是 'ops',
   于是 sync() 里 `MOUNTED===''` 的那些分支(drawCapacity 等)全部不执行 ——
   页面看着是总览,「容量与升级」却整段空白。回落必须在**路由这一层**做,只做一次。 */
const RAWROUTE=()=> (location.hash||'#/').replace(/^#\/?/,'').split('?')[0];
const ROUTE=()=> PAGES.some(p=>p.id===RAWROUTE())?RAWROUTE():'';

/* ========== 工具 ========== */
const esc=s=>String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const q=s=>D.querySelector(s), qa=s=>[...D.querySelectorAll(s)];
function fmtBytes(b){if(b==null)return '—';const u=['B','KB','MB','GB','TB'];let i=0,v=b;
  while(v>=1024&&i<u.length-1){v/=1024;i++}return v.toFixed(i>0&&v<100?1:0)+' '+u[i]}
const fmtKB=k=>fmtBytes((k||0)*1024);
const num=n=>n==null?'—':n.toLocaleString('en-US');
function toast(m){const t=q('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400)}

/* 数字滚动:让实时更新看得见 */
function setNum(el,val,fmt){
  if(!el)return; fmt=fmt||(v=>Math.round(v).toLocaleString('en-US'));
  const from=Number(el.dataset.v||0), to=Number(val)||0;
  el.dataset.v=to;
  // 先把最终值落定:页面隐藏时 rAF 根本不触发,只靠动画会把数字冻在旧值上
  el.textContent=fmt(to);
  if(reduced||from===to||D.hidden)return;
  const t0=performance.now(), dur=520;
  const tick=t=>{const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    el.textContent=fmt(from+(to-from)*e); if(p<1)requestAnimationFrame(tick); else el.textContent=fmt(to);};
  requestAnimationFrame(tick);
}
function setText(el,v){if(el&&el.textContent!==v)el.textContent=v}

/* ========== 图表:就地更新,不销毁重建 ========== */
let _ch={};
function chart(id,cfg){
  const el=D.getElementById(id); if(!el)return;
  const ex=_ch[id];
  if(ex&&ex.config.type===cfg.type&&ex.data.datasets.length===cfg.data.datasets.length){
    ex.data.labels=cfg.data.labels;
    cfg.data.datasets.forEach((d,i)=>{Object.keys(d).forEach(k=>{ex.data.datasets[i][k]=d[k]})});
    if(cfg.options&&cfg.options.scales)ex.options.scales=cfg.options.scales;
    ex.update(reduced?'none':undefined); return;
  }
  if(ex)ex.destroy();
  _ch[id]=new C(el,cfg);
}
const AX={ticks:{color:ink},grid:{color:grid}};
const baseOpt=extra=>Object.assign({responsive:true,maintainAspectRatio:false,
  interaction:{mode:'index',intersect:false},
  plugins:{legend:{display:false},tooltip:{backgroundColor:dark?'#26261f':'#1b1b19',padding:10,
    cornerRadius:8,titleFont:{size:12},bodyFont:{size:12}}}},extra||{});
function line(id,labels,data,color,opt){chart(id,{type:'line',data:{labels,datasets:[{data,borderColor:color,
  backgroundColor:(color||'#2a78d6')+'1f',fill:true,tension:.32,borderWidth:2,
  pointRadius:0,pointHoverRadius:4,pointHitRadius:14}]},
  options:baseOpt(Object.assign({scales:{y:{beginAtZero:true,...AX},x:{ticks:{color:ink,maxTicksLimit:7},grid:{display:false}}}},opt||{}))})}
function bars(id,labels,data,horiz,fmt){chart(id,{type:'bar',
  data:{labels,datasets:[{data,backgroundColor:labels.map((_,k)=>PAL[k%PAL.length]),borderRadius:5,
    hoverBackgroundColor:labels.map((_,k)=>PAL[k%PAL.length])}]},
  options:baseOpt({indexAxis:horiz?'y':'x',
    plugins:{legend:{display:false},tooltip:{callbacks:fmt?{label:c=>fmt(c.parsed[horiz?'x':'y'])}:{}}},
    scales:{x:{ticks:{color:ink},grid:{color:grid,display:!horiz}},y:{ticks:{color:ink},grid:{color:grid,display:horiz}}}})})}
function donut(id,labels,data,colors){chart(id,{type:'doughnut',
  data:{labels,datasets:[{data,backgroundColor:colors||labels.map((_,k)=>PAL[k%PAL.length]),
    borderWidth:2,borderColor:dark?'#1d1d1b':'#fff',hoverOffset:6}]},
  options:baseOpt({cutout:'62%',plugins:{legend:{position:'right',labels:{color:ink,boxWidth:10,
    font:{size:11},padding:9}},tooltip:{}}})})}
function sparkSVG(vals,color){
  if(!vals||vals.length<2)return '';
  const mx=Math.max(...vals,1), w=74, h=30;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-(v/mx)*h*.86-2).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
}

/* ========== 贡献网格 ========== */
const MON=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
function heatmap(cal,unit){
  const days=(cal&&cal.days)||[]; if(!days.length)return '<div class="muted">暂无数据</div>';
  const mx=cal.max||1;
  const lvl=c=>c<=0?0:(c>=mx*.66?4:(c>=mx*.33?3:(c>=mx*.12?2:1)));
  const pad=new Date(days[0].d+'T00:00:00').getDay();
  const slots=Array(pad).fill(null).concat(days), cols=[];
  for(let i=0;i<slots.length;i+=7)cols.push(slots.slice(i,i+7));
  const cells=slots.map(x=>x?`<i class="${lvl(x.c)?'l'+lvl(x.c):''}" title="${x.d} · ${x.c}${unit||''}"></i>`
    :'<i style="visibility:hidden"></i>').join('');
  let lm=-1;
  const mons=cols.map(col=>{const f=col.find(Boolean); if(!f)return '<span></span>';
    const m=new Date(f.d+'T00:00:00').getMonth();
    if(m!==lm){lm=m;return `<span>${MON[m]}</span>`} return '<span></span>';}).join('');
  return `<div class="hmwrap"><div class="hmmon" style="grid-template-columns:repeat(${cols.length},11px)">${mons}</div>
    <div class="hm">${cells}</div></div>
    <div class="hmleg"><span>少</span><i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span>多</span></div>`;
}
const scrollHM=()=>qa('.hmwrap').forEach(w=>{w.scrollLeft=w.scrollWidth});

/* ========== 派生洞察:零成本,纯算 ========== */
function drawCapacity(){
  const c=S.capacity, el=q('#capCard');
  if(!el)return;
  if(!c){el.innerHTML='<div class="muted">容量判定尚未产出</div>';return}
  const tone={ok:'var(--ok)',warn:'var(--warn)',bad:'var(--danger)'}[c.level]||'var(--ok)';
  const LV={ok:['达标','ok'],watch:['可忽略','ok'],tight:['紧张','warn'],crit:['告急','bad']};
  const h=c.headroom||{};
  const key=c.at+'|'+c.verdict;
  if(el.dataset.k===key)return;                 // 结论没变就不重绘,免得展开态被冲掉
  el.dataset.k=key;
  const wasOpen=el.open;
  el.style.setProperty('--sc',tone);
  el.innerHTML=`<summary>
      <span><b style="font-size:15px;color:${tone}">${esc(c.verdict)}</b>
        <span class="muted" style="margin-left:9px">${esc(c.why)}</span></span>
      <span class="exp">展开分析<i></i></span></summary>
    <div class="grid k4" style="margin-top:14px">
      <div class="kpi"><div class="lab">部署余量</div><div class="val">
        <span class="v">${h.slots??'—'}</span><span class="u"> 个应用</span></div>

function insights(s){
  const out=[]; const push=(lv,t,d)=>out.push({lv,t,d});
  const h=s.host||{}, o=s.ops||{}, g=s.github||{};
  (s.projects||[]).filter(p=>p.status==='down').forEach(p=>
    push('bad',`${p.name} 探测失败`,`地址 ${p.url||'内部服务'} 未返回可用状态`));
  if(h.disk_pct>=85)push('bad','磁盘吃紧',`已用 ${h.disk_pct}%,自愈会在 85% 自动清理`);
  else if(h.disk_pct>=75)push('warn','磁盘偏高',`已用 ${h.disk_pct}%,低于 85% 触发线`);
  if(h.mem_pct>=90)push('warn','内存偏高',`已用 ${h.mem_pct}%`);
  (s.usage||[]).forEach(u=>{if(!u.limit)return;const p=u.used/u.limit*100;
    if(p>=80)push('bad',`${u.label} 接近额度`,`${p.toFixed(1)}% 已用`);
    else if(p>=50)push('warn',`${u.label} 过半`,`${p.toFixed(1)}% 已用${u.eta_date?' · 预计触顶 '+u.eta_date:''}`);});
  if(o.cert&&o.cert.days!=null&&o.cert.days<=14)push('warn','证书临近到期',`${o.cert.date} · 剩 ${o.cert.days} 天(自动续期)`);
  /* ★ 订阅到期:**全部订阅**,提前 7 天变红。
     老口径只看 OVH 一条 —— 7 条订阅覆盖 1 条,实测 ChatGPT Pro20x 剩 7 天时页面一点提示都没有。
     又一次「口径只覆盖子集却当成全局」。 */
  const sb=o.subs||{};
  (sb.items||[]).filter(x=>x.level!=='ok').forEach(x=>
    push(x.level, `${x.name} ${x.days<=0?'已到期':'即将扣费'}`,
      `${x.date} · 剩 ${x.days} 天${x.auto_renew?' · 自动续费开着':' · 自动续费没开'}`));
  /* ★ 算不出到期日的**必须单独报**。算不出不等于没事 —— 这类最容易漏。 */
  if((sb.blind||[]).length)
    push('warn', `${sb.blind.length} 条订阅盯不住`,
      sb.blind.map(x=>x.name).join('、')+' —— 没登记购买日期，到期前不会有任何提醒');
  if(o.backup&&!o.backup.ok)push('bad','备份异常',`上次备份 ${o.backup.at||'无记录'}`);
  if(g.available&&g.ci_fail>0)push('warn',`${g.ci_fail} 个仓 CI 失败`,'默认分支最近一次运行未通过');
  (s.selfheal&&s.selfheal.rules||[]).filter(r=>!r.armed).forEach(r=>
    push('warn',`自愈未就绪:${r.name}`,r.detail||''));
  if(s.updated_epoch&&(Date.now()/1000-s.updated_epoch)>180)
    push('bad','快照停更','采集器可能已停,元自愈会尝试自动重跑');
  /* ★ 以下三段以前**完全没进这个函数**,所以顶栏会在「建议升级 / 8 个项目未登记 /
     有可疑格」当屏的情况下依然显示「全部健康」—— 徽章只看基础设施,等于替另外三个
     维度背书。健康分同理(它就是数 insights 得出的)。这类「口径只覆盖一部分却对外
     宣称全局」的假绿,是这个站反复犯的同一个错。 */
  const cap=s.capacity;
  if(cap&&cap.level==='bad')push('bad','容量告急:'+cap.verdict,cap.why||'');
  else if(cap&&cap.level==='warn')push('warn','容量紧张:'+cap.verdict,cap.why||'');
  const sw=s.software;
  if(sw&&(sw.unregistered||[]).length)
    push('bad',`${sw.unregistered.length} 个运行单元未登记`,
      '部署即登记:主机上真在跑但没有归属,属治理违规');
  const fl=s.flow;
  if(fl){
    const un=(fl.unregistered||[]).length;
    if(un)push('warn',`${un} 个项目未登记业务流`,'有治理文件却没发布 flow.yaml 到 main');
    const ft=fl.totals||{};
    const stuck=(ft.blocked||0)+(ft.blocked_by_input||0)+(ft.not_built||0);
    if(stuck)push('bad',`业务流 ${stuck} 格不通`,
      `等你给材料 ${ft.blocked_by_input||0} · 断了 ${ft.blocked||0} · 没做 ${ft.not_built||0}`);
    const susp=(ft.mismatch||0)+(ft.coupling_violation||0);
    if(susp)push('warn',`业务流 ${susp} 格可疑`,
      `自报≠实测 ${ft.mismatch||0} · 违反耦合 ${ft.coupling_violation||0}`);
    // 「没有实测」本身就是一条待办 —— 不标出来,0% 覆盖的自报绿就会被当成已验证
    // ★ 分母同样用可测格子(见指标卡处的说明),否则这条提醒的门槛会被
    //   「大片没做」拉低,反而在真的没实测时不报。
    const meas=fl.measurable_total||0;
    if(meas&&(fl.verified_total||0)*2<meas)
      push('warn','业务流实测覆盖不足一半',
        `${fl.verified_total||0}/${meas} 格可测的有机器实测,其余仅被测方自报`);
  }
  if(!out.length)push('ok','一切正常','没有需要你处理的事项');
  const rank={bad:0,warn:1,ok:2};
  return out.sort((a,b)=>rank[a.lv]-rank[b.lv]);
}
function healthScore(s){
  const ins=insights(s);
  const bad=ins.filter(i=>i.lv==='bad').length, warn=ins.filter(i=>i.lv==='warn').length;
  // 每档封顶:insights 现在覆盖四个维度(基础设施/容量/运行登记/业务流),
  // 不封顶的话某一个维度多报几条就能把分数打到 0,分数就没有区分度了。
  return Math.max(0,100-Math.min(60,bad*18)-Math.min(25,warn*6));
}

/* 视图切换统一走这里:能用 View Transitions 就用(整页交叉淡入,最丝滑),
   不支持则退回 CSS 动画。之前每次切页都是硬替换 innerHTML,所以显得割裂。 */
function paint(V){

/* ============ 仓库宇宙 v2 ============
   全仓全项目的耦合星图。数据来自 data/graph.json(服务器 cron 纯派生),
   前端只负责画:不请求任何第三方、不调用任何模型,符合 0 Agent / 0 Token 约束。

   v1 的问题与这版的对策(都是实测出来的,不是重构癖):
   ┌ 布局每帧都在跑力学 ─→ 标签逐帧重新避让,一直在闪;每次进页重新收敛,位置整体跳变。
   │   对策:**布局与动画彻底分离**。力学只在「拓扑变了」时跑一次并冻结,标签位置随之
   │        一次算定;动画层只做相机缓动、悬停过渡、能量流与呼吸,永不改变布局。
   ├ 后台标签页加载时 clientWidth 恒为 0 ─→ 首帧 fit 失败后帧循环直接 return 且不再排帧,
   │   位图永远停在 300×150(实测确认)。对策:尺寸没就绪就**继续排帧等**,而不是退出。
   ├ ResizeObserver 每次挂载都新建、从不断开 ─→ 反复切页累积。对策:单例 + 卸载时断开。
   ├ 力学的回心力与全局尺度约束互相拉扯 ─→ 星系持续缓慢漂移。对策:冻结后不再有力。
   └ 拖拽结束没释放 pointer capture。对策:释放。
*/

/* 稳定散列:同一个 id 每次刷新都落在同一处,图不会每次重排 */
function uhash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
  return (h>>>0)/4294967295}

const uniVisible=n=>(n.kind==='project'||n.kind==='store')?!!U.show.infra:true;

  if(n.kind==='repo_private')return 13;
  if(n.kind==='project')return 8.5;
  if(n.kind==='store')return 7;
  return 3.4;
}

/* ---------- 数据同步:只更新数值与增删,不碰布局 ---------- */
function uniSync(g){
  if(!g||!g.nodes)return;
  const now=performance.now();
  const seen=new Set();
  g.nodes.forEach(raw=>{
    seen.add(raw.id);
    let n=U.n.get(raw.id);
    if(!n){
      n={id:raw.id,label:raw.label,kind:raw.kind,meta:Object.assign({},raw),
         x:0,y:0,vx:0,vy:0,born:now,flash:now,gone:0,orbit:uhash(raw.id+'o')*Math.PI*2,placed:false};
      U.n.set(raw.id,n);
    }else{
      // 数值变了就闪一下:这是「动态」的来源,不需要任何额外请求
      if(n.meta.commits7!==raw.commits7||n.meta.status!==raw.status||n.label!==raw.label)n.flash=now;
      Object.assign(n.meta,raw); n.label=raw.label; n.kind=raw.kind; n.gone=0;
    }
    n.r=uniRadius(n); n.color=uniColor(n);
  });
  U.n.forEach(n=>{ if(!seen.has(n.id)&&!n.gone)n.gone=now; });
  U.e=g.edges||[]; U.g=g;
  // 拓扑签名:只有节点集/连线集真的变了才重新布局,否则位置一动不动
  const sig=g.nodes.map(n=>n.id).sort().join('|')+'##'
           +U.e.map(e=>e.s+'>'+e.t+e.rel).sort().join('|')+'##'+(U.show.infra?1:0);
  if(sig!==U.sig){U.sig=sig; U.frozen=false;}
  uniStat();
}
function uniStat(){
  const st=U.box&&U.box.querySelector('.ustat');
  if(!st||!U.g)return;                       // uniSync 可能早于 uniMount:挂载后再补一次
  const co=U.e.filter(e=>e.rel==='co_change').length;
  st.textContent=`${U.g.counts.nodes} 星体 · ${co} 条共变耦合 · ${U.g.generated_at||''}`;
}

/* ---------- 布局:确定性分层环,一次算定 ----------
   ★ v2 用的是力导向(340 步迭代 + 全局包围盒归一)。实测下来它有一个**结构性**问题,
     不是调参能解决的:节点之间只有斥力、回心力又被包围盒约束抵消,平衡态必然是
     「全部挤在外圈、中心一个大空洞」,耦合边只能横穿这个空洞 —— 也就是 owner 看到的那张图。
     力学还有两个附带毛病:参数一动整张图重排(不可复算),以及每次收敛结果都略有不同。
   ★ 这版改成**确定性布局**:层次本来就在数据里(供应商←项目←代码仓),直接按环摆。
     好处不只是好看 —— 同一份数据每次刷新画出来完全一样,可复核;没有收敛过程,
     也就没有抖动、漂移和「进页跳变」;标签靠构造分开,整套避让搜索可以删掉。 */
function uniLayoutOnce(){
  const all=[...U.n.values()].filter(n=>!n.gone);
  if(!all.length)return;
  /* 环压扁多少,由画布长宽比反推:画布是 2.2:1 的扁条,布局却按 1.25:1 铺,
     fit 就只能按高度缩,左右白掉一大片。让布局的长宽比跟着画布走。 */
  const AR=(U.box&&U.box.w&&U.box.h)?U.box.w/U.box.h:1.9;
  const YK=Math.max(0.42,Math.min(0.85,1/AR));
  const by=k=>all.filter(n=>n.kind===k);
  const vendors=by('vendor'), stores=by('store'), projects=by('project');
  const repos=all.filter(n=>n.kind==='repo'||n.kind==='repo_private');

  // 关系索引:布局要按**真实关系**摆,不能靠 id 字符串猜(旧代码切 id 前缀认母仓)
  const rel=(r)=>{const m=new Map();
    for(const e of U.e)if(e.rel===r)m.set(e.s,e.t);
    return m};
  const srcRepo=rel('源码在'), inRepo=rel('属于'), onVendor=rel('数据存于');

  // ① 供应商:中心小菱形。它们是所有东西的落脚点,放中心,中心就不会是空的。
  vendors.sort((a,b)=>a.id.localeCompare(b.id));
  vendors.forEach((n,i)=>{
    const th=-Math.PI/2+i*2*Math.PI/Math.max(1,vendors.length);
    n.x=Math.cos(th)*RING.vendor; n.y=Math.sin(th)*RING.vendor*YK; n.th=th;
  });

  /* ② 代码仓排环:先做一次**贪心序列化**,把耦合强的仓排到相邻位置。
     这样 18 条共变耦合大多是短弧,而不是横跨整张图的长弦 —— 图的可读性主要来自这一步。 */
  const wOf=new Map();
  for(const e of U.e){
    if(e.rel!=='co_change')continue;
    wOf.set(e.s+'|'+e.t,e.w||0.3); wOf.set(e.t+'|'+e.s,e.w||0.3);
  }
  const cw=n=>repos.reduce((s,m)=>s+(wOf.get(n.id+'|'+m.id)||0),0);
  const pool=repos.slice().sort((a,b)=>cw(b)-cw(a)||a.id.localeCompare(b.id));
  const order=[];
  if(pool.length){
    order.push(pool.shift());
    while(pool.length){
      const last=order[order.length-1];
      let bi=0,bw=-1;
      pool.forEach((m,i)=>{const w=wOf.get(last.id+'|'+m.id)||0; if(w>bw){bw=w;bi=i}});
      order.push(pool.splice(bi,1)[0]);
    }
  }
  // 扇区宽度按「该仓名下有多少项目」分配,项目多的仓给更宽的角度,项目才摊得开
  const kids=new Map(order.map(r=>[r.id,[]]));
  for(const p of projects){const r=srcRepo.get(p.id); if(kids.has(r))kids.get(r).push(p)}
  const orphan=projects.filter(p=>!kids.has(srcRepo.get(p.id)));
  const wt=order.map(r=>1+kids.get(r.id).length*0.85);
  const total=wt.reduce((a,b)=>a+b,0)+(orphan.length?orphan.length*0.85:0);
  let acc=0;
  order.forEach((r,i)=>{
    const span=2*Math.PI*wt[i]/Math.max(1e-6,total);
    const th=-Math.PI/2+acc+span/2;               // 从正上方顺时针铺开
    r.x=Math.cos(th)*RING.repo; r.y=Math.sin(th)*RING.repo*YK; r.th=th; r.span=span;
    // ③ 项目落在**它自己源码仓的扇区**里 —— 于是「源码在」那条边几乎是径向的,不交叉
    const ks=kids.get(r.id);
    ks.forEach((p,j)=>{
      const t=ks.length===1?th:(th-span*0.34+span*0.68*j/(ks.length-1));
      p.x=Math.cos(t)*RING.project; p.y=Math.sin(t)*RING.project*YK; p.th=t;
    });
    acc+=span;
  });
  orphan.forEach((p,j)=>{                          // 没有源码仓的项目:补在剩下的角度里
    const t=-Math.PI/2+acc+(j+0.5)*2*Math.PI*0.85/Math.max(1e-6,total);
    p.x=Math.cos(t)*RING.project; p.y=Math.sin(t)*RING.project*YK; p.th=t;
  });

  // ④ 存储:挂在它所存的那个供应商的方向上,同一供应商下的多个存储散开一点
  const perV=new Map();
  stores.forEach(s=>{const v=onVendor.get(s.id)||'';(perV.get(v)||perV.set(v,[]).get(v)).push(s)});
  for(const [vid,list] of perV){
    const v=U.n.get(vid);
    const base=v&&v.th!=null?v.th:-Math.PI/2;
    list.forEach((s,j)=>{
      const t=base+(j-(list.length-1)/2)*0.42;
      s.x=Math.cos(t)*RING.store; s.y=Math.sin(t)*RING.store*YK; s.th=t;
    });
  }

  // ⑤ 子项目:母仓的卫星。母仓按「属于」关系认,不再切 id 字符串
  for(const n of all){
    if(n.kind!=='subproject')continue;
    n.host=U.n.get(inRepo.get(n.id))||null;
    n.orbR=n.host?n.host.r+16+uhash(n.id+'d')*13:0;
    n.orbSpeed=0.00040*(1+uhash(n.id)*0.7);
    if(n.host&&n.x==null){n.x=n.host.x;n.y=n.host.y}
  }

  for(const n of all){n.vx=n.vy=0}
  U.frozen=true;
  uniFit();
  uniPlaceLabels();
}

/* ---------- 标签:靠**构造**分开,不靠搜索 ----------
   环上相邻两个仓之间有几百像素,标签一律沿半径朝外放就不可能撞;
   供应商在中心,标签放正下方。于是 v2 那套「四个候选位 + 矩形相交检测」整段可以删掉。 */
function uniPlaceLabels(){
  if(!U.cx||!U.box||!U.box.w)return;
  const cx=U.cx;
  U.labels=[];
  for(const n of U.n.values()){
    const big=n.kind==='vendor'||n.kind==='repo'||n.kind==='repo_private';
    if(!big||!uniVisible(n)||n.gone){n.lab=null;continue}
    cx.font=(n.kind==='vendor'?'600 12.5px':'560 11.5px')+' -apple-system,"PingFang SC",sans-serif';
    const tw=cx.measureText(n.label).width, r=n.r*U.cam.z;
    if(n.kind==='vendor'){n.lab={ox:0,oy:r+7,tw};continue}
    /* 方向取**实际坐标**的朝外向量,不取扇区角:环被压成椭圆之后,
       角度方向和「离中心更远」的方向已经不是一回事了。 */
    const d=Math.hypot(n.x,n.y)||1, dx=n.x/d, dy=n.y/d;
    n.lab={ox:dx*(r+10+tw/2), oy:dy*(r+10)+(dy>=0?13:-6), tw};
  }
}

const uT=(n)=>[n.x*U.cam.z+U.cam.x+U.box.w/2, n.y*U.cam.z+U.cam.y+U.box.h/2];

function uniFit(pad){
  pad=pad||46;
  const ns=[...U.n.values()].filter(n=>uniVisible(n)&&!n.gone);
  if(!ns.length||!U.box||!U.box.w)return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const n of ns){
    x0=Math.min(x0,n.x-n.r); x1=Math.max(x1,n.x+n.r);
    y0=Math.min(y0,n.y-n.r); y1=Math.max(y1,n.y+n.r+20);
  }
  const z=Math.max(0.35,Math.min(2.2,
    Math.min((U.box.w-pad*2)/Math.max(1,x1-x0),(U.box.h-pad*2)/Math.max(1,y1-y0))));
  U.camT={z, x:-((x0+x1)/2)*z, y:-((y0+y1)/2)*z};
  if(!U.cam.z||U.cam.z===1)Object.assign(U.cam,U.camT);      // 首帧直接到位,不做入场缓动
}

/* ---------- 星尘背景:离屏缓存,只在尺寸变化时重画 ---------- */
function uniSky(){
  const W=U.box.w, H=U.box.h, key=W+'x'+H+(dark?'d':'l');
  if(U.skyKey===key&&U.sky)return U.sky;
  const c=document.createElement('canvas');
  c.width=W*U.dpr; c.height=H*U.dpr;
  const g=c.getContext('2d'); g.setTransform(U.dpr,0,0,U.dpr,0,0);
  const neb=g.createRadialGradient(W*0.5,H*0.1,10,W*0.5,H*0.1,Math.max(W,H)*1.05);
  if(dark){neb.addColorStop(0,'#1B2030');neb.addColorStop(.45,'#131722');neb.addColorStop(1,'#0C0E14')}
  else{neb.addColorStop(0,'#F2F3F8');neb.addColorStop(.45,'#EAECF2');neb.addColorStop(1,'#E2E4EC')}
  g.fillStyle=neb; g.fillRect(0,0,W,H);
  for(let i=0;i<190;i++){
    const x=uhash('sx'+i)*W, y=uhash('sy'+i)*H, s=uhash('sr'+i);
    g.globalAlpha=(dark?0.13:0.10)+s*(dark?0.30:0.16);
    g.fillStyle=dark?'#CFD8EE':'#6E7690';
    const r=s<0.86?0.9:1.7;
    g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  U.sky=c; U.skyKey=key;
  return c;
}

/* ---------- 绘制 ---------- */
function uniDraw(now){
  const cx=U.cx, W=U.box.w, H=U.box.h;
  now=now||performance.now();
  cx.clearRect(0,0,W,H);
  cx.drawImage(uniSky(),0,0,W,H);

  const idx=U.n;
  const active=U.focus||U.hover;
  const near=new Set();
  if(active){near.add(active.id);
    for(const e of U.e){if(e.s===active.id)near.add(e.t);if(e.t===active.id)near.add(e.s)}}
  const ht=U.hoverT;                              // 0→1 的高亮过渡量,避免瞬变

  const vis=e=>e.rel==='co_change'?U.show.co:(e.rel==='stack'?U.show.stack:U.show.infra);
  // ——— 连线:二次贝塞尔 + 辉光。曲线比直线更能让密集连线区分开 ———
  for(let pass=0;pass<2;pass++){                  // pass0 = 辉光底,pass1 = 实线
    for(const e of U.e){
      if(!vis(e))continue;
      const a=idx.get(e.s), b=idx.get(e.t);
      if(!a||!b||!uniVisible(a)||!uniVisible(b))continue;
      const [ax,ay]=uT(a), [bx,by]=uT(b);
      const hot=active&&(e.s===active.id||e.t===active.id);
      let col,w,dash=null;
      if(e.rel==='co_change'){
        const tr=e.trend||0;
        col=tr>0.08?'#0F8A4D':(tr<-0.08?'#C98500':'#2A78D6');
        w=0.7+(e.w||0)*2.2;                      // 上限约 2.9px:再粗就成丝带,盖掉星体
      }else if(e.rel==='stack'){col='#8E8D85'; w=1; dash=[3,6];}
      else{col=dark?'#5A5A52':'#B9B8AE'; w=0.9;}
      const base=e.rel==='co_change'?0.46:0.26;
      let al=hot?0.98:(active?0.06+0.04*(1-ht):base*(1-ht*0.82));
      if(pass===0&&!(hot||(!active&&e.rel==='co_change')))continue;
      const mx=(ax+bx)/2, my=(ay+by)/2, dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy)||1;
      let qx,qy;
      if(e.rel==='co_change'){
        /* ★ 层次边捆绑:控制点朝**星系中心**拉。仓已经按耦合强度排过环,
           大多数耦合是相邻仓之间的短弧;少数跨半圈的强耦合被拉成向内的弦,
           成束地贴着中心走,而不是各走各的直线把中间那片空白劈得七零八落。 */
        // β 只拉到 0.40:再大,弧束就压到中心那圈供应商星体上了 —— 中心是骨架,不是走线区
        const cx0=U.cam.x+W/2, cy0=U.cam.y+H/2, beta=0.40;
        qx=mx+(cx0-mx)*beta; qy=my+(cy0-my)*beta;
      }else{
        // 基础设施/同栈边是径向的,给一点垂直偏移,免得同向的几条叠成一根
        const bend=Math.min(26,len*0.10)*(uhash(e.s+e.t)>0.5?1:-1);
        qx=mx-dy/len*bend; qy=my+dx/len*bend;
      }
      cx.save();
      cx.globalAlpha=pass===0?al*0.20:al;
      cx.strokeStyle=col; cx.lineCap='round';
      cx.lineWidth=pass===0?Math.min(11,w*2.6):w*(hot?1.6:1);
      if(dash)cx.setLineDash(dash);
      cx.beginPath(); cx.moveTo(ax,ay); cx.quadraticCurveTo(qx,qy,bx,by); cx.stroke();
      cx.restore();
      // 能量流:沿曲线运动的粒子。强度越高越密,方向即耦合走向。
      if(pass===1&&e.rel==='co_change'&&!reduced&&(hot||!active)){
        const cnt=Math.max(1,Math.round((e.w||0)*3));
        cx.save(); cx.fillStyle=col;
        for(let i=0;i<cnt;i++){
          const p=((now/2800)+i/cnt+uhash(e.s+e.t))%1, q=1-p;
          const px=q*q*ax+2*q*p*qx+p*p*bx, py=q*q*ay+2*q*p*qy+p*p*by;
          cx.globalAlpha=(hot?0.95:0.38)*Math.sin(p*Math.PI);
          cx.beginPath(); cx.arc(px,py,hot?2.5:1.7,0,7); cx.fill();
        }
        cx.restore();
      }
    }
  }

  // ——— 卫星轨道(先画轨道线,再画卫星,才有层次) ———
  /* ★ 锁定某个仓时,它的子项目要能**看清名字**。轨道上随机相位的四个卫星
     经常挤在同一侧,标签直接叠成一坨(实测 KMOS 的 KMFA/KMIDS/KMDatabase/whkmSalary
     就是这样)。锁定即停转并按序号均分一圈 —— 锁定的目的本来就是看细节。 */
  const focusHost=(U.focus&&(U.focus.kind==='repo'||U.focus.kind==='repo_private'))?U.focus.id:null;
  const sibIdx=new Map();
  if(focusHost){
    const sibs=[...idx.values()].filter(x=>x.kind==='subproject'&&x.host&&x.host.id===focusHost)
      .sort((a,b)=>a.id<b.id?-1:1);
    sibs.forEach((x,i)=>sibIdx.set(x.id,[i,sibs.length]));
  }
  for(const n of idx.values()){
    if(n.kind!=='subproject'||!n.host||!uniVisible(n))continue;
    const pin=sibIdx.get(n.id);
    if(pin){n.orbit=-Math.PI/2+pin[0]*2*Math.PI/Math.max(1,pin[1]);}
    else n.orbit+=n.orbSpeed*16;
    const [hx,hy]=uT(n.host), R=n.orbR*U.cam.z;
    if(R>6&&(!active||near.has(n.host.id))){
      cx.save(); cx.globalAlpha=active?0.30:0.13; cx.strokeStyle=KINDC.subproject;
      cx.setLineDash([2,4]); cx.lineWidth=0.8;
      cx.beginPath(); cx.ellipse(hx,hy,R,R*0.62,0,0,7); cx.stroke(); cx.restore();
    }
    n.x=n.host.x+Math.cos(n.orbit)*n.orbR;
    n.y=n.host.y+Math.sin(n.orbit)*n.orbR*0.62;
  }

  // ——— 星体:外辉光 → 球体渐变 → 边缘高光 ———
  for(const n of [...idx.values()].sort((a,b)=>a.r-b.r)){
    if(!uniVisible(n))continue;
    const [x,y]=uT(n);
    const dimmed=active&&!near.has(n.id);
    const age=(now-n.born)/900, fl=Math.max(0,1-(now-n.flash)/1300);
    const dying=n.gone?Math.max(0,1-(now-n.gone)/1400):0;
    if(n.gone&&dying<=0){idx.delete(n.id);continue}
    const grow=(age<1&&!reduced)?0.35+0.65*(1-Math.pow(1-age,3)):1;
    const breathe=reduced?1:1+0.022*Math.sin(now/1900+uhash(n.id)*7);
    const r=Math.max(1.2,n.r*U.cam.z*grow*breathe*(n.gone?dying:1));
    const act=Math.min(1,(n.meta.commits7||0)/120);
    cx.save();
    cx.globalAlpha=(dimmed?0.16+0.10*(1-ht):1)*(n.gone?dying:1);

    if(age<1&&!reduced){                          // 新星爆发
      cx.save();cx.globalAlpha*=1-age;cx.strokeStyle=n.color;cx.lineWidth=2;
      cx.beginPath();cx.arc(x,y,r+age*36,0,7);cx.stroke();cx.restore();
    }
    if(n.gone){cx.strokeStyle='#CF3A3A';cx.lineWidth=1.6;
      cx.beginPath();cx.arc(x,y,r+(1-dying)*26,0,7);cx.stroke()}

    const glowR=r*(1.9+act*2.2+fl*1.8);
    if(glowR>r){
      const gr=cx.createRadialGradient(x,y,r*0.5,x,y,glowR);
      gr.addColorStop(0,n.color+(dark?'70':'55')); gr.addColorStop(1,n.color+'00');
      cx.fillStyle=gr; cx.beginPath(); cx.arc(x,y,glowR,0,7); cx.fill();
    }
    if(n.kind==='vendor'){                        // 星系核:一圈暗晕 + 外环
      cx.fillStyle=dark?'rgba(255,255,255,.040)':'rgba(20,20,15,.038)';
      cx.beginPath();cx.arc(x,y,r*2.2,0,7);cx.fill();
      cx.strokeStyle=dark?'rgba(255,255,255,.10)':'rgba(20,20,15,.10)';
      cx.lineWidth=1; cx.beginPath();cx.arc(x,y,r*2.2,0,7);cx.stroke();
    }
    const sp=cx.createRadialGradient(x-r*0.34,y-r*0.4,r*0.06,x,y,r);
    sp.addColorStop(0,uniLighten(n.color,0.46));
    sp.addColorStop(0.62,n.color);
    sp.addColorStop(1,uniLighten(n.color,-0.30));
    cx.fillStyle=sp; cx.beginPath(); cx.arc(x,y,r,0,7); cx.fill();
    if(r>5){                                      // 边缘高光,让球有体积
      cx.strokeStyle=uniLighten(n.color,0.55); cx.globalAlpha*=0.5; cx.lineWidth=0.9;
      cx.beginPath(); cx.arc(x,y,r-0.5,Math.PI*1.05,Math.PI*1.75); cx.stroke();
      cx.globalAlpha/=0.5;
    }
    if(n.meta.ci_ok===false){cx.strokeStyle='#CF3A3A';cx.lineWidth=2.2;
      cx.beginPath();cx.arc(x,y,r+4,0,7);cx.stroke()}
    if(active&&n.id===active.id){
      cx.strokeStyle=dark?'#fff':'#1B1B19'; cx.lineWidth=1.6;
      cx.beginPath();cx.arc(x,y,r+5+2*Math.sin(now/380),0,7);cx.stroke();
    }
    cx.restore();
  }

  // ——— 标签:位置在布局时算定,这里只画;悬停时额外显示邻居小标签 ———
  cx.save();
  for(const n of idx.values()){
    if(!uniVisible(n)||n.gone)continue;
    const near_=active&&near.has(n.id);
    const lab=n.lab;
    if(!lab&&!near_)continue;
    const [x,y]=uT(n);
    const dimmed=active&&!near.has(n.id);
    cx.font=(n.kind==='vendor'?'600 12.5px':'560 11.5px')+' -apple-system,"PingFang SC",sans-serif';
    const tw=lab?lab.tw:cx.measureText(n.label).width;
    let ox=lab?lab.ox:0, oy=lab?lab.oy:(n.r*U.cam.z+6);
    if(!lab&&n.kind==='subproject'&&n.host){        // 卫星:相对母星朝外,避免与兄弟重叠
      const vx=n.x-n.host.x, vy=n.y-n.host.y, d=Math.hypot(vx,vy)||1;
      ox=vx/d*(n.r*U.cam.z+9+tw/2); oy=vy/d*(n.r*U.cam.z+9)+(vy>=0?9:-19);
    }
    cx.globalAlpha=dimmed?0.18:(lab&&lab.crowded&&!near_?0.55:1);
    cx.fillStyle=dark?'rgba(8,10,16,.62)':'rgba(255,255,255,.80)';
    cx.beginPath();
    const bx=x+ox-tw/2-5, by=y+oy;
    if(cx.roundRect)cx.roundRect(bx,by,tw+10,16,5); else cx.rect(bx,by,tw+10,16);
    cx.fill();
    cx.fillStyle=dark?'#E9E8E1':'#2E2D28';
    cx.textAlign='center'; cx.textBaseline='top';
    cx.fillText(n.label,x+ox,by+2);
  }
  cx.restore();
}

function uniLighten(hex,amt){
  const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');
  if(!m)return hex;
  const v=parseInt(m[1],16);
  const f=c=>Math.max(0,Math.min(255,Math.round(amt>=0?c+(255-c)*amt:c*(1+amt))));
  return '#'+[f(v>>16&255),f(v>>8&255),f(v&255)].map(c=>c.toString(16).padStart(2,'0')).join('');
}

/* ---------- 帧循环 ---------- */
function uniFrame(now){
  U.raf=0;
  if(!U.box||!U.cv||!U.cv.isConnected)return;                 // 已卸载:停
  if(D.hidden){U.raf=requestAnimationFrame(uniFrame);return}  // 隐藏页:rAF 本就不触发,排着即可
  // ★ 后台加载时 clientWidth 恒为 0,首帧 fit 必然失败。
  //   v1 在这里 return 且不再排帧 —— 于是位图永远停在 300×150(实测确认)。
  //   正确做法是**继续排帧等尺寸就绪**,而不是退出循环。
  if(!U.box.w||!U.cv.clientWidth){
    if(!U.prime||!U.prime()){U.raf=requestAnimationFrame(uniFrame);return}
  }
  if(!U.frozen)uniLayoutOnce();
  // 相机缓动 + 高亮过渡:所有变化都有过渡,不做瞬变
  const k=reduced?1:0.16;
  U.cam.x+=(U.camT.x-U.cam.x)*k; U.cam.y+=(U.camT.y-U.cam.y)*k; U.cam.z+=(U.camT.z-U.cam.z)*k;
  U.hoverT+=(((U.focus||U.hover)?1:0)-U.hoverT)*(reduced?1:0.18);
  uniDraw(now);
  U.raf=requestAnimationFrame(uniFrame);
}
function uniKick(){ if(!U.raf&&U.box)U.raf=requestAnimationFrame(uniFrame); }

function uniHit(mx,my){
  let best=null,bd=1e9;
  for(const n of U.n.values()){
    if(n.gone||!uniVisible(n))continue;
    const [x,y]=uT(n), d=Math.hypot(mx-x,my-y);
    if(d<Math.max(12,n.r*U.cam.z+8)&&d<bd){bd=d;best=n}
  }
  return best;
}

function uniTip(n,mx,my){
  const tip=U.box.querySelector('.utip');
  if(!n){tip.classList.remove('on');return}
  const m=n.meta, R=(k,v)=>v==null||v===''?'':`<div class="row"><span class="k">${k}</span><span>${v}</span></div>`;

function uniUnmount(){
  if(U.raf){cancelAnimationFrame(U.raf);U.raf=0}
  if(U.ro){U.ro.disconnect();U.ro=null}     // v1 每次挂载都新建 observer 且从不断开
  U.box=null;U.cv=null;U.cx=null;U.hover=null;U.focus=null;U.sky=null;U.skyKey='';
}

function uniMount(id){
  const box=D.getElementById(id); if(!box)return;
  uniUnmount();
  U.box=box; U.cv=box.querySelector('canvas'); U.cx=U.cv.getContext('2d');
  const fit=()=>{
    const w=U.cv.clientWidth, h=U.cv.clientHeight;
    if(!w||!h)return false;
    U.dpr=Math.max(1,Math.min(2,devicePixelRatio||1));   // <1 会让位图比 CSS 还小,糊
    if(U.cv.width!==Math.round(w*U.dpr)||U.cv.height!==Math.round(h*U.dpr)){
      U.cv.width=Math.round(w*U.dpr); U.cv.height=Math.round(h*U.dpr);
    }
    U.cx.setTransform(U.dpr,0,0,U.dpr,0,0);
    const changed=(U.box.w!==w||U.box.h!==h);
    U.box.w=w; U.box.h=h;
    if(changed){U.sky=null; if(U.frozen){uniFit();uniPlaceLabels()}}
    return true;
  };
  U.fit=fit;
  // ★ 首帧必须**同步**画出来,不能只交给 rAF ——
  //   隐藏/后台标签页里 rAF 根本不触发,只靠动画帧的话画布会一直空着。
  //   (这是本项目第 N 次踩 rAF-hidden;v1 就是靠同步首帧才没出这个问题,v2 重写时丢了。)
  const prime=()=>{ if(!fit())return false; if(!U.frozen)uniLayoutOnce(); Object.assign(U.cam,U.camT); uniDraw(performance.now()); return true; };
  U.prime=prime;
  U.ro=new ResizeObserver(()=>{ if(prime())uniKick(); });
  U.ro.observe(U.cv);
  prime(); uniStat();

  const pos=ev=>{const r=U.cv.getBoundingClientRect();return [ev.clientX-r.left,ev.clientY-r.top]};
  U.cv.onpointerdown=ev=>{
    const [x,y]=pos(ev); const n=uniHit(x,y);
    try{U.cv.setPointerCapture(ev.pointerId)}catch(e){}
    U.drag={sx:x,sy:y,cx:U.camT.x,cy:U.camT.y,node:n,moved:false,lx:0,ly:0,id:ev.pointerId};
  };
  U.cv.onpointermove=ev=>{
    const [x,y]=pos(ev);
    if(U.drag){
      const dx=x-U.drag.sx, dy=y-U.drag.sy;
      if(Math.abs(dx)+Math.abs(dy)>3)U.drag.moved=true;
      if(U.drag.node){
        U.drag.node.x+=dx/U.cam.z-U.drag.lx; U.drag.node.y+=dy/U.cam.z-U.drag.ly;
        U.drag.lx=dx/U.cam.z; U.drag.ly=dy/U.cam.z;
        uniPlaceLabels();                       // 拖动改变了布局,标签跟着重新算定一次
      }else{U.camT.x=U.drag.cx+dx; U.camT.y=U.drag.cy+dy}
      uniKick(); return;
    }
    const n=uniHit(x,y);
    if(n!==U.hover){U.hover=n;U.cv.style.cursor=n?'pointer':'grab'}
    uniTip(U.focus||n,x,y); uniKick();
  };
  const endDrag=ev=>{
    const moved=U.drag&&U.drag.moved, n=U.drag&&U.drag.node;
    if(U.drag){try{U.cv.releasePointerCapture(U.drag.id)}catch(e){}}
    U.drag=null;
    if(!moved){
      U.focus=(U.focus&&n&&U.focus.id===n.id)?null:n;
      uniPortrait(U.focus);
      if(U.focus){                              // 聚焦:相机平滑推到该星体
        U.camT.z=Math.min(2.0,Math.max(1.15,U.camT.z));
        U.camT.x=-U.focus.x*U.camT.z; U.camT.y=-U.focus.y*U.camT.z;
      }else uniFit();
      const [x,y]=pos(ev); uniTip(U.focus||uniHit(x,y),x,y);
    }
    uniKick();
  };
  U.cv.onpointerup=endDrag;
  U.cv.onpointercancel=()=>{U.drag=null};
  U.cv.ondblclick=()=>{U.focus=null;uniTip(null);uniPortrait(null);uniFit();uniPlaceLabels();uniKick()};
  U.cv.onpointerleave=()=>{if(!U.drag){U.hover=null;if(!U.focus)uniTip(null);uniKick()}};
  U.cv.onwheel=ev=>{ev.preventDefault();
    const [x,y]=pos(ev), k=Math.exp(-ev.deltaY*0.0016);
    const z=Math.max(0.35,Math.min(3.2,U.camT.z*k)), f=z/U.camT.z;
    U.camT.x=x-U.box.w/2-(x-U.box.w/2-U.camT.x)*f;
    U.camT.y=y-U.box.h/2-(y-U.box.h/2-U.camT.y)*f;
    U.camT.z=z; uniKick();};
  U.cv.onkeydown=ev=>{                          // 键盘可达:不能只有鼠标能用
    const step=60;
    if(ev.key==='ArrowLeft')U.camT.x+=step; else if(ev.key==='ArrowRight')U.camT.x-=step;
    else if(ev.key==='ArrowUp')U.camT.y+=step; else if(ev.key==='ArrowDown')U.camT.y-=step;
    else if(ev.key==='+'||ev.key==='=')U.camT.z=Math.min(3.2,U.camT.z*1.2);
    else if(ev.key==='-')U.camT.z=Math.max(0.35,U.camT.z/1.2);
    else if(ev.key==='0'){U.focus=null;uniPortrait(null);uniFit()}
    else return;
    ev.preventDefault(); uniKick();};
  box.querySelectorAll('.uchip').forEach(b=>b.onclick=()=>{
    const t=b.dataset.t;
    if(t==='reset'){U.focus=null;uniTip(null);uniPortrait(null);uniFit();uniPlaceLabels();uniKick();return}
    U.show[t]=U.show[t]?0:1;
    b.classList.toggle('on',!!U.show[t]); b.setAttribute('aria-pressed',String(!!U.show[t]));
    U.sig=''; U.frozen=false;                   // 显隐改变了参与布局的集合,重新收敛一次
    uniKick();});
  uniKick();
}

    const dc=v.status.ok===true?'ok':(v.status.ok===false?'bad':'unk');
    return `<div class="vcard"><div class="vhead"><span class="dot ${dc}"></span><span class="nm">${esc(v.name)}</span></div>
      <div class="vrole">${esc(v.role)}</div>
      <div><div class="vsec">状态</div><div style="font-size:13px">${esc(v.status.note)}</div></div>
      <div><div class="vsec">成本</div><div style="font-size:13px">${esc(v.cost)}</div></div>
      <div><div class="vsec">潜在风险</div><div>${risks}</div></div>
      <div><div class="vsec">监控 / 健康</div><div class="vmetrics">${hm}</div></div></div>`;
  }).join('');
  // 网格
  const cal=g.calendar||{}, dc=s.deploy_calendar||{};
  setText(q('#ghCalMeta'),cal.total!=null?`一年 ${num(cal.total)} 次 · 单日最多 ${cal.max}`:'—');
  setText(q('#depCalMeta'),dc.total!=null?`共 ${num(dc.total)} 次 · 自 ${dc.since||'—'}`:'—');
  const gh=q('#ghCal'), dp=q('#depCal');
  if(gh&&gh.dataset.k!==String(cal.total)){gh.innerHTML=heatmap(cal,' 次提交');gh.dataset.k=String(cal.total);scrollHM()}
  if(dp&&dp.dataset.k!==String(dc.total)){dp.innerHTML=heatmap(dc,' 次部署');dp.dataset.k=String(dc.total);scrollHM()}
  // 图
  const n=hist.t.length, from=Math.max(0,n-1440), idx=[];
  for(let i=from;i<n;i+=Math.max(1,Math.floor((n-from)/110)))idx.push(i);
  const p2=x=>('0'+x).slice(-2);
  chart('oHost',{type:'line',data:{labels:idx.map(i=>{const d=new Date(hist.t[i]*1000);return p2(d.getHours())+':'+p2(d.getMinutes())}),
    datasets:[{label:'内存',data:idx.map(i=>hist.mem[i]),borderColor:'#eda100',borderWidth:2,pointRadius:0,tension:.32,fill:false},
              {label:'磁盘',data:idx.map(i=>hist.disk[i]),borderColor:'#0f8a4d',borderWidth:2,pointRadius:0,tension:.32,fill:false}]},
    options:baseOpt({plugins:{legend:{display:true,labels:{color:ink,boxWidth:9,font:{size:10}}},tooltip:{}},
      scales:{y:{min:0,max:100,ticks:{color:ink,stepSize:25},grid:{color:grid}},x:{ticks:{color:ink,maxTicksLimit:5},grid:{display:false}}}})});
  line('oDep',s.deploy.d7_labels,s.deploy.d7_data,'#2a78d6');
  const ci=s.cost.items.filter(i=>i.month_cost_aud>0);
  donut('oCost',ci.map(i=>i.name),ci.map(i=>i.month_cost_aud));
};
function kpiRow(sel,items){
  const box=q(sel); if(!box)return;
  if(box.children.length!==items.length){
    box.innerHTML=items.map(i=>`<div class="kpi ${i.tone?'tone-'+i.tone:''}">
      <div class="lab">${esc(i.lab)}</div>
      <div class="val"><span class="v"></span><span class="u">${esc(i.unit||'')}</span></div>
      <div class="sub"></div>${i.spark||''}</div>`).join('');
  }
  [...box.children].forEach((el,k)=>{
    const i=items[k];
    setNum(el.querySelector('.v'),i.val,i.fmt);
    setText(el.querySelector('.sub'),i.sub||'');
    if(i.tone)el.className='kpi tone-'+i.tone;
  });
}

function chainHTML(ln,stages){

    <div class="chain">${stages.map((st,i)=>{
      const c=ln.cells[st.k], sc=SST[c.s];
