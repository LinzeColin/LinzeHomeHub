     <td data-v="${x.h60}"><b>${num(x.h60)}</b></td><td data-v="${x.h24}">${num(x.h24)}</td>
     <td class="muted" data-v="${x.all60}">${num(x.all60)}</td>
     <td class="muted" data-v="${x.all24}">${num(x.all24)}</td>
     <td data-v="${x.err24}" style="color:${x.err24?'var(--danger)':'var(--t3)'}">${num(x.err24)}</td></tr>`).join('');
  const tb=q('#lvRows'); if(tb&&tb.dataset.k!==rows.length+String(L.at)){tb.innerHTML=rows;tb.dataset.k=rows.length+String(L.at)}
  setText(q('#lvNote'),L.note||'');
}
SYNC['runtime']=function(){
  if(RSEG==='base'){syncBase();return}
  syncHost();
};
function syncHost(){
  const s=S,h=s.host||{},o=s.ops||{};
  drawLive();
  kpiRow('#rtKpis',[
    {lab:'内存',val:h.mem_pct,unit:'%',sub:'实时',tone:h.mem_pct>=90?'warn':'ok'},
    {lab:'磁盘',val:h.disk_pct,unit:'%',sub:fmtBytes(h.disk_used_b)+' / '+fmtBytes(h.disk_total_b),
      tone:h.disk_pct>=85?'bad':(h.disk_pct>=75?'warn':'ok')},
    {lab:'负载',val:parseFloat(h.load1||0),unit:'',fmt:v=>v.toFixed(2),sub:'1 分钟平均'},
    {lab:'在线',val:h.uptime_days,unit:' 天',sub:'容器重启 '+(o.restarts??0)},
    {lab:'证书',val:o.cert?o.cert.days:0,unit:' 天',sub:(o.cert&&o.cert.date||'—')+' 自动续',
      tone:(o.cert&&o.cert.days<=14)?'warn':'ok'},
  ]);
  const agentCol=a=>{const m={'无':'var(--ok)','低':'var(--ok)','中':'var(--warn)','高':'var(--danger)'};
    return `<span style="color:${m[a]||'var(--t2)'};font-weight:550">${esc(a||'—')}</span>`};
  const rows=(s.projects||[]).map(p=>{
    const nm=p.url?`<a href="${p.url}" target="_blank" rel="noopener">${esc(p.name)}</a>`:esc(p.name);
    const parts=(p.parts||[]).map(t=>`<span class="tag ${t==='前台'?'fe':'be'}">${t}</span>`).join('');
    const b={run:['run','运行中'],access:['access','Access 保护'],down:['down','离线']}[p.status]||['run','运行中'];
    const c=x=>`<td class="muted">${esc(x||'—')}</td>`;
    return `<tr><td data-v="${esc(p.name)}">${nm}</td><td>${parts}</td>${c(p.host)}${c(p.db)}${c(p.store)}${c(p.deploy)}${c(p.backup)}
      <td data-v="${esc(p.agent)}">${agentCol(p.agent)}</td>
      <td data-v="${p.status}"><span class="badge ${b[0]}">${b[1]}</span></td></tr>`;}).join('');
  const tb=q('#rtRows'); if(tb&&tb.dataset.k!==rows.length+':'+(s.updated_at||'')){tb.innerHTML=rows;tb.dataset.k=rows.length+':'+(s.updated_at||'')}
  // 趋势
  const seg=q('#rtSeg'); if(seg&&!seg.dataset.w){seg.dataset.w='1';
    seg.onclick=e=>{const b=e.target.closest('button');if(!b)return;TR=b.dataset.r;
      qa('#rtSeg button').forEach(x=>x.classList.toggle('on',x===b));drawHost()}}
  drawHost();
  setText(q('#rtMemNow'),' · 当前 '+(h.mem_pct??'—')+'%');
  setText(q('#rtDiskNow'),' · 当前 '+(h.disk_pct??'—')+'%');
  // 耦合
  const cnt=f=>{const m={};(s.projects||[]).forEach(p=>{const k=f(p)||'—';m[k]=(m[k]||0)+1});return m};
  const st=cnt(p=>(p.store&&p.store!=='无')?p.store:'无存储');
  bars('rtStore',Object.keys(st),Object.values(st),true);
  const ag=cnt(p=>'依赖:'+(p.agent||'—'));
  donut('rtAgent',Object.keys(ag),Object.values(ag),Object.keys(ag).map((k,i)=>k.includes('中')?'#eda100':(k.includes('高')?'#e34948':PAL[i%PAL.length])));
  const dp=cnt(p=>p.deploy); donut('rtDeploy',Object.keys(dp),Object.values(dp));
  // 自愈
  const sh=s.selfheal; if(sh){
    setText(q('#rtMainArm'),`${sh.main_armed}/${sh.main_total} 守护中`);
    setText(q('#rtMetaArm'),`${sh.meta_armed}/${sh.meta_total} 守护中`);
    const R=set=>(sh.rules||[]).filter(r=>(r.set||'main')===set).map(r=>{
      const st=['ok','warn','acted','pending'].includes(r.state)?r.state:'ok';
      const eng=r.engine==='builtin'?'<span class="eng builtin">内置</span>':'<span class="eng selfheal">自愈脚本</span>';
      const act=r.actions_total?`<span class="muted"> · 累计 ${r.actions_total}</span>`:'';
      const la=r.last_action?`<div class="rd" style="color:var(--accent)">最近:${esc(r.last_action)}</div>`:'';
      return `<div class="rule"><span class="ic ${st}"></span><div style="flex:1;min-width:0">
        <div class="rn">${esc(r.name)}${eng}${act}</div><div class="rt">${esc(r.threshold||'')}</div>
        <div class="rd">${esc(r.detail||'')}</div>${la}</div></div>`}).join('');
    q('#rtMain').innerHTML=R('main'); q('#rtMeta').innerHTML=R('meta');
    q('#rtHeal').innerHTML=(sh.recent||[]).slice(0,7).map(x=>
      `<div class="row"><span style="color:var(--t2)">${esc(x.at)} · ${esc(x.rule)}</span><span style="text-align:right">${esc(x.msg)}</span></div>`
    ).join('')||'<div class="muted" style="font-size:12.5px">一切正常,尚无需要出手的动作</div>';
  }
  q('#rtDeployLog').innerHTML=(s.deploy.log||[]).map(l=>
    `<div class="row"><span style="color:var(--t2)">${esc(l.at)} · ${esc(l.app)}</span>
     <span style="color:${l.ok?'var(--ok)':'var(--danger)'}">${l.ok?'成功':'失败'}</span></div>`).join('')||'<div class="muted">暂无</div>';
};
function drawHost(){
  const H=S.history||{}; let t1=Date.now()/1000,t0,win,ser;
  if(TR==='全部'){const d=H.day||{t:[]};t0=d.t.length?d.t[0]:t1-86400;win=t1-t0}
  else{win=RANGES.find(r=>r[0]===TR)[1];t0=t1-win}
  ser=(TR==='全部'||win>2678400)?(H.day||{t:[],mem:[],disk:[]}):(win<=86400?(H.min||{t:[],mem:[],disk:[]}):(H.hour||{t:[],mem:[],disk:[]}));
  const idx=[];for(let i=0;i<ser.t.length;i++)if(ser.t[i]>=t0&&ser.t[i]<=t1)idx.push(i);
  const p2=x=>('0'+x).slice(-2);
  const lb=idx.map(i=>{const d=new Date(ser.t[i]*1000);
    return win<=86400?p2(d.getHours())+':'+p2(d.getMinutes()):p2(d.getMonth()+1)+'-'+p2(d.getDate())});
  const o={scales:{y:{min:0,max:100,ticks:{color:ink,stepSize:25},grid:{color:grid}},
    x:{ticks:{color:ink,maxTicksLimit:7},grid:{display:false}}}};
  line('rtMem',lb,idx.map(i=>ser.mem[i]),'#eda100',o);
  line('rtDisk',lb,idx.map(i=>ser.disk[i]),'#0f8a4d',o);
  const gran=(TR==='全部'||win>2678400)?'1天':(win<=86400?'1分钟':'1小时');
  setText(q('#rtNote'),idx.length<2?'该时段数据还在累积':`区间 ${TR}:${idx.length} 个采样点,${gran}粒度`);
}

    {label:'失败',data:br.map(r=>r.failure||0),backgroundColor:'#e34948',stack:'s',borderRadius:4}]},
    options:baseOpt({indexAxis:'y',plugins:{legend:{display:true,labels:{color:ink,boxWidth:9,font:{size:10}}},tooltip:{}},
      scales:{x:{stacked:true,ticks:{color:ink},grid:{color:grid}},y:{stacked:true,ticks:{color:ink}}}})});
  // Traffic —— 上游新鲜度必须先讲清楚,否则「图不动」会被误读成本站坏了
  const tt=t.totals_14d||{}, fr=t.freshness||{};
  const eta=fr.next_eta_epoch?new Date(fr.next_eta_epoch*1000):null;
  const justIn=fr.last_arrival_epoch&&(Date.now()/1000-fr.last_arrival_epoch)<3600;
  const fe=q('#gFresh');
  if(fe){
    fe.className='card'+(justIn?' arrive':'');
    fe.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <b style="font-size:14px">上游数据新鲜度</b>
      ${fr.lag_days?`<span class="pend">GitHub 滞后 ${fr.lag_days} 天</span>`
        :'<span class="chip ok">已是最新</span>'}</div>
      <div style="font-size:13px;color:var(--t2);margin-top:9px;line-height:1.85">
      GitHub 的浏览/克隆<b>已发布到 ${esc(fr.upstream_through||'—')}</b>;
      ${(fr.pending_days||[]).length?`<b>${(fr.pending_days||[]).map(esc).join('、')}</b> 上游还没发布,
        所以图上<b>不画这几天</b>——补 0 就是编造数据。`:''}
      <br><span class="muted">GitHub 的 traffic 接口一天只发布一次、且恒定滞后约 2 天,
      这是上游限制,任何采集频率都改变不了。本站已把探测压到 <b>每 15 分钟一次</b>,
      新数据一发布就会被抓到并在这里高亮。</span>
      <br>上次到达 <b>${fr.last_arrival_epoch?new Date(fr.last_arrival_epoch*1000).toLocaleString('zh-CN'):'—'}</b>
      · 下批预计 <b>${eta?eta.toLocaleString('zh-CN'):'—'}</b>
      <span class="muted">(按实测到达间隔 ${((fr.arrival_period_sec||86400)/3600).toFixed(0)}h 推算)</span>
      <br><b style="color:var(--accent)">想看真正实时的访问,请看「运行 → 本站实时访问」</b>
      <span class="muted">——那是本站自己的日志,每分钟都在变。</span></div>`;
  }
  kpiRow('#gTrafKpi',[
    {lab:'浏览 14d',val:tt.views||0,unit:''},
    {lab:'克隆 14d',val:tt.clones||0,unit:''},
    {lab:'上游滞后',val:fr.lag_days||0,unit:' 天',sub:'截止 '+(fr.upstream_through||'—'),
      tone:(fr.lag_days||0)>3?'warn':'ok'},
    {lab:'已归档',val:t.archived_days||0,unit:' 天',sub:'自 '+(t.archive_since||'—')},
  ]);
  const dd=t.daily||[], pend=(fr.pending_days||[]);
  chart('gTraf',{type:'line',data:{labels:dd.map(x=>x.d.slice(5)).concat(pend.map(d=>d.slice(5))),datasets:[
    {label:'浏览',data:dd.map(x=>x.v),borderColor:'#2a78d6',borderWidth:2,pointRadius:0,tension:.32,fill:false},
    {label:'克隆',data:dd.map(x=>x.c),borderColor:'#4a3aa7',borderWidth:2,pointRadius:0,tension:.32,fill:false,yAxisID:'y1'},
    {label:'上游未发布',data:dd.map(()=>null).concat(pend.map(()=>0)),borderColor:'#c98500',
      borderDash:[4,4],borderWidth:1.4,pointRadius:0,fill:false}]},
    options:baseOpt({plugins:{legend:{display:true,labels:{color:ink,boxWidth:9,font:{size:10}}},tooltip:{}},
      scales:{x:{ticks:{color:ink,maxTicksLimit:7},grid:{display:false}},
        y:{position:'left',ticks:{color:ink},grid:{color:grid}},y1:{position:'right',ticks:{color:ink},grid:{display:false}}}})});
  const tr=(t.per_repo||[]).filter(r=>r.views_14d);
  bars('gTrafRepo',tr.map(r=>r.name),tr.map(r=>r.views_14d),true);
  const trRows=(t.per_repo||[]).map(r=>
    `<tr><td data-v="${esc(r.name)}">${esc(r.name)}</td><td data-v="${r.views_14d||0}">${num(r.views_14d)}</td>
     <td class="muted" data-v="${r.views_uniq_14d||0}">${num(r.views_uniq_14d)}</td>
     <td data-v="${r.clones_14d||0}">${num(r.clones_14d)}</td>
     <td class="muted" data-v="${r.clones_uniq_14d||0}">${num(r.clones_uniq_14d)}</td>
     <td class="muted">${(r.referrers||[]).map(x=>esc(x.r)).join(', ')||'—'}</td>
     <td class="muted">${(r.top_paths||[]).slice(0,2).map(x=>esc((x.p||'').split('/').slice(-1)[0]||'/')).join(', ')||'—'}</td></tr>`).join('');
  const trb=q('#gTrafRows'); if(trb&&trb.dataset.k!==trRows.length+''){trb.innerHTML=trRows;trb.dataset.k=trRows.length+''}
  const sub=(g.subprojects||[]).map(sp=>
    `<tr><td data-v="${esc(sp.project)}">${esc(sp.project)}</td><td class="muted" data-v="${esc(sp.repo)}">${esc(sp.repo)}</td>
     <td class="muted">${esc(sp.path)}</td><td data-v="${sp.commits_30d||0}">${num(sp.commits_30d)}</td>
     <td class="muted" data-v="${sp.last_commit_at||''}">${sp.last_commit_at||'—'}</td></tr>`).join('');
  const sb=q('#gSub'); if(sb&&sb.dataset.k!==sub.length+''){sb.innerHTML=sub;sb.dataset.k=sub.length+''}
  const cap=g.capability||{};
  q('#gCap').innerHTML=`<div class="vsec" style="margin-bottom:7px">采集能力</div>
    <div style="font-size:13px;color:var(--t2);line-height:1.8">
    Traffic:<b>${esc(cap.traffic||'—')}</b><br>Actions 账单:<b>${b.available?'OK(billing/usage)':esc(cap.billing||'—')}</b><br>
    API 余量:<b>${num((g.rate||{}).remaining)} / ${num((g.rate||{}).limit)}</b>
    <span class="muted">· 每分钟仅耗约 2 点,额度每小时重置</span></div>`;
};

addEventListener('hashchange',()=>{if(S)mount();});
// ★ 隐藏页 rAF 不触发(本项目第三次踩这个坑):回到前台必须**同步补一帧**再恢复排帧,
//   否则星图会停在离开时的那一帧不动。
D.addEventListener('visibilitychange',()=>{if(!D.hidden){tickAgo();load();
  if(U.box&&U.cv&&U.cv.isConnected){U.t=performance.now();
    if(U.box.w||(U.fit&&U.fit()))uniDraw();
    uniKick();}}});
/* 「更多」气泡:三个整页出口收成一个,点外面/按 Esc 关 */
(function(){
  const b=q('#moreBtn'), pop=q('#morePop');
  if(!b)return;
  const set=v=>{pop.classList.toggle('on',v);b.setAttribute('aria-expanded',String(v));b.classList.toggle('on',v)};
  b.onclick=e=>{e.stopPropagation();set(!pop.classList.contains('on'))};
  D.addEventListener('click',e=>{if(!pop.contains(e.target))set(false)});
  D.addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});
})();
load().then(probeEdit);
setInterval(load,REFRESH);
</script>
</body>
</html>
