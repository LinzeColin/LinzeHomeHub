/* ============ 业务流:软件**内部**功能实现程度 ============
   和「运行」页的区别:那边是**运维**纵向切片(代码→CI→部署→…→自愈,看软件跑没跑起来);
   这边是**业务**纵向切片(一份数据从进来到送出去,中间哪一段断了)。
   ★ 阶段由每个项目自己定义,长度不限 —— KMFA 六段、Alpha 交易执行八段、status 采集五段,
     各画各的矩阵。统一的只有 schema、探针、状态语义和这套呈现语言。 */
/* ══ 状态:两级 ══
   ★ 机器照旧算七个状态,但**给人看的一级只有四个**:通 / 断了 / 没做 / 不确定。
     为什么、该谁办,放在旁边的子状态小签上。
     理由是实测:七个状态色两两对比度全部 <3:1 —— 颜色其实一个状态都分不开;
     而且一次要人记七个词,记不住。先分四类,再看小签,才是人能用的粒度。
   ★ blocked_by_input 与 blocked_by_policy 仍然必须分开:前者要催人、后者谁也不用动,
     处置动作相反,合成一态就排不出优先级(KMFA 线程实测反馈)。
     现在它们同属一级「断了」,但子状态不同 —— 分类没丢,只是不再平铺给人。 */
const CL1={
  ok:  {t:'通',    g:'✓', c:'var(--ok)'},
  down:{t:'断了',  g:'✕', c:'var(--danger)'},
  todo:{t:'没做',  g:'○', c:'var(--pro)'},
  unk: {t:'不确定',g:'?', c:'var(--t3)'}};
const CS={
  healthy:          {l1:'ok',  sub:'',           t:'通'},
  degraded:         {l1:'ok',  sub:'有缺陷',     t:'通(有缺陷)'},
  blocked:          {l1:'down',sub:'',           t:'断了'},
  blocked_by_input: {l1:'down',sub:'等你给材料', t:'断了(等你给材料)'},
  blocked_by_policy:{l1:'down',sub:'按规定',     t:'断了(按规定,不用管)'},
  not_built:        {l1:'todo',sub:'',           t:'没做'},
  unknown:          {l1:'unk', sub:'没自动核查', t:'不确定(没自动核查)'}};
// 颜色一律走一级 —— 四个颜色,而不是七个
Object.values(CS).forEach(v=>{v.c=CL1[v.l1].c; v.g=CL1[v.l1].g;});
const PRC={P0:'var(--danger)',P1:'var(--warn)',P2:'var(--accent)',P3:'var(--t3)'};
let FLPROJ=null, FLCELL=null;

function vFlow(){
  const f=S.flow;
  if(!f)return `<div class="warnbox">业务流采集尚未产出</div>`;
  if(!f.available)return `<div class="warnbox" style="margin-bottom:16px">${esc(f.note||'')}</div>
    ${ungovHTML(S.github&&S.github.ungoverned)}${discoveryHTML(f.discovery)}${unregHTML(f.unregistered||[])}`;
  return `<div class="grid k5" id="flKpi"></div>
  <div id="flIntegrity"></div>
  <div id="flUnreg"></div>
  <h2>业务基线矩阵 <span class="hint" id="flWho"></span></h2>
  <div class="seg" id="flTabs" style="margin-bottom:12px"></div>
  <div id="flVerify" style="margin-bottom:12px"></div>
  <div class="card p0 scroll"><table class="mx" id="flTable"></table></div>
  <div class="ulegend" style="margin-top:9px">
    ${Object.entries(CS).map(([k,v])=>`<span><i style="background:${v.c};border-radius:50%;width:9px;height:9px"></i>${v.t}</span>`).join('')}
    <span>点任意格看证据与探测结果</span></div>
  <div class="card" id="flCell" style="margin-top:13px"></div>
  <h2>已知缺陷 <span class="hint">挂在基线上;被测方指明了阶段的,再落到具体那一段</span></h2>
  <div class="card p0 scroll"><table id="flDefTable"></table></div>
  <h2>源级爆炸半径 <span class="hint">一个上游源断了,会连累哪几条业务基线</span></h2>
  <div class="card" id="flSrc"></div>
  <h2>健康趋势 <span class="hint">每格逐日归档,同一天取最差的一次</span></h2>
  <div class="card hov"><div class="chartbox"><canvas id="flTrend"></canvas></div></div>
  <div class="card" id="flNote" style="margin-top:14px"></div>`;
}

/* ---------- 分层自洽:每一级必须等于自身加它的下级 ----------
   ★ 只查总量是查不出东西的。KMFA 线程今天连踩两次同类坑(报表映射漏了模板 B 的行名,
     金额直接蒸发;上卷靠行号认层级,没有行号的那批钱永远卷不上去)——
     **两次总额守恒时错误都照样成立**,是靠逐级自洽才逼出来的。
   本站同样有「总数对得上就算通过」的地方:格子只按 stage_model 建,基线若声明了
   stage_model 里没有的阶段,那一格连同它的状态/证据/缺陷会被整个丢掉,而各级总数依然自洽。
   查出来就如实挂在页面最上面,不静默取整、不四舍五入掩盖。 */
/* ---------- 单元增减流水:**消失必须留痕** ----------
   ★ 这是「被丢掉的东西不参与任何总量校验」的第四种形状,而且是不对称的那一种:
     新增的单元会被登记核对标成治理违规,有人看;被删掉的单元只是列表里少一行 ——
     没有任何指标会因此变红,没人会注意。「少一行」恰恰最容易被当成正常。
   所以这里把「消失」单独提到前面,而不是和新增混在一条时间线里按时间排。 */
function churnHTML(L){
  if(!L)return '';
  if(L.seeded)return `<div class="card" style="margin-bottom:13px">
    <b style="font-size:14px">单元增减流水</b>
    <div class="muted" style="font-size:12.5px;margin-top:7px">
      刚建立基线,本轮不产事件 —— 从下一轮起,单元的新增与**消失**都会记在这里。</div></div>`;
  const gone=L.recent_removed||[];
  const rows=(L.events||[]).filter(e=>!e.eph).slice(0,14);
  const t=e=>new Date(e.t*1000).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit'});
  return `<div class="card" style="margin-bottom:13px${gone.length?';border-left:4px solid var(--danger)':''}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <b style="font-size:14px">单元增减流水</b>
      <span>${gone.length?`<span class="pill bad">${gone.length} 个常驻单元消失过</span>`
        :'<span class="pill ok">近 90 天无常驻单元消失</span>'}</span></div>
    <div style="font-size:13px;color:var(--t2);margin-top:9px;line-height:1.85">
      ${esc(L.note||'')}
      ${gone.length?`<div class="card p0" style="margin-top:10px;box-shadow:none">
        <table><thead><tr><th>消失时间</th><th>类型</th><th>单元</th><th>原归属</th></tr></thead><tbody>
        ${gone.map(e=>`<tr><td class="muted">${esc(t(e))}</td>
          <td class="muted">${esc(e.kind)}</td>
          <td style="font-family:ui-monospace,monospace;font-size:11.5px">${esc(e.id)}</td>
          <td>${e.owner?`<b>${esc(e.owner)}</b>`:'<span class="muted">此前也没有归属</span>'}</td>
          </tr>`).join('')}</tbody></table></div>`:''}
      ${rows.length?`<div style="margin-top:10px"><span class="muted">近期变更(已折叠 ${
        L.ephemeral_n||0} 条临时构建容器的来去 —— 折叠不是丢弃,它们仍在账上)</span>
        <div class="card p0" style="margin-top:7px;box-shadow:none"><table><tbody>
        ${rows.map(e=>`<tr><td class="muted" style="width:112px">${esc(t(e))}</td>
          <td style="width:56px"><span class="chip ${e.op==='removed'?'danger':''}">${
            e.op==='removed'?'消失':'新增'}</span></td>
          <td style="font-family:ui-monospace,monospace;font-size:11.5px">${esc(e.id)}</td>
          <td class="muted">${esc(e.owner||'未认领')}</td></tr>`).join('')}
        </tbody></table></div></div>`:''}
    </div></div>`;
}

function integrityHTML(list,scope){
  if(!list||!list.length)return '';
  return `<div class="card" style="border-left:4px solid var(--danger);margin-bottom:13px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <b style="font-size:14px">${esc(scope)}数据自洽性异常</b>
      <span class="pill bad">${list.length} 处</span></div>
    <div style="font-size:13px;color:var(--t2);margin-top:9px;line-height:1.85">
      下面这些**不是业务出了问题,是这张表本身对不上**。逐级核对(每一级必须等于它自身加下级)
      查出来的,总量看着正常时也会存在 —— 在修好之前,本页的统计数字不可全信。
      <div class="card p0" style="margin-top:10px;box-shadow:none"><table><thead><tr>
        <th>范围</th><th>类型</th><th>说明</th></tr></thead><tbody>
        ${list.map(x=>`<tr><td><b>${esc(x.project||'—')}</b></td>
          <td class="muted" style="font-family:ui-monospace,monospace;font-size:11.5px">${esc(x.kind)}</td>
          <td>${esc(x.detail)}</td></tr>`).join('')}</tbody></table></div></div></div>`;
}

/* 自动纳入的口径:这一轮扫了多少仓、新发现了谁、谁没扫到。
   ★ 必须能被复核 —— 否则「发现机制坏了」和「真的没有新项目」在页面上长得一模一样。 */
/* 未纳入治理的目录：长得像项目、却连治理文件都没有 —— 本站对它彻底看不见。
   ★ 这一层必须存在:自动纳入找的是「已经有 project.yaml 的」，
     新项目在写出治理文件之前是隐形的，而隐形不会让任何指标变红。 */
/* ★ 公开面只拿得到计数（条目里是仓名/目录名，而多数仓是私有的，不能出公开快照）。
   登录后的 owner 页才有明细。两种情况都要能读。 */
function ungovHTML(u){
  const g=S.github||{};
  if((!u||!u.count) && !g.ungoverned_count) return '';
  u = u || {count:g.ungoverned_count, scanned:g.ungoverned_scanned,
            items:null, exempt:new Array(g.ungoverned_exempt||0)};
  if(!u.count)return '';
  return `<div class="card" style="border-left:4px solid var(--danger)">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <b style="font-size:14px">未纳入治理</b>
      <span class="pill bad">${u.count} 个目录</span></div>
    <div style="font-size:13px;color:var(--t2);margin-top:9px;line-height:1.85">
      下面这些目录<b>长得像项目，却一个治理文件都没有</b> —— 本站看不到它们的任何业务状态。<br>
      <b>要么补 <code>docs/governance/project.yaml</code>，要么在白名单里写明它为什么不是项目。
      沉默不是选项</b>——沉默正是它们过去能隐形的原因。<br><br>
      ${u.items ? u.items.map(x=>`· <b>${esc(x.repo)}/${esc(x.dir)}</b>　<span class="muted">${esc(x.why)}</span>`).join('<br>')
        : '<span class="muted">具体是哪几个目录涉及私有仓名，只在登录后的 GitHub 页显示。</span>'}
      ${(u.exempt||[]).length?`<br><br><span class="muted">已显式豁免 ${u.exempt.length} 个（各自写明了理由）：
        ${u.exempt.map(e=>esc(e.repo)+'/'+esc(e.dir)).join('、')}</span>`:''}
    </div></div>`;
}
function discoveryHTML(d){
  if(!d)return '';
  const bad = d.mode!=='discovered';
  const nw=(d.newly_discovered||[]), miss=(d.in_fallback_but_not_found||[]), fail=(d.failed||[]);
  return `<div class="card" style="border-left:4px solid var(--${bad?'danger':'ok'})">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <b style="font-size:14px">项目自动纳入</b>
      <span class="pill ${bad?'bad':'ok'}">${bad?'没在自动发现':'扫了 '+(d.scanned||0)+' 个仓'}</span></div>
    <div style="font-size:13px;color:var(--t2);margin-top:9px;line-height:1.8">
      <b>新建项目只要有 <code>docs/governance/project.yaml</code> 就自动进这张表，不用改代码。</b>
      没发布 <code>flow.yaml</code> 的会落到下面「未登记」，<b>而不是隐形</b>。<br>
      ${nw.length?`本轮新发现:<b>${nw.map(esc).join('、')}</b><br>`:''}
      ${miss.length?`<b style="color:var(--warn)">兜底清单里有、这轮没扫到:${miss.map(esc).join('、')}</b>
        —— 可能是仓改名/迁出，也可能是发现机制出问题，需要人看一眼。<br>`:''}
      ${fail.length?`<b style="color:var(--warn)">取不到目录树:${fail.map(esc).join('、')}</b><br>`:''}
      ${bad?`<b style="color:var(--danger)">${esc(d.why||'自动发现没跑成，当前用的是写死的兜底清单')}</b>`:''}
    </div></div>`;
}
function unregHTML(list){
  if(!list.length)return '';
  return `<div class="card" style="border-left:4px solid var(--danger)">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <b style="font-size:14px">未登记业务流</b>
      <span class="pill bad">${list.length} 个项目</span></div>
    <div style="font-size:13px;color:var(--t2);margin-top:9px;line-height:1.8">
      治理规则:<b>凡是有治理文件的项目,都必须发布 <code>docs/governance/flow.yaml</code> 并落到 main。</b>
      下列项目有治理事实但没有业务流登记 —— 和「部署即登记」同一套执行逻辑,不靠自觉。
      <div class="card p0" style="margin-top:10px;box-shadow:none"><table><thead><tr>
        <th>项目</th><th>仓</th><th>应放位置</th><th>原因</th></tr></thead><tbody>
        ${list.map(u=>`<tr><td><b>${esc(u.project)}</b></td><td class="muted">${esc(u.repo)}</td>
          <td class="muted" style="font-family:ui-monospace,monospace;font-size:11.5px">${esc(u.expect)}</td>
          <td class="muted">${esc(u.why)}</td></tr>`).join('')}</tbody></table></div></div></div>`;
}

SYNC['flow']=function(){
  const f=S.flow; if(!f)return;
  if(!f.available){const u=q('#view');return}
  const t=f.totals;
  kpiRow('#flKpi',[
    {lab:'业务基线',val:t.baselines,unit:'',sub:`${f.projects.length} 个系统 · ${t.cells} 格`},
    {lab:'通畅率',val:t.cells?t.healthy/t.cells*100:0,unit:'%',fmt:v=>v.toFixed(0),
      sub:`${t.healthy} 格通`,tone:'ok'},
    /* ★ 这一格以前叫「要催人」却把 blocked(未细分)也算进去,而 blocked_by_input 是 0 ——
       标题与口径互相打架;not_built 明明也不通却被漏在外面。
       现在按「需要有人做事」统一口径:by_policy 不计(按规定不通,不需要任何人去修)。 */
    {lab:'不通的格',val:t.blocked_by_input+t.blocked+t.not_built,unit:'',
      sub:`等你给材料 ${t.blocked_by_input} · 断了 ${t.blocked} · 没做 ${t.not_built}`
        +(t.blocked_by_policy?` · 另 ${t.blocked_by_policy} 格按规定就该不通(不用管,不计)`:'')
        +` · 另 ${t.degraded} 格有缺陷`,
      tone:(t.blocked_by_input+t.blocked+t.not_built)?'bad':'ok'},
    // ★ 分母用**可测格子**,不是全部格子。
    //   全部 315 格里有 49 格根本没有东西可测(没做 27 + 按规定不通 22):
    //   没建的探针探什么?按规定就不该跑的,测了也没意义。
    //   拿它们当分母 = 要求一个永远达不到的数,还把真缺口稀释掉。
    //   但**不可测的数照样写在副标题里**,只留可测口径会让「大片没建」消失。
    {lab:'实测覆盖',val:(f.measurable_total||0)?(f.verified_total||0)/f.measurable_total*100:0,
      unit:'%',fmt:v=>v.toFixed(0),
      sub:`${f.verified_total||0} / ${f.measurable_total||0} 格可测的有机器实测`
        +(f.unmeasurable_total?` · 另 ${f.unmeasurable_total} 格没东西可测(没做或按规定不通),不计入`:'')
        +` · 其余仅自报`,
      tone:(f.verified_total||0)*2<(f.measurable_total||0)?'warn':'ok'},
    {lab:'可疑格',val:t.mismatch+t.coupling_violation,unit:'',
      sub:`自报≠实测 ${t.mismatch} · 违反耦合 ${t.coupling_violation}`,
      tone:(t.mismatch+t.coupling_violation)?'warn':'ok'},
    {lab:'未登记',val:(f.unregistered||[]).length,unit:'',sub:'有治理文件却没登记',
      tone:(f.unregistered||[]).length?'bad':'ok'},
  ]);
  q('#flIntegrity').innerHTML=integrityHTML(f.integrity||[],'业务流');
  q('#flUnreg').innerHTML=ungovHTML(S.github&&S.github.ungoverned)+discoveryHTML(f.discovery)+unregHTML(f.unregistered||[]);

  if(!FLPROJ||!f.projects.some(p=>p.project===FLPROJ))FLPROJ=f.projects[0].project;
  const tabs=q('#flTabs');
  const tk=f.projects.map(p=>p.project).join('|')+FLPROJ;
  if(tabs&&tabs.dataset.k!==tk){
    tabs.innerHTML=f.projects.map(p=>`<button data-p="${esc(p.project)}"
      class="${p.project===FLPROJ?'on':''}">${esc(p.project)}${p.bad?` <span style="color:var(--danger)">${p.bad}</span>`:''}${
      p.self_report_only?' <span style="color:var(--warn)" title="全部为自报,无机器实测">◐</span>':''}</button>`).join('');
    tabs.dataset.k=tk;
    qa('#flTabs button').forEach(b=>b.onclick=()=>{FLPROJ=b.dataset.p;FLCELL=null;SYNC['flow']()});
  }
  const p=f.projects.find(x=>x.project===FLPROJ)||f.projects[0];
  setText(q('#flWho'),`${p.project} · ${p.baselines.length} 条基线 × ${p.stages.length} 段 · `
    +`实测覆盖 ${p.verified}/${p.cells_n} 格 · 阶段由该项目自己定义`);
  const vb=q('#flVerify');
  if(vb)vb.innerHTML=p.self_report_only
    ? `<div class="card" style="border-left:4px solid var(--warn)">
        <b style="font-size:14px">这张表全部是自报,本站没有任何机器实测</b>
        <div style="font-size:13px;color:var(--t2);margin-top:8px;line-height:1.8">
        下面的绿只代表 <b>${esc(p.project)} 说它通</b>,**不代表本站测出来通**。
        被测方目前没有可探的产出物(Coolify exec 不支持、logs 为空、健康接口在 Access 后面、
        私有归档从未成功过),所以连它自己也拿不到证据 —— 这种状态下
        「自报与实测不符」根本无从比对。<br>
        <span class="muted">等被测方落出公开安全的健康摘要并填上 probe_hint,
        这里会自动转为实测,覆盖率也会跟着涨。在那之前,**不给它编一个绿**。</span></div></div>`
    : (p.verified<p.cells_n
       ? `<div class="muted" style="font-size:12px;margin-bottom:9px">
          实测覆盖 <b>${p.verified}/${p.cells_n}</b> 格;其余格子仅为自报,未经本站验证。</div>`
       : '');

  const tb=q('#flTable');
  const key=FLPROJ+String(f.at);
  if(tb&&tb.dataset.k!==key){
    tb.innerHTML=`<thead><tr><th class="s">业务基线</th><th class="s">优先级</th>
      ${p.stages.map(x=>`<th>${esc(x)}</th>`).join('')}<th class="s">起始</th></tr></thead><tbody>
      ${p.baselines.map(b=>`<tr data-b="${esc(b.id||b.name)}">
        <td data-v="${esc(b.name)}"><b>${esc(b.name)}</b>
          ${b.broken_at?`<div class="muted" style="font-size:11px">断在「${esc(b.broken_at)}」</div>`:''}</td>
        <td data-v="${b.priority}"><span class="chip" style="color:${PRC[b.priority]};
          background:transparent;border:1px solid ${PRC[b.priority]}">${b.priority}</span></td>
        ${p.stages.map(st=>{const c=b.cells[st]||{s:'unknown',v:''};const cs=CS[c.s]||CS.unknown;
          return `<td class="mxc fc" data-st="${esc(st)}" data-b="${esc(b.id||b.name)}"
            title="${esc(st)}:${esc(c.v||cs.t)}">
            <span class="dot" style="background:${cs.c}"></span>
            ${c.mismatch?'<span class="mm" title="自报与实测不符">≠</span>':''}
            ${c.coupling_violation?'<span class="ds" title="上游已断却仍自称健康,违反耦合规则">↑</span>':''}
            ${c.weak?'<span class="wk" title="只有弱证据(日志新鲜度),不足以判健康">~</span>':''}
          </td>`}).join('')}
        <td class="muted" data-v="${b.since||''}">${b.since||'—'}</td></tr>`).join('')}</tbody>`;
    tb.dataset.k=key;
    qa('#flTable td.fc').forEach(td=>td.onclick=()=>{
      FLCELL={b:td.dataset.b,st:td.dataset.st}; drawCell();
      qa('#flTable td.fc').forEach(x=>x.classList.remove('on')); td.classList.add('on');
    });
    wire();
  }
  drawCell();

  function drawCell(){
    const el=q('#flCell'); if(!el)return;
    const b=p.baselines.find(x=>(x.id||x.name)===(FLCELL&&FLCELL.b))||p.baselines[0];
    const st=(FLCELL&&FLCELL.st)||p.stages[0];
    const c=(b.cells||{})[st]||{s:'unknown',v:''}, cs=CS[c.s]||CS.unknown;
    /* ★ 必须先要求 c.defect 为真值。以前直接 d.id===c.defect,两边都是 ""
       就全都相等 —— KMFA 54 格全挂上了同一条缺陷。空值不是可比较的值。 */
    let def=c.defect?(p.defects||[]).find(d=>d.id&&d.id===c.defect):null;
    // 被测方给了 stage 就按「基线 × 阶段」精确挂到这一格(KMFA 2026-07-27 起补了 stage 字段)
    if(!def)def=(p.defects||[]).find(d=>d.stage===st&&d.baseline&&d.baseline===(b.id||b.name))||null;
    // 只挂到基线、没给 stage 的,如实按**基线级**呈现,不假装它属于这一格
    const blDefs=(p.defects||[]).filter(d=>d.baseline&&d.baseline===(b.id||b.name)&&!d.stage);
    el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:baseline;
        gap:12px;flex-wrap:wrap">
        <b style="font-size:15px">${esc(b.name)} · ${esc(st)}</b>
        <span class="pill" style="color:${cs.c};background:color-mix(in srgb,${cs.c} 14%,transparent)">${cs.t}</span></div>
      <div style="font-size:13px;color:var(--t2);margin-top:10px;line-height:1.85">
        <b>证据</b>:${esc(c.v)||'—'}<br>
        <b>项目自己填的</b>:${c.declared?esc(CS[c.declared]?CS[c.declared].t:c.declared):'未声明'}
        · <b>系统实测</b>:${c.measured?esc(CS[c.measured]?CS[c.measured].t:c.measured)
          :'<span style="color:var(--warn)">未配探针 —— 本格结论完全来自自报</span>'}
        ${c.mismatch?'<br><b style="color:var(--warn)">⚠ 自报与实测不符</b> —— 登记表可能已经和现实脱节,这比单纯的红更值得看':''}
        ${c.coupling_violation?`<br><b style="color:var(--danger)">⚠ 违反耦合规则</b> —— 上游 ${c.coupling_violation.map(esc).join('、')} 已断,这一格不该是健康`:''}
        ${c.weak?'<br><b style="color:var(--warn)">⚠ 只有弱证据</b> —— 日志新鲜只证明进程在动,不证明有产出;请改用产出物条数或业务时间戳':''}
        ${def?`<br><b style="color:var(--danger)">本格已知缺陷${def.id?' '+esc(def.id):''}</b>:${esc(def.desc)}${def.since?`(自 ${esc(def.since)})`:''}`:''}
        ${blDefs.length?`<br><b style="color:var(--warn)">本基线已知缺陷</b>(被测方挂在基线上,未指明具体是哪一段):
          ${blDefs.map(d=>esc(d.desc)).join('<br>')}`:''}
      </div>`;
  }

  /* ★ 列随数据而定:各项目的事实档结构本来就不一样(KMFA 的 known_defects 是
     {id, baseline, desc},没有 stage/since)。固定五列的后果是整整两列永远是空的,
     还会在格子详情里渲染出「已知缺陷 :…(自 —)」这种半截文案。
     统一的是接口,不是字段齐全度 —— 没有的列就别画。 */
  const dl=(p.defects||[]);
  const cols=[
    {k:'id',   n:'缺陷',  has:dl.some(d=>d.id),
     f:d=>`<span style="font-family:ui-monospace,monospace;font-size:11.5px">${esc(d.id||'')}</span>`},
    {k:'baseline',n:'基线',has:true,
     f:d=>esc((p.baselines.find(b=>b.id===d.baseline)||{}).name||d.baseline||'—')},
    {k:'stage',n:'阶段',  has:dl.some(d=>d.stage),
     f:d=>d.stage?esc(d.stage):'<span class="muted">未指明</span>'},
    {k:'desc', n:'说明',  has:true, wide:true, f:d=>esc(d.desc)},
    {k:'since',n:'起始',  has:dl.some(d=>d.since),

function syncHost(){
  const s=S,h=s.host||{},o=s.ops||{};
  drawLive();
  kpiRow('#rtKpis',[
    {lab:'内存',val:h.mem_pct,unit:'%',sub:'实时',tone:h.mem_pct>=90?'warn':'ok'},
    {lab:'磁盘',val:h.disk_pct,unit:'%',sub:fmtBytes(h.disk_used_b)+' / '+fmtBytes(h.disk_total_b),
      tone:h.disk_pct>=85?'bad':(h.disk_pct>=75?'warn':'ok')},
    {lab:'负载',val:parseFloat(h.load1||0),unit:'',fmt:v=>v.toFixed(2),sub:'1 分钟平均'},
    {lab:'在线',val:h.uptime_days,unit:' 天',sub:'容器重启 '+(o.restarts??0)},
    {lab:'证书',val:o.cert?o.cert.days:0,unit:' 天',sub:(o.cert&&o.cert.date||'—')+' 自动续',
      tone:(o.cert&&o.cert.days<=14)?'warn':'ok'},
  ]);
  const agentCol=a=>{const m={'无':'var(--ok)','低':'var(--ok)','中':'var(--warn)','高':'var(--danger)'};
    return `<span style="color:${m[a]||'var(--t2)'};font-weight:550">${esc(a||'—')}</span>`};
  const rows=(s.projects||[]).map(p=>{
    const nm=p.url?`<a href="${p.url}" target="_blank" rel="noopener">${esc(p.name)}</a>`:esc(p.name);
    const parts=(p.parts||[]).map(t=>`<span class="tag ${t==='前台'?'fe':'be'}">${t}</span>`).join('');
    const b={run:['run','运行中'],access:['access','Access 保护'],down:['down','离线']}[p.status]||['run','运行中'];
    const c=x=>`<td class="muted">${esc(x||'—')}</td>`;
    return `<tr><td data-v="${esc(p.name)}">${nm}</td><td>${parts}</td>${c(p.host)}${c(p.db)}${c(p.store)}${c(p.deploy)}${c(p.backup)}
      <td data-v="${esc(p.agent)}">${agentCol(p.agent)}</td>
      <td data-v="${p.status}"><span class="badge ${b[0]}">${b[1]}</span></td></tr>`;}).join('');
  const tb=q('#rtRows'); if(tb&&tb.dataset.k!==rows.length+':'+(s.updated_at||'')){tb.innerHTML=rows;tb.dataset.k=rows.length+':'+(s.updated_at||'')}
  // 趋势
  const seg=q('#rtSeg'); if(seg&&!seg.dataset.w){seg.dataset.w='1';
    seg.onclick=e=>{const b=e.target.closest('button');if(!b)return;TR=b.dataset.r;
      qa('#rtSeg button').forEach(x=>x.classList.toggle('on',x===b));drawHost()}}
  drawHost();
  setText(q('#rtMemNow'),' · 当前 '+(h.mem_pct??'—')+'%');
  setText(q('#rtDiskNow'),' · 当前 '+(h.disk_pct??'—')+'%');
  // 耦合
  const cnt=f=>{const m={};(s.projects||[]).forEach(p=>{const k=f(p)||'—';m[k]=(m[k]||0)+1});return m};
  const st=cnt(p=>(p.store&&p.store!=='无')?p.store:'无存储');
  bars('rtStore',Object.keys(st),Object.values(st),true);
  const ag=cnt(p=>'依赖:'+(p.agent||'—'));
  donut('rtAgent',Object.keys(ag),Object.values(ag),Object.keys(ag).map((k,i)=>k.includes('中')?'#eda100':(k.includes('高')?'#e34948':PAL[i%PAL.length])));
  const dp=cnt(p=>p.deploy); donut('rtDeploy',Object.keys(dp),Object.values(dp));
  // 自愈
  const sh=s.selfheal; if(sh){
    setText(q('#rtMainArm'),`${sh.main_armed}/${sh.main_total} 守护中`);
    setText(q('#rtMetaArm'),`${sh.meta_armed}/${sh.meta_total} 守护中`);
    const R=set=>(sh.rules||[]).filter(r=>(r.set||'main')===set).map(r=>{
      /* ★ 认不出来的状态必须落到「不确定」,绝不能落到 'ok'。
         改这行之前是 `…includes(r.state)?r.state:'ok'` —— 任何没见过的状态名、
         任何拼错、任何 selfheal.json 被写坏的字段,都会**静默渲染成绿点**。
         这正是 INV-005 禁止的那件事:未知不得聚合成绿。
         方向反过来之后,新状态就算前端还没适配,最差也只是显示「不确定」,
         不会假装一切正常。'failed' 是本次新增的真实状态(自愈动了手但复探没通过)。*/
      const KNOWN=['ok','warn','acted','pending','failed'];
      const st=KNOWN.includes(r.state)?r.state:'unknown';
      /* 非正常态额外给一个**文字**标签,不让颜色单独承担状态 */
      const stw={failed:'未恢复',unknown:'状态不确定',warn:'注意'}[st];
      const sl=stw?`<span class="rst ${st}">${stw}</span>`:'';
      const eng=r.engine==='builtin'?'<span class="eng builtin">内置</span>':'<span class="eng selfheal">自愈脚本</span>';
      const act=r.actions_total?`<span class="muted"> · 累计 ${r.actions_total}</span>`:'';
      const la=r.last_action?`<div class="rd" style="color:var(--accent)">最近:${esc(r.last_action)}</div>`:'';
      return `<div class="rule"><span class="ic ${st}"></span><div style="flex:1;min-width:0">
        <div class="rn">${esc(r.name)}${sl}${eng}${act}</div><div class="rt">${esc(r.threshold||'')}</div>
        <div class="rd">${esc(r.detail||'')}</div>${la}</div></div>`}).join('');
    q('#rtMain').innerHTML=R('main'); q('#rtMeta').innerHTML=R('meta');
    q('#rtHeal').innerHTML=(sh.recent||[]).slice(0,7).map(x=>
      `<div class="row"><span style="color:var(--t2)">${esc(x.at)} · ${esc(x.rule)}</span><span style="text-align:right">${esc(x.msg)}</span></div>`
    ).join('')||'<div class="muted" style="font-size:12.5px">一切正常,尚无需要出手的动作</div>';
  }
  q('#rtDeployLog').innerHTML=(s.deploy.log||[]).map(l=>
    `<div class="row"><span style="color:var(--t2)">${esc(l.at)} · ${esc(l.app)}</span>
     <span style="color:${l.ok?'var(--ok)':'var(--danger)'}">${l.ok?'成功':'失败'}</span></div>`).join('')||'<div class="muted">暂无</div>';
};
function drawHost(){
  const H=S.history||{}; let t1=Date.now()/1000,t0,win,ser;
  if(TR==='全部'){const d=H.day||{t:[]};t0=d.t.length?d.t[0]:t1-86400;win=t1-t0}
  else{win=RANGES.find(r=>r[0]===TR)[1];t0=t1-win}
  ser=(TR==='全部'||win>2678400)?(H.day||{t:[],mem:[],disk:[]}):(win<=86400?(H.min||{t:[],mem:[],disk:[]}):(H.hour||{t:[],mem:[],disk:[]}));
  const idx=[];for(let i=0;i<ser.t.length;i++)if(ser.t[i]>=t0&&ser.t[i]<=t1)idx.push(i);
  const p2=x=>('0'+x).slice(-2);
  const lb=idx.map(i=>{const d=new Date(ser.t[i]*1000);
    return win<=86400?p2(d.getHours())+':'+p2(d.getMinutes()):p2(d.getMonth()+1)+'-'+p2(d.getDate())});
  const o={scales:{y:{min:0,max:100,ticks:{color:ink,stepSize:25},grid:{color:grid}},
    x:{ticks:{color:ink,maxTicksLimit:7},grid:{display:false}}}};
  line('rtMem',lb,idx.map(i=>ser.mem[i]),'#eda100',o);
  line('rtDisk',lb,idx.map(i=>ser.disk[i]),'#0f8a4d',o);
  const gran=(TR==='全部'||win>2678400)?'1天':(win<=86400?'1分钟':'1小时');
  setText(q('#rtNote'),idx.length<2?'该时段数据还在累积':`区间 ${TR}:${idx.length} 个采样点,${gran}粒度`);
}

      <div style="font-size:11.5px;margin-top:7px">${eta} <span class="muted">${esc(u.note||'')}</span></div></div>`}).join('');

  /* AI 供应商账务。★ 只有 state==='ok' 才显示数字;其余一律显示原因文字。
     显示一个错的余额,比显示「不知道」糟得多 —— 前者会让人据此做决定。
     另外 DeepSeek 报的是**余额**(还剩多少),OpenAI 官方没有公开的剩余余额端点,
     只能报**已花费**,所以两张卡的标题不一样,不能都写「余额」。*/
  const ai=s.ai_accounts||{};

  const AI_LABEL={deepseek:'DeepSeek',openai:'OpenAI'};
  const AI_STATE={ok:['ok',''],unconfigured:['unk','未配置'],failed:['bad','探测失败'],
                  unknown_shape:['warn','结构不认识'],refused:['bad','已拒绝']};
  q('#cAi').innerHTML=(ai.items||[]).map(x=>{
    const [cls,word]=AI_STATE[x.state]||['unk','状态不明'];
    const head=x.kind==='balance'?'余额':'本月已花费';
    const body = x.state==='ok'
      ? `<div style="font-size:19px;font-weight:600">${esc(String(x.amount))} <span class="muted" style="font-size:12px">${esc(x.currency||'')}</span></div>`
      : `<div style="font-size:13px;font-weight:600;color:var(--warn)">${esc(word)}</div>`;
    return `<div class="card hov" style="padding:14px">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="dot ${cls}"></span>
        <span style="font-size:13.5px;font-weight:550">${esc(AI_LABEL[x.vendor]||x.vendor)}</span>
        <span class="muted" style="font-size:11.5px">${esc(head)}</span></div>
      ${body}
      <div class="muted" style="font-size:11.5px;margin-top:5px">${esc(x.note||'')}</div></div>`;
  }).join('')||'<div class="muted" style="font-size:12.5px">尚未接入</div>';
  q('#cExt').innerHTML=(s.externals||[]).map(e=>{
    const c=e.ok===true?'ok':(e.ok===false?'bad':'unk');
    return `<div class="card hov" style="display:flex;align-items:center;gap:11px;padding:14px">
      <span class="dot ${c}"></span><div><div style="font-size:13.5px;font-weight:550">${esc(e.name)}</div>
      <div class="muted" style="font-size:12px">${esc(e.note)}</div></div></div>`}).join('');
  setText(q('#cFx'),`汇率取自 ${s.fx.at||'—'}(北京时间)。月摊 = 把年费摊到每月;当月实付 = 这个月真正扣的钱。`);
};

      <br>上次到达 <b>${fr.last_arrival_epoch?new Date(fr.last_arrival_epoch*1000).toLocaleString('zh-CN'):'—'}</b>
      · 下批预计 <b>${eta?eta.toLocaleString('zh-CN'):'—'}</b>
      <span class="muted">(按实测到达间隔 ${((fr.arrival_period_sec||86400)/3600).toFixed(0)}h 推算)</span>
      <br><b style="color:var(--accent)">想看真正实时的访问,请看「运行 → 本站实时访问」</b>
      <span class="muted">——那是本站自己的日志,每分钟都在变。</span></div>`;
  }
  kpiRow('#gTrafKpi',[
    {lab:'浏览 14d',val:tt.views||0,unit:''},
    {lab:'克隆 14d',val:tt.clones||0,unit:''},
    {lab:'上游滞后',val:fr.lag_days||0,unit:' 天',sub:'截止 '+(fr.upstream_through||'—'),
      tone:(fr.lag_days||0)>3?'warn':'ok'},
    {lab:'已归档',val:t.archived_days||0,unit:' 天',sub:'自 '+(t.archive_since||'—')},
  ]);
  const dd=t.daily||[], pend=(fr.pending_days||[]);
  chart('gTraf',{type:'line',data:{labels:dd.map(x=>x.d.slice(5)).concat(pend.map(d=>d.slice(5))),datasets:[
    {label:'浏览',data:dd.map(x=>x.v),borderColor:'#2a78d6',borderWidth:2,pointRadius:0,tension:.32,fill:false},
    {label:'克隆',data:dd.map(x=>x.c),borderColor:'#4a3aa7',borderWidth:2,pointRadius:0,tension:.32,fill:false,yAxisID:'y1'},
    {label:'上游未发布',data:dd.map(()=>null).concat(pend.map(()=>0)),borderColor:'#c98500',
      borderDash:[4,4],borderWidth:1.4,pointRadius:0,fill:false}]},
    options:baseOpt({plugins:{legend:{display:true,labels:{color:ink,boxWidth:9,font:{size:10}}},tooltip:{}},
      scales:{x:{ticks:{color:ink,maxTicksLimit:7},grid:{display:false}},
        y:{position:'left',ticks:{color:ink},grid:{color:grid}},y1:{position:'right',ticks:{color:ink},grid:{display:false}}}})});
  const tr=(t.per_repo||[]).filter(r=>r.views_14d);
  bars('gTrafRepo',tr.map(r=>r.name),tr.map(r=>r.views_14d),true);
  const trRows=(t.per_repo||[]).map(r=>
    `<tr><td data-v="${esc(r.name)}">${esc(r.name)}</td><td data-v="${r.views_14d||0}">${num(r.views_14d)}</td>
     <td class="muted" data-v="${r.views_uniq_14d||0}">${num(r.views_uniq_14d)}</td>
     <td data-v="${r.clones_14d||0}">${num(r.clones_14d)}</td>
     <td class="muted" data-v="${r.clones_uniq_14d||0}">${num(r.clones_uniq_14d)}</td>
     <td class="muted">${(r.referrers||[]).map(x=>esc(x.r)).join(', ')||'—'}</td>
     <td class="muted">${(r.top_paths||[]).slice(0,2).map(x=>esc((x.p||'').split('/').slice(-1)[0]||'/')).join(', ')||'—'}</td></tr>`).join('');
  const trb=q('#gTrafRows'); if(trb&&trb.dataset.k!==trRows.length+''){trb.innerHTML=trRows;trb.dataset.k=trRows.length+''}
  const sub=(g.subprojects||[]).map(sp=>
    `<tr><td data-v="${esc(sp.project)}">${esc(sp.project)}</td><td class="muted" data-v="${esc(sp.repo)}">${esc(sp.repo)}</td>
     <td class="muted">${esc(sp.path)}</td><td data-v="${sp.commits_30d||0}">${num(sp.commits_30d)}</td>
     <td class="muted" data-v="${sp.last_commit_at||''}">${sp.last_commit_at||'—'}</td></tr>`).join('');
  const sb=q('#gSub'); if(sb&&sb.dataset.k!==sub.length+''){sb.innerHTML=sub;sb.dataset.k=sub.length+''}
  const cap=g.capability||{};
  q('#gCap').innerHTML=`<div class="vsec" style="margin-bottom:7px">采集能力</div>
    <div style="font-size:13px;color:var(--t2);line-height:1.8">
    Traffic:<b>${esc(cap.traffic||'—')}</b><br>Actions 账单:<b>${b.available?'OK(billing/usage)':esc(cap.billing||'—')}</b><br>
    API 余量:<b>${num((g.rate||{}).remaining)} / ${num((g.rate||{}).limit)}</b>
    <span class="muted">· 每分钟仅耗约 2 点,额度每小时重置</span></div>`;
};

/* ============ 时间轴:未来续费 + 历史共享时间轴 ============ */
function vTimeline(){
  return `<div class="grid k5" id="tlKpi"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">
    <h2 style="margin:0">续费时间轴 <span class="hint">今天 → 下次扣费日</span></h2>
    <span class="seg" style="display:inline-flex"><button class="on" data-v="30" onclick="const b=this;this.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');window._tlRangeSw&&window._tlRangeSw(+b.dataset.v)">30 天</button><button data-v="365" onclick="const b=this;this.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');window._tlRangeSw&&window._tlRangeSw(+b.dataset.v)">全年</button></span>
  </div>
  <div class="tlFuture" id="tlFuture"></div>
  <h2>订阅历史 <span class="hint">所有订阅共享同一时间轴 · 按实际扣费日反推 · 灰=历史 绿=活跃 红=到期</span></h2>
  <p style="font-size:10.5px;color:var(--t3);margin:-6px 0 14px">全部从快照纯计算派生，不新增任何采集</p>
  <div class="tlTrackHist" id="tlTrackHist"></div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--t3);margin-top:14px;padding-top:12px;border-top:.5px solid var(--line)">
    <span><span class="dot" style="background:var(--t3);opacity:.55;width:12px;height:12px;border-radius:3px"></span>历史过期</span>
    <span><span class="dot ok" style="width:12px;height:12px;border-radius:3px"></span>活跃中(>7天)</span>
    <span><span class="dot bad" style="width:12px;height:12px;border-radius:3px"></span>到期(≤7天)</span>
    <span style="margin-left:auto"><span class="dot" style="background:var(--accent);width:7px;height:7px;border-radius:50%"></span> 今天</span>
  </div>
  <div id="tlBlind" style="margin-top:14px"></div>`;
}
SYNC['timeline']=function(){
  const o=S.ops||{}, sb=o.subs||{};
  const items=(sb.items||[]).slice();
  const blind=sb.blind||[];
  const TH=(sb.threshold_days?Math.min(sb.threshold_days,7):7);
  kpiRow('#tlKpi',[
    {lab:'总订阅',val:sb.total||0,unit:'',sub:`${sb.tracked||0} 条可追踪`},
    {lab:'即将到期',val:(sb.due_soon||[]).length,unit:'',sub:`≤${TH} 天`,tone:(sb.due_soon||[]).length?'bad':'ok'},
    {lab:'本月扣费',val:items.filter(i=>i.days<=31).length,unit:'',sub:'30天内到期'},
    {lab:'盯不住',val:blind.length,unit:'',sub:'缺购买日期',tone:blind.length?'warn':'ok'},
  ]);

  // ── 未来续费轴 ──
  const NOW=new Date();
  const EXP=TH||7;
  const ft=q('#tlFuture');
  if(ft){
    const drawFuture=function(range){
      const M=range===365?365:30;
      const P=d=>Math.min(98,(d/M)*100);
      const C=s=>s.days<=EXP?'var(--danger)':'var(--ok)';
      const act=range===365?items:items.filter(s=>s.days<=M);
      const tk=range===365?[0,7,14,30,90,180,365]:[0,7,14,21,30];
      ft.innerHTML=tk.map(t=>`<span class="tick" style="left:${P(t)}%"></span><span class="tick lbl" style="left:${P(t)}%">${t}天</span>`).join('')
        +act.map(s=>`<div class="row"><span class="bar" style="width:${P(s.days)}%;background:${C(s)}">${esc(s.name)}<span class="tld">${s.days}天</span></span></div>`).join('');
    };
    window._tlRangeSw=drawFuture;
    drawFuture(30);
  }

  // ── 历史时间轴 ──
  const trh=q('#tlTrackHist');
  if(trh&&items.length){
    const T0=new Date(NOW);T0.setMonth(NOW.getMonth()-5);T0.setDate(1);T0.setHours(0,0,0,0);
    const RNG=((new Date(NOW)).setDate(NOW.getDate()+1)-T0);
    const P=d=>Math.max(0,Math.min(100,(d-T0)/RNG*100));

    // 月份标签
    const mths=[];
    for(let m=new Date(T0);m<=NOW;m.setMonth(m.getMonth()+1))mths.push(new Date(m));
    const hdr=mths.map(m=>`<span class="mo${m.getMonth()===NOW.getMonth()&&m.getFullYear()===NOW.getFullYear()?' now':''}" style="left:${P(m)}%">${m.getMonth()+1}月</span>`).join('');
    const vl=mths.map(m=>`<span class="vline" style="left:${P(m)}%"></span>`).join('');
    const nowP=P(NOW);

    // derive periods: items 按 date+cadence 反推
    const derive=s=>{
      const rd=new Date(s.date+'T00:00:00');
      const C=s.cadence==='yearly'?12:1;
      let e=new Date(rd);const ps=[];
      while(e>T0){
        let st=new Date(e);st.setMonth(st.getMonth()-C);if(st<T0)st=T0;
        let enRaw=new Date(e),en=new Date(e);if(en>NOW)en=NOW;
        let isCur=enRaw>NOW,state=isCur?(s.days<=EXP?'cur-bad':'cur-ok'):'hist';
        ps.push({st:new Date(st),en:new Date(en),s:state});
        e=new Date(st);
      }
      return ps;
    };

    const rows=items.map(s=>{
      const ps=derive(s);
      const segs=ps.map(per=>{
        const L=P(per.st),W=P(per.en)-L;
        if(W<.3)return'';
        return `<span class="seg ${per.s}" style="left:${L.toFixed(2)}%;width:${W.toFixed(2)}%"></span>`;
      }).join('');
      const tag=s.days<=EXP?'<span class="tag" style="color:var(--danger);background:rgba(207,58,58,.1)">到期</span>':'<span class="tag" style="color:var(--ok);background:rgba(15,138,77,.1)">活跃</span>';
      return `<div class="tr"><span class="lbl">${esc(s.name)}${tag}</span>${segs}</div>`;
    }).join('');

    // 盲区行
    const bRows=blind.length?blind.map(b=>`<div class="tr" style="opacity:.45"><span class="lbl" style="color:var(--t3)">${esc(b.name)}<span class="tag" style="color:var(--t3);background:var(--soft)">盯不住</span></span></div>`).join(''):'';

    trh.innerHTML=`<div class="tlfHdr">${hdr}</div><div class="tlfGrid" style="position:relative">${vl}<span class="tlNow" style="left:${nowP.toFixed(2)}%"></span>${rows}${bRows}</div>`;
  }

  // 盲区详情
  const bl=q('#tlBlind');
  if(bl){
    bl.innerHTML=blind.length
      ? `<h2>盯不住的订阅 <span class="hint">${blind.length} 条没登记购买日期,到期不会有提醒</span></h2>
         <div class="card">${blind.map(b=>`<div class="row" style="align-items:center">
           <span><b>${esc(b.name)}</b> <span class="muted">${esc(b.cadence||'—')}</span></span>
           <span style="color:var(--warn);font-weight:550">${esc(b.why||'—')}</span></div>`).join('')}
           <div class="muted" style="font-size:11.5px;margin-top:10px">
             到「价格设置」里补上购买日期,这里就能自动算出下次扣费时间。</div></div>`
      : '<div class="card"><div style="display:flex;align-items:center;gap:10px"><span class="dot ok"></span><b>全部订阅均可追踪</b></div></div>';
  }
};

D.addEventListener('visibilitychange',()=>{if(!D.hidden){tickAgo();load();

    if(U.box.w||(U.fit&&U.fit()))uniDraw();

/* 「更多」气泡:三个整页出口收成一个,点外面/按 Esc 关 */
(function(){
  const b=q('#moreBtn'), pop=q('#morePop');
  if(!b)return;
  const set=v=>{pop.classList.toggle('on',v);b.setAttribute('aria-expanded',String(v));b.classList.toggle('on',v)};
  b.onclick=e=>{e.stopPropagation();set(!pop.classList.contains('on'))};
  D.addEventListener('click',e=>{if(!pop.contains(e.target))set(false)});
  D.addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});
})();
load().then(probeEdit);
setInterval(load,REFRESH);
