<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云平台总览 · status.linzezhang.com</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232a78d6'/><path d='M5 17h4l3-8 4 14 3-9h8' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
:root{
  --bg:#f6f6f4; --card:#fff; --soft:#f1f1ee; --line:#e4e3dc; --line2:#d7d6cd;
  --t1:#1b1b19; --t2:#57564f; --t3:#8b8a83;
  --accent:#2a78d6; --accent-bg:#e6f1fb; --accent-t:#0c447c;
  --pro:#4a3aa7; --pro-bg:#eeedfe; --pro-t:#26215c;
  --ok:#0f8a4d; --ok-bg:#e4f3ea; --warn:#c98500; --warn-bg:#fbf0d8;
  --danger:#cf3a3a; --danger-bg:#fbeaea;
  --h0:#eceada; --h1:#c6e6c1; --h2:#7bc47f; --h3:#3f9e57; --h4:#1e6b3a;
  --shadow:0 1px 2px rgba(20,20,15,.05),0 4px 14px rgba(20,20,15,.05);
  --shadow-lift:0 2px 6px rgba(20,20,15,.07),0 12px 28px rgba(20,20,15,.09);
  --r:13px; --ease:cubic-bezier(.22,.61,.36,1);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#141413; --card:#1d1d1b; --soft:#242422; --line:#33332f; --line2:#3f3f39;
    --t1:#f3f2ec; --t2:#c3c2b7; --t3:#8b8a83;
    --accent:#5a9bea; --accent-bg:#12314f; --accent-t:#b5d4f4;
    --pro:#9085e9; --pro-bg:#2a2560; --pro-t:#cecbf6;
    --ok:#3cc07f; --ok-bg:#123320; --warn:#e0a53a; --warn-bg:#3a2f12;
    --danger:#e26b6a; --danger-bg:#3a1a1a;
    --h0:#26261f; --h1:#0e4429; --h2:#006d32; --h3:#26a641; --h4:#39d353;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.24);
    --shadow-lift:0 2px 6px rgba(0,0,0,.36),0 14px 30px rgba(0,0,0,.34);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px 72px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h2{font-size:15px;font-weight:650;margin:30px 0 12px;letter-spacing:-.01em}
h2:first-child{margin-top:0}
h2 .hint{font-weight:400;color:var(--t3);font-size:12.5px;margin-left:8px}
.muted{color:var(--t3);font-size:13px}
.sub{font-size:12.5px;color:var(--t3);margin:-6px 0 12px;max-width:78ch}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(180%) blur(14px);border-bottom:.5px solid var(--line)}
.topbar .in{max-width:1180px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;padding:13px 0;font-weight:650;font-size:15px;color:var(--t1)}
.brand:hover{text-decoration:none}
.brand .lg{width:21px;height:21px;border-radius:6px;background:linear-gradient(140deg,var(--accent),var(--pro));flex:none}
.tabs{position:relative;display:flex;gap:2px;flex:1}
.tabs a{position:relative;padding:13px 15px;font-size:14.5px;color:var(--t2);white-space:nowrap;
  border-radius:9px 9px 0 0;transition:color .18s var(--ease),background .18s var(--ease)}
.tabs a:hover{color:var(--t1);background:var(--soft);text-decoration:none}
.tabs a:active{transform:translateY(.5px)}
.tabs a.on{color:var(--t1);font-weight:650}
.tabs a .n{font-size:11.5px;color:var(--t3);margin-left:5px;font-weight:400}
.tabs a.on .n{color:var(--accent)}
.tabink{position:absolute;bottom:-1px;height:2px;background:var(--accent);border-radius:2px;
  transition:transform .32s var(--ease),width .32s var(--ease);pointer-events:none}
.ext{display:flex;gap:6px;align-items:center;padding:9px 0}
.ext a{font-size:12px;padding:6px 12px;border:.5px solid var(--line);border-radius:9px;color:var(--t2);
  transition:all .18s var(--ease)}
.ext a:hover{background:var(--soft);color:var(--t1);text-decoration:none;transform:translateY(-1px);box-shadow:var(--shadow)}
.ext a:active{transform:translateY(0)}

/* ---------- 页头 + 实时心跳 ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin:26px 0 18px}
.head h1{font-size:22px;font-weight:680;margin:0;letter-spacing:-.02em}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--t2);
  background:var(--card);border:.5px solid var(--line);border-radius:999px;padding:5px 13px;box-shadow:var(--shadow)}
.live .beat{width:7px;height:7px;border-radius:50%;background:var(--ok);position:relative;flex:none}
.live .beat::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--ok);opacity:.28;
  animation:pulse 2s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.5}70%{transform:scale(1.5);opacity:0}100%{opacity:0}}
.live.stale .beat{background:var(--warn)} .live.stale .beat::after{background:var(--warn)}
.pill{font-size:12px;padding:5px 13px;border-radius:999px;font-weight:600}
.pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.bad{color:var(--danger);background:var(--danger-bg)}
.pill.warn{color:var(--warn);background:var(--warn-bg)}

/* ---------- 布局原子 ---------- */
.grid{display:grid;gap:13px}
.k5{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.k4{grid-template-columns:repeat(auto-fit,minmax(184px,1fr))}
.k3{grid-template-columns:repeat(auto-fit,minmax(232px,1fr))}
.k2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:.5px solid var(--line);border-radius:var(--r);padding:17px;
  box-shadow:var(--shadow);transition:box-shadow .24s var(--ease),transform .24s var(--ease),border-color .24s var(--ease)}
.card.p0{padding:4px 6px}
.card.hov:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px);border-color:var(--line2)}
.kpi{background:var(--card);border:.5px solid var(--line);border-radius:var(--r);padding:15px 16px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:box-shadow .24s var(--ease),transform .24s var(--ease)}
.kpi:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.kpi .lab{font-size:12.5px;color:var(--t2);display:flex;align-items:center;gap:6px}
.kpi .val{font-size:27px;font-weight:680;margin-top:4px;letter-spacing:-.025em;line-height:1.16}
.kpi .val .u{font-size:15px;font-weight:500;color:var(--t3);margin-left:2px}
.kpi .sub{font-size:12.5px;color:var(--t3);margin-top:3px}
.kpi .spark{position:absolute;right:0;bottom:0;width:74px;height:30px;opacity:.5}
.kpi.tone-ok::before,.kpi.tone-warn::before,.kpi.tone-bad::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.kpi.tone-ok::before{background:var(--ok)}
.kpi.tone-warn::before{background:var(--warn)}
.kpi.tone-bad::before{background:var(--danger)}

table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th{text-align:left;font-weight:550;color:var(--t2);padding:10px 11px;border-bottom:.5px solid var(--line);
  position:sticky;top:0;background:var(--card);z-index:1}
th.s{cursor:pointer;user-select:none;transition:color .16s var(--ease)}
th.s:hover{color:var(--t1)}
th.s::after{content:"";opacity:.35;margin-left:5px;font-size:10px}
th.s[data-dir="1"]::after{content:"▲";opacity:.9}
th.s[data-dir="-1"]::after{content:"▼";opacity:.9}
td{padding:10px 11px;border-bottom:.5px solid var(--line)}
tbody tr{transition:background .16s var(--ease)}
tbody tr:hover{background:var(--soft)}
tbody tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;margin-right:4px;display:inline-block}
.tag.fe{background:var(--accent-bg);color:var(--accent-t)}
.tag.be{background:var(--pro-bg);color:var(--pro-t)}
.badge{font-size:11.5px;padding:3px 9px;border-radius:7px;font-weight:550}
.badge.run{color:var(--ok);background:var(--ok-bg)}
.badge.access{color:var(--accent-t);background:var(--accent-bg)}
.badge.down{color:var(--danger);background:var(--danger-bg)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--danger)} .dot.unk{background:var(--t3)}
.chartbox{position:relative;width:100%;height:186px}
.chartbox.sm{height:152px} .chartbox.xs{height:118px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:13px;border-bottom:.5px solid var(--line)}
.row:last-child{border-bottom:none}
.btn{font-size:12.5px;padding:7px 14px;border:.5px solid var(--line);background:var(--card);
  color:var(--t1)!important;border-radius:9px;cursor:pointer;display:inline-block;
  transition:all .18s var(--ease)}
.btn:hover{background:var(--soft);text-decoration:none;transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0) scale(.985)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--t2);font-size:12px;padding:6px 12px;border-radius:8px;
  cursor:pointer;transition:all .18s var(--ease)}
.seg button:hover{color:var(--t1)}
.seg button:active{transform:scale(.96)}
.seg button.on{background:var(--card);color:var(--t1);font-weight:600;box-shadow:var(--shadow)}

/* 用量条 */
.ub{background:var(--card);border:.5px solid var(--line);border-radius:var(--r);padding:14px 15px;
  box-shadow:var(--shadow);transition:all .24s var(--ease)}
.ub:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.ub .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.track{height:8px;background:var(--soft);border-radius:99px;margin-top:10px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .7s var(--ease)}
.src{font-size:10.5px;padding:2px 7px;border-radius:5px;margin-left:7px;font-weight:500}
.src.auto{background:var(--ok-bg);color:var(--ok)} .src.manual{background:var(--soft);color:var(--t3)}
/* 开关 */
.tg{position:relative;display:inline-block;width:40px;height:22px;vertical-align:middle}
.tg input{opacity:0;width:0;height:0;position:absolute}
.tg .sl{position:absolute;inset:0;background:var(--line2);border-radius:99px;transition:.24s var(--ease);cursor:pointer}
.tg .sl:before{content:"";position:absolute;height:18px;width:18px;left:2px;top:2px;background:#fff;
  border-radius:50%;transition:.24s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tg input:checked + .sl{background:var(--ok)}
.tg input:checked + .sl:before{transform:translateX(18px)}
.tg .sl:active:before{width:22px}
.tg.ro .sl{cursor:not-allowed;opacity:.45}
/* 行动清单 */
.act{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:.5px solid var(--line)}
.act:last-child{border-bottom:none}
.act .ic{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}
.act .ic.bad{background:var(--danger)} .act .ic.warn{background:var(--warn)} .act .ic.ok{background:var(--ok)}
.act .t{font-size:13.5px;font-weight:550}
.act .d{font-size:12.5px;color:var(--t3);margin-top:2px}
/* 自愈规则 */
.rule{display:flex;gap:11px;align-items:flex-start;padding:11px 2px;border-bottom:.5px solid var(--line)}
.rule:last-child{border-bottom:none}
.rule .ic{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.rule .ic.ok{background:var(--ok)}.rule .ic.warn{background:var(--warn)}
.rule .ic.acted{background:var(--accent)}.rule .ic.pending{background:var(--t3)}
.rule .rn{font-size:13px;font-weight:550}
.rule .rt{font-size:12px;color:var(--t2);margin-top:2px}
.rule .rd{font-size:12px;color:var(--t3);margin-top:2px}
.eng{font-size:10px;padding:1px 6px;border-radius:5px;margin-left:6px;font-weight:500}
.eng.builtin{background:var(--accent-bg);color:var(--accent-t)}
.eng.selfheal{background:var(--ok-bg);color:var(--ok)}
/* 供应商卡 */
.vcard{background:var(--card);border:.5px solid var(--line);border-radius:15px;padding:16px;
  display:flex;flex-direction:column;gap:11px;box-shadow:var(--shadow);
  transition:all .24s var(--ease)}
.vcard:hover{box-shadow:var(--shadow-lift);transform:translateY(-3px);border-color:var(--line2)}
.vhead{display:flex;align-items:center;gap:9px}
.vhead .nm{font-size:15px;font-weight:650}
.vrole{font-size:12px;color:var(--t3);line-height:1.55;margin-top:-6px}
.vsec{font-size:10.5px;color:var(--t3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.chip{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:7px;margin:0 5px 5px 0;font-weight:500}
.chip.ok{color:var(--ok);background:var(--ok-bg)}
.chip.warn{color:var(--warn);background:var(--warn-bg)}
.chip.danger{color:var(--danger);background:var(--danger-bg)}
.vmetrics{display:flex;flex-wrap:wrap;gap:8px}
.vmetric{background:var(--soft);border-radius:9px;padding:7px 11px;min-width:72px;transition:background .18s var(--ease)}
.vcard:hover .vmetric{background:color-mix(in srgb,var(--soft) 70%,var(--accent-bg))}
.vmetric .l{font-size:10.5px;color:var(--t3)}
.vmetric .v{font-size:14px;font-weight:650;margin-top:1px}
/* 贡献网格 */
.hmwrap{overflow-x:auto;padding-bottom:5px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;width:max-content}
.hm i{width:11px;height:11px;border-radius:2.5px;background:var(--h0);display:block;
  transition:transform .14s var(--ease)}
.hm i:hover{transform:scale(1.45);cursor:crosshair}
.hm i.l1{background:var(--h1)}.hm i.l2{background:var(--h2)}.hm i.l3{background:var(--h3)}.hm i.l4{background:var(--h4)}
.hmmon{display:grid;grid-auto-flow:column;gap:3px;width:max-content;font-size:10px;color:var(--t3);margin-bottom:4px;height:14px}
.hmleg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--t3);margin-top:9px;justify-content:flex-end}
.hmleg i{width:11px;height:11px;border-radius:2.5px;background:var(--h0);display:block}
.hmleg i.l1{background:var(--h1)}.hmleg i.l2{background:var(--h2)}.hmleg i.l3{background:var(--h3)}.hmleg i.l4{background:var(--h4)}
/* 骨架屏 */
.sk{background:linear-gradient(90deg,var(--soft) 25%,var(--line) 37%,var(--soft) 63%);
  background-size:400% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:7px;color:transparent!important}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
/* toast */
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,22px);z-index:60;opacity:0;
  background:var(--t1);color:var(--bg);padding:11px 20px;border-radius:11px;font-size:13.5px;
  box-shadow:var(--shadow-lift);transition:all .3s var(--ease);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
.err{background:var(--danger-bg);color:var(--danger);padding:13px 15px;border-radius:11px;font-size:13px}
.warnbox{background:var(--warn-bg);color:var(--warn);padding:12px 15px;border-radius:11px;font-size:13px;margin-bottom:14px}
.lock{border:1.5px dashed var(--line2);border-radius:15px;padding:24px 18px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:9px;color:var(--t3);text-align:center;
  transition:all .24s var(--ease)}
.lock:hover{border-color:var(--accent);background:var(--accent-bg)}
.fade{animation:fade .34s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.bar-mini{display:flex;align-items:flex-end;gap:2px;height:22px}
.bar-mini i{flex:1;background:var(--accent);border-radius:1.5px;opacity:.75;min-height:2px;
  transition:height .5s var(--ease)}
</style>
</head>
<body>
<div class="topbar"><div class="in">
  <a class="brand" href="#/"><span class="lg"></span>LinzeCloud</a>
  <nav class="tabs" id="tabs"><span class="tabink" id="tabink"></span></nav>
  <div class="ext">
    <a href="https://uptime.linzezhang.com">运维健康</a>
    <a href="/admin">价格设置</a>
    <a href="/admin/github">GitHub 私有</a>
  </div>
</div></div>

<div class="wrap">
  <div class="head">
    <div><h1 id="ptitle">云平台总览</h1><div class="muted" id="subtitle">正在连接…</div></div>
    <div style="display:flex;gap:10px;align-items:center">
      <span class="live" id="live"><span class="beat"></span><span id="ago">连接中</span></span>
      <span class="pill ok" id="health">—</span>
    </div>
  </div>
  <div id="err"></div>
  <div id="view"></div>
</div>
<div id="toast"></div>

<script src="vendor/chart.umd.min.js"></script>
<script>
const D=document, C=Chart;
C.defaults.animation={duration:420,easing:'easeOutCubic'};
C.defaults.font.family='-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif';
const dark=matchMedia('(prefers-color-scheme:dark)').matches;
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
if(reduced)C.defaults.animation=false;
const ink='#8b8a83', grid=dark?'rgba(139,138,131,.16)':'rgba(139,138,131,.14)';
const PAL=['#2a78d6','#0f8a4d','#eda100','#4a3aa7','#e87ba4','#e34948','#1baf7a','#eb6834','#5a9bea','#9085e9'];
const REFRESH=15000;

let S=null, PREV=null, CAN_EDIT=false, PROBED=false, MOUNTED=null, lastAt=0;  // MOUNTED 用 null 哨兵:'' 是合法路由,首次加载必须挂载

/* ========== 4 个入口:总览 + 3 个二级 ========== */
const PAGES=[
  {id:'',       name:'总览'},
  {id:'runtime',name:'运行'},
  {id:'cost',   name:'成本'},
  {id:'github', name:'GitHub'},
];
const ROUTE=()=> (location.hash||'#/').replace(/^#\/?/,'').split('?')[0];

/* ========== 工具 ========== */
const esc=s=>String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const q=s=>D.querySelector(s), qa=s=>[...D.querySelectorAll(s)];
function fmtBytes(b){if(b==null)return '—';const u=['B','KB','MB','GB','TB'];let i=0,v=b;
  while(v>=1024&&i<u.length-1){v/=1024;i++}return v.toFixed(i>0&&v<100?1:0)+' '+u[i]}
const fmtKB=k=>fmtBytes((k||0)*1024);
const num=n=>n==null?'—':n.toLocaleString('en-US');
function toast(m){const t=q('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400)}

/* 数字滚动:让实时更新看得见 */
function setNum(el,val,fmt){
  if(!el)return; fmt=fmt||(v=>Math.round(v).toLocaleString('en-US'));
  const from=Number(el.dataset.v||0), to=Number(val)||0;
  el.dataset.v=to;
  // 先把最终值落定:页面隐藏时 rAF 根本不触发,只靠动画会把数字冻在旧值上
  el.textContent=fmt(to);
  if(reduced||from===to||D.hidden)return;
  const t0=performance.now(), dur=520;
  const tick=t=>{const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    el.textContent=fmt(from+(to-from)*e); if(p<1)requestAnimationFrame(tick); else el.textContent=fmt(to);};
  requestAnimationFrame(tick);
}
function setText(el,v){if(el&&el.textContent!==v)el.textContent=v}

/* ========== 图表:就地更新,不销毁重建 ========== */
let _ch={};
function chart(id,cfg){
  const el=D.getElementById(id); if(!el)return;
  const ex=_ch[id];
  if(ex&&ex.config.type===cfg.type&&ex.data.datasets.length===cfg.data.datasets.length){
    ex.data.labels=cfg.data.labels;
    cfg.data.datasets.forEach((d,i)=>{Object.keys(d).forEach(k=>{ex.data.datasets[i][k]=d[k]})});
    if(cfg.options&&cfg.options.scales)ex.options.scales=cfg.options.scales;
    ex.update(reduced?'none':undefined); return;
  }
  if(ex)ex.destroy();
  _ch[id]=new C(el,cfg);
}
const AX={ticks:{color:ink},grid:{color:grid}};
const baseOpt=extra=>Object.assign({responsive:true,maintainAspectRatio:false,
  interaction:{mode:'index',intersect:false},
  plugins:{legend:{display:false},tooltip:{backgroundColor:dark?'#26261f':'#1b1b19',padding:10,
    cornerRadius:8,titleFont:{size:12},bodyFont:{size:12}}}},extra||{});
function line(id,labels,data,color,opt){chart(id,{type:'line',data:{labels,datasets:[{data,borderColor:color,
  backgroundColor:(color||'#2a78d6')+'1f',fill:true,tension:.32,borderWidth:2,
  pointRadius:0,pointHoverRadius:4,pointHitRadius:14}]},
  options:baseOpt(Object.assign({scales:{y:{beginAtZero:true,...AX},x:{ticks:{color:ink,maxTicksLimit:7},grid:{display:false}}}},opt||{}))})}
function bars(id,labels,data,horiz,fmt){chart(id,{type:'bar',
  data:{labels,datasets:[{data,backgroundColor:labels.map((_,k)=>PAL[k%PAL.length]),borderRadius:5,
    hoverBackgroundColor:labels.map((_,k)=>PAL[k%PAL.length])}]},
  options:baseOpt({indexAxis:horiz?'y':'x',
    plugins:{legend:{display:false},tooltip:{callbacks:fmt?{label:c=>fmt(c.parsed[horiz?'x':'y'])}:{}}},
    scales:{x:{ticks:{color:ink},grid:{color:grid,display:!horiz}},y:{ticks:{color:ink},grid:{color:grid,display:horiz}}}})})}
function donut(id,labels,data,colors){chart(id,{type:'doughnut',
  data:{labels,datasets:[{data,backgroundColor:colors||labels.map((_,k)=>PAL[k%PAL.length]),
    borderWidth:2,borderColor:dark?'#1d1d1b':'#fff',hoverOffset:6}]},
  options:baseOpt({cutout:'62%',plugins:{legend:{position:'right',labels:{color:ink,boxWidth:10,
    font:{size:11},padding:9}},tooltip:{}}})})}
function sparkSVG(vals,color){
  if(!vals||vals.length<2)return '';
  const mx=Math.max(...vals,1), w=74, h=30;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-(v/mx)*h*.86-2).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
}

/* ========== 贡献网格 ========== */
const MON=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
function heatmap(cal,unit){
  const days=(cal&&cal.days)||[]; if(!days.length)return '<div class="muted">暂无数据</div>';
  const mx=cal.max||1;
  const lvl=c=>c<=0?0:(c>=mx*.66?4:(c>=mx*.33?3:(c>=mx*.12?2:1)));
  const pad=new Date(days[0].d+'T00:00:00').getDay();
  const slots=Array(pad).fill(null).concat(days), cols=[];
  for(let i=0;i<slots.length;i+=7)cols.push(slots.slice(i,i+7));
  const cells=slots.map(x=>x?`<i class="${lvl(x.c)?'l'+lvl(x.c):''}" title="${x.d} · ${x.c}${unit||''}"></i>`
    :'<i style="visibility:hidden"></i>').join('');
  let lm=-1;
  const mons=cols.map(col=>{const f=col.find(Boolean); if(!f)return '<span></span>';
    const m=new Date(f.d+'T00:00:00').getMonth();
    if(m!==lm){lm=m;return `<span>${MON[m]}</span>`} return '<span></span>';}).join('');
  return `<div class="hmwrap"><div class="hmmon" style="grid-template-columns:repeat(${cols.length},11px)">${mons}</div>
    <div class="hm">${cells}</div></div>
    <div class="hmleg"><span>少</span><i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span>多</span></div>`;
}
const scrollHM=()=>qa('.hmwrap').forEach(w=>{w.scrollLeft=w.scrollWidth});

/* ========== 派生洞察:零成本,纯算 ========== */
function insights(s){
  const out=[]; const push=(lv,t,d)=>out.push({lv,t,d});
  const h=s.host||{}, o=s.ops||{}, g=s.github||{};
  (s.projects||[]).filter(p=>p.status==='down').forEach(p=>
    push('bad',`${p.name} 探测失败`,`地址 ${p.url||'内部服务'} 未返回可用状态`));
  if(h.disk_pct>=85)push('bad','磁盘吃紧',`已用 ${h.disk_pct}%,自愈会在 85% 自动清理`);
  else if(h.disk_pct>=75)push('warn','磁盘偏高',`已用 ${h.disk_pct}%,低于 85% 触发线`);
  if(h.mem_pct>=90)push('warn','内存偏高',`已用 ${h.mem_pct}%`);
  (s.usage||[]).forEach(u=>{if(!u.limit)return;const p=u.used/u.limit*100;
    if(p>=80)push('bad',`${u.label} 接近额度`,`${p.toFixed(1)}% 已用`);
    else if(p>=50)push('warn',`${u.label} 过半`,`${p.toFixed(1)}% 已用${u.eta_date?' · 预计触顶 '+u.eta_date:''}`);});
  if(o.cert&&o.cert.days!=null&&o.cert.days<=14)push('warn','证书临近到期',`${o.cert.date} · 剩 ${o.cert.days} 天(自动续期)`);
  if(o.ovh_renew&&o.ovh_renew.days!=null&&o.ovh_renew.days<=7)push('warn','OVH 即将续费',`${o.ovh_renew.date} · 剩 ${o.ovh_renew.days} 天`);
  if(o.backup&&!o.backup.ok)push('bad','备份异常',`上次备份 ${o.backup.at||'无记录'}`);
  if(g.available&&g.ci_fail>0)push('warn',`${g.ci_fail} 个仓 CI 失败`,'默认分支最近一次运行未通过');
  (s.selfheal&&s.selfheal.rules||[]).filter(r=>!r.armed).forEach(r=>
    push('warn',`自愈未就绪:${r.name}`,r.detail||''));
  if(s.updated_epoch&&(Date.now()/1000-s.updated_epoch)>180)
    push('bad','快照停更','采集器可能已停,元自愈会尝试自动重跑');
  if(!out.length)push('ok','一切正常','没有需要你处理的事项');
  const rank={bad:0,warn:1,ok:2};
  return out.sort((a,b)=>rank[a.lv]-rank[b.lv]);
}
function healthScore(s){
  const ins=insights(s);
  const bad=ins.filter(i=>i.lv==='bad').length, warn=ins.filter(i=>i.lv==='warn').length;
  return Math.max(0,100-bad*22-warn*7);
}

async function load(){
  try{
    const r=await fetch('data/snapshot.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('快照不可用('+r.status+')');
    PREV=S; S=await r.json(); lastAt=Date.now();
    q('#err').innerHTML='';
    if(MOUNTED!==ROUTE()){mount();}else{sync();}
  }catch(e){
    q('#err').innerHTML=`<div class="err">数据加载失败:${esc(e.message)} · 每 ${REFRESH/1000} 秒自动重试</div>`;
  }
}

function tickAgo(){
  if(!lastAt)return;
  const sec=Math.round((Date.now()-lastAt)/1000);
  const el=q('#ago'); if(!el)return;
  el.textContent = sec<2?'刚刚更新':(sec<60?sec+' 秒前':Math.floor(sec/60)+' 分钟前');
  q('#live').classList.toggle('stale',sec>90);
}

function mount(){
  if(!S)return;
  MOUNTED=ROUTE();
  const p=PAGES.find(x=>x.id===MOUNTED)||PAGES[0];
  setText(q('#ptitle'), p.id?('云平台 · '+p.name):'云平台总览');
  const V={'':vOverview,'runtime':vRuntime,'cost':vCost,'github':vGithub}[MOUNTED]||vOverview;
  const el=q('#view'); el.innerHTML=V(); el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade');
  for(const k in _ch){ if(!D.getElementById(k)){ _ch[k].destroy(); delete _ch[k]; } }  // 清掉已脱离 DOM 的图表
  renderTabs(); wire(); sync(); scrollHM();
}
function sync(){
  if(!S)return;
  renderTabs();
  setText(q('#subtitle'),`快照 ${S.updated_at}(${S.tz}) · 每 ${REFRESH/1000} 秒自动同步`
    +(S.github&&S.github.available?` · GitHub ${S.github.collected_at}`:''));
  const ins=insights(S), bad=ins.filter(i=>i.lv==='bad').length;
  const hp=q('#health'); hp.textContent=bad?`${bad} 项待处理`:'全部健康';
  hp.className='pill '+(bad?'bad':(ins.some(i=>i.lv==='warn')?'warn':'ok'));
  tickAgo();
  (SYNC[MOUNTED]||SYNC[''])();
}

/* 表格排序 */
function wire(){
  qa('th.s').forEach(th=>th.onclick=()=>{
    const tb=th.closest('table').tBodies[0], i=[...th.parentNode.children].indexOf(th);
    const dir=(th.dataset.dir==='1')?-1:1;
    [...th.parentNode.children].forEach(x=>x.dataset.dir='');
    th.dataset.dir=dir;
    const rows=[...tb.rows].sort((a,b)=>{
      const x=a.cells[i]?.dataset.v??a.cells[i]?.textContent, y=b.cells[i]?.dataset.v??b.cells[i]?.textContent;
      const nx=parseFloat(x),ny=parseFloat(y);
      return (isNaN(nx)||isNaN(ny)) ? String(x).localeCompare(String(y),'zh')*dir : (nx-ny)*dir;
    });
    rows.forEach(r=>tb.appendChild(r));
  });
}
function toggleRenew(el,i){
  if(!S||!S.cost||!S.cost.items[i])return;
  const name=S.cost.items[i].name, val=el.checked; el.disabled=true;
  fetch('/admin/api/toggle',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name,auto_renew:val})})
    .then(r=>{if(!r.ok)throw 0;return r.json()})
    .then(()=>{S.cost.items[i].auto_renew=val;el.disabled=false;toast(`${name} 自动续费已${val?'开启':'关闭'}`)})
    .catch(()=>{el.checked=!val;el.disabled=false;toast('保存失败:请先到「价格设置」登录一次')});
}

function drawHost(){
  const H=S.history||{}; let t1=Date.now()/1000,t0,win,ser;
  if(TR==='全部'){const d=H.day||{t:[]};t0=d.t.length?d.t[0]:t1-86400;win=t1-t0}
  else{win=RANGES.find(r=>r[0]===TR)[1];t0=t1-win}
  ser=(TR==='全部'||win>2678400)?(H.day||{t:[],mem:[],disk:[]}):(win<=86400?(H.min||{t:[],mem:[],disk:[]}):(H.hour||{t:[],mem:[],disk:[]}));
  const idx=[];for(let i=0;i<ser.t.length;i++)if(ser.t[i]>=t0&&ser.t[i]<=t1)idx.push(i);
  const p2=x=>('0'+x).slice(-2);
  const lb=idx.map(i=>{const d=new Date(ser.t[i]*1000);
    return win<=86400?p2(d.getHours())+':'+p2(d.getMinutes()):p2(d.getMonth()+1)+'-'+p2(d.getDate())});
  const o={scales:{y:{min:0,max:100,ticks:{color:ink,stepSize:25},grid:{color:grid}},
    x:{ticks:{color:ink,maxTicksLimit:7},grid:{display:false}}}};
  line('rtMem',lb,idx.map(i=>ser.mem[i]),'#eda100',o);
  line('rtDisk',lb,idx.map(i=>ser.disk[i]),'#0f8a4d',o);
  const gran=(TR==='全部'||win>2678400)?'1天':(win<=86400?'1分钟':'1小时');
  setText(q('#rtNote'),idx.length<2?'该时段数据还在累积':`区间 ${TR}:${idx.length} 个采样点,${gran}粒度`);
}

      options:baseOpt({plugins:{legend:{display:false},tooltip:{callbacks:{label:cx=>num(cx.parsed.y)+' 分钟'}}},
        scales:{x:{ticks:{color:ink,font:{size:10}},grid:{display:false}},y:{ticks:{color:ink},grid:{color:grid}}}})});}
  // 网格
  const cal=g.calendar||{}, ce=q('#gCal');
  if(ce&&ce.dataset.k!==String(cal.total)){ce.innerHTML=heatmap(cal,' 次提交');ce.dataset.k=String(cal.total);scrollHM()}
  // 仓库表 + 动能
  const rp=(g.public_repos||[]);
  const rows=rp.map(r=>{
    const wk=(r.commits_30d||0)/30*7, mom=wk>0?((r.commits_7d||0)/wk-1)*100:0;
    const momTxt=wk<1?'—':(mom>=0?'+':'')+mom.toFixed(0)+'%';
    const momCol=wk<1?'var(--t3)':(mom>=15?'var(--ok)':(mom<=-40?'var(--danger)':'var(--t2)'));
    const ci=r.ci_conclusion==null&&!r.ci_state?'<span class="muted">—</span>'
      :(r.ci_ok?'<span style="color:var(--ok)">通过</span>':`<span style="color:var(--danger)">${esc(r.ci_conclusion||r.ci_state)}</span>`);
    return `<tr><td data-v="${esc(r.name)}"><a href="${r.url}" target="_blank" rel="noopener">${esc(r.name)}</a></td>
      <td class="muted" data-v="${esc(r.top_lang)}">${esc(r.top_lang)}</td>
      <td data-v="${r.commits_7d||0}">${num(r.commits_7d)}</td>
      <td data-v="${r.commits_30d||0}">${num(r.commits_30d)}</td>
      <td data-v="${mom}" style="color:${momCol};font-weight:550">${momTxt}</td>
      <td data-v="${r.branches||0}">${r.branches}</td>
      <td data-v="${r.open_pr??0}">${r.open_pr??'—'}</td>
      <td data-v="${r.open_issue??0}">${r.open_issue??'—'}</td>
      <td class="muted" data-v="${r.size_kb||0}">${fmtKB(r.size_kb)}</td>
      <td class="muted" data-v="${r.release_bytes||0}">${r.release_bytes?fmtBytes(r.release_bytes):'—'}</td>
      <td>${ci}</td><td class="muted" data-v="${r.pushed_at||''}">${esc(r.pushed_at)}</td></tr>`}).join('');
  const gt=q('#gRows'); if(gt&&gt.dataset.k!==rows.length+g.collected_at){gt.innerHTML=rows;gt.dataset.k=rows.length+g.collected_at}
  q('#gLock').innerHTML=g.private>0?`
    <div class="lock"><div style="font-size:15px;font-weight:650;color:var(--t2)">另有 ${g.private} 个私有仓</div>
      <div>明细不在公开页展示</div><a class="btn" href="/admin/github">登录查看私有全量</a></div>
    <div class="card"><div class="muted" style="margin-bottom:7px">私有页能看到什么</div>
      <div style="font-size:13px;color:var(--t2)">全部 ${g.repos_total} 个仓完整明细(含私有)+ 子项目 + Release 占用 + CI 通过率。
      用你本人的 Cloudflare Access 登录,匿名访问被拦。</div></div>`:'';
  // 图
  const srt=[...rp].sort((x,y)=>y.commits_30d-x.commits_30d);
  bars('gC30',srt.map(r=>r.name),srt.map(r=>r.commits_30d),true);
  const L={}; rp.forEach(r=>{const ls=r.languages||{};for(const k in ls)L[k]=(L[k]||0)+ls[k]});
  const le=Object.entries(L).sort((x,y)=>y[1]-x[1]).slice(0,8);
  donut('gLang',le.map(x=>x[0]),le.map(x=>x[1]));
  const rs=[...rp].sort((x,y)=>y.size_kb-x.size_kb);
  bars('gSize',rs.map(r=>r.name),rs.map(r=>+(r.size_kb/1024).toFixed(1)),true,v=>v+' MB');
  const cd=(cal.days||[]).slice(-90);
  line('gTrend',cd.map(x=>x.d.slice(5)),cd.map(x=>x.c),'#2a78d6');
  chart('gRun',{type:'bar',data:{labels:(a.daily14||[]).map(x=>x.d.slice(5)),
    datasets:[{data:(a.daily14||[]).map(x=>x.c),backgroundColor:'#4a3aa7',borderRadius:4}]},
    options:baseOpt({scales:{x:{ticks:{color:ink,maxTicksLimit:7},grid:{display:false}},y:{ticks:{color:ink},grid:{color:grid}}}})});
  donut('gConcl',['成功','失败','取消','跳过'],[c.success||0,c.failure||0,c.cancelled||0,c.skipped||0],
    ['#0f8a4d','#e34948','#eda100','#8b8a83']);
  const br=(a.by_repo||[]).filter(r=>r.runs_30d);
  chart('gRunRepo',{type:'bar',data:{labels:br.map(r=>r.name),datasets:[
    {label:'成功',data:br.map(r=>r.success||0),backgroundColor:'#0f8a4d',stack:'s',borderRadius:4},
    {label:'失败',data:br.map(r=>r.failure||0),backgroundColor:'#e34948',stack:'s',borderRadius:4}]},
    options:baseOpt({indexAxis:'y',plugins:{legend:{display:true,labels:{color:ink,boxWidth:9,font:{size:10}}},tooltip:{}},
      scales:{x:{stacked:true,ticks:{color:ink},grid:{color:grid}},y:{stacked:true,ticks:{color:ink}}}})});
  // Traffic
  const tt=t.totals_14d||{};
  kpiRow('#gTrafKpi',[
    {lab:'浏览 14d',val:tt.views||0,unit:''},
    {lab:'克隆 14d',val:tt.clones||0,unit:''},
    {lab:'已归档',val:t.archived_days||0,unit:' 天',sub:'自 '+(t.archive_since||'—')},
    {lab:'覆盖仓',val:(t.per_repo||[]).length,unit:'',sub:'公开仓'},
  ]);
  const dd=t.daily||[];
  chart('gTraf',{type:'line',data:{labels:dd.map(x=>x.d.slice(5)),datasets:[
    {label:'浏览',data:dd.map(x=>x.v),borderColor:'#2a78d6',borderWidth:2,pointRadius:0,tension:.32,fill:false},
    {label:'克隆',data:dd.map(x=>x.c),borderColor:'#4a3aa7',borderWidth:2,pointRadius:0,tension:.32,fill:false,yAxisID:'y1'}]},
    options:baseOpt({plugins:{legend:{display:true,labels:{color:ink,boxWidth:9,font:{size:10}}},tooltip:{}},
      scales:{x:{ticks:{color:ink,maxTicksLimit:7},grid:{display:false}},
        y:{position:'left',ticks:{color:ink},grid:{color:grid}},y1:{position:'right',ticks:{color:ink},grid:{display:false}}}})});
  const tr=(t.per_repo||[]).filter(r=>r.views_14d);
  bars('gTrafRepo',tr.map(r=>r.name),tr.map(r=>r.views_14d),true);
  const trRows=(t.per_repo||[]).map(r=>
    `<tr><td data-v="${esc(r.name)}">${esc(r.name)}</td><td data-v="${r.views_14d||0}">${num(r.views_14d)}</td>
     <td class="muted" data-v="${r.views_uniq_14d||0}">${num(r.views_uniq_14d)}</td>
     <td data-v="${r.clones_14d||0}">${num(r.clones_14d)}</td>
     <td class="muted" data-v="${r.clones_uniq_14d||0}">${num(r.clones_uniq_14d)}</td>
     <td class="muted">${(r.referrers||[]).map(x=>esc(x.r)).join(', ')||'—'}</td>
     <td class="muted">${(r.top_paths||[]).slice(0,2).map(x=>esc((x.p||'').split('/').slice(-1)[0]||'/')).join(', ')||'—'}</td></tr>`).join('');
  const trb=q('#gTrafRows'); if(trb&&trb.dataset.k!==trRows.length+''){trb.innerHTML=trRows;trb.dataset.k=trRows.length+''}
  const sub=(g.subprojects||[]).map(sp=>
    `<tr><td data-v="${esc(sp.project)}">${esc(sp.project)}</td><td class="muted" data-v="${esc(sp.repo)}">${esc(sp.repo)}</td>
     <td class="muted">${esc(sp.path)}</td><td data-v="${sp.commits_30d||0}">${num(sp.commits_30d)}</td>
     <td class="muted" data-v="${sp.last_commit_at||''}">${sp.last_commit_at||'—'}</td></tr>`).join('');
  const sb=q('#gSub'); if(sb&&sb.dataset.k!==sub.length+''){sb.innerHTML=sub;sb.dataset.k=sub.length+''}
  const cap=g.capability||{};
  q('#gCap').innerHTML=`<div class="vsec" style="margin-bottom:7px">采集能力</div>
    <div style="font-size:13px;color:var(--t2);line-height:1.8">
    Traffic:<b>${esc(cap.traffic||'—')}</b><br>Actions 账单:<b>${b.available?'OK(billing/usage)':esc(cap.billing||'—')}</b><br>
    API 余量:<b>${num((g.rate||{}).remaining)} / ${num((g.rate||{}).limit)}</b>
    <span class="muted">· 每分钟仅耗约 2 点,额度每小时重置</span></div>`;
};

addEventListener('hashchange',()=>{if(S)mount();});
D.addEventListener('visibilitychange',()=>{if(!D.hidden){tickAgo();load();}});
load().then(probeEdit);
setInterval(load,REFRESH);
</script>
</body>
</html>
