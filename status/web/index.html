<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云平台总览 · status.linzezhang.com</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232a78d6'/><path d='M5 17h4l3-8 4 14 3-9h8' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
:root{
  --bg:#f6f6f4; --card:#fff; --soft:#f1f1ee; --line:#e4e3dc;
  --t1:#1b1b19; --t2:#57564f; --t3:#8b8a83;
  --accent:#2a78d6; --accent-bg:#e6f1fb; --accent-t:#0c447c;
  --pro:#4a3aa7; --pro-bg:#eeedfe; --pro-t:#26215c;
  --ok:#0f8a4d; --ok-bg:#e4f3ea; --warn:#c98500; --warn-bg:#fbf0d8;
  --danger:#cf3a3a; --danger-bg:#fbeaea;
  --h0:#eceada; --h1:#c6e6c1; --h2:#7bc47f; --h3:#3f9e57; --h4:#1e6b3a;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#151513; --card:#1e1e1c; --soft:#242422; --line:#33332f;
    --t1:#f3f2ec; --t2:#c3c2b7; --t3:#8b8a83;
    --accent:#5a9bea; --accent-bg:#12314f; --accent-t:#b5d4f4;
    --pro:#9085e9; --pro-bg:#2a2560; --pro-t:#cecbf6;
    --ok:#3cc07f; --ok-bg:#123320; --warn:#e0a53a; --warn-bg:#3a2f12;
    --danger:#e26b6a; --danger-bg:#3a1a1a;
    --h0:#26261f; --h1:#0e4429; --h2:#006d32; --h3:#26a641; --h4:#39d353;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 60px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1{font-size:20px;font-weight:600;margin:0}
h2{font-size:15px;font-weight:600;margin:24px 0 10px}
h2:first-child{margin-top:0}
.muted{color:var(--t3);font-size:13px}
.sub{font-size:12px;color:var(--t3);margin:-4px 0 10px}

/* ===== 统一顶栏(所有页面完全一致,消除跳转割裂)===== */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:0.5px solid var(--line)}
.topbar .in{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;padding:12px 0;font-weight:600;font-size:15px;color:var(--t1)}
.brand:hover{text-decoration:none}
.brand .lg{width:20px;height:20px;border-radius:5px;background:var(--accent);display:inline-block;flex:none}
.tabs{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.tabs a{padding:12px 12px;font-size:14px;color:var(--t2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--t1);text-decoration:none}
.tabs a.on{color:var(--t1);border-bottom-color:var(--accent);font-weight:600}
.tabs a .n{font-size:11px;color:var(--t3);margin-left:4px}
.tabs a.on .n{color:var(--accent)}
.ext{display:flex;gap:6px;align-items:center;padding:8px 0}
.ext a{font-size:12px;padding:5px 11px;border:0.5px solid var(--line);border-radius:8px;color:var(--t2)}
.ext a:hover{background:var(--soft);color:var(--t1);text-decoration:none}
.head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:20px 0 16px}
.pill{font-size:12px;padding:4px 12px;border-radius:20px}
.pill.ok{color:var(--ok);background:var(--ok-bg)}
.pill.bad{color:var(--danger);background:var(--danger-bg)}

.grid{display:grid;gap:12px}
.k5{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.k4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.k3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.k2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--card);border:0.5px solid var(--line);border-radius:12px;padding:16px}
.card.p0{padding:6px 12px}
.tile{background:var(--soft);border-radius:10px;padding:13px}
.tile .lab{font-size:13px;color:var(--t2)}
.tile .val{font-size:22px;font-weight:600;margin-top:3px}
.tile .s{font-size:13px;color:var(--t3);font-weight:400}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th{text-align:left;font-weight:500;color:var(--t2);padding:9px 10px;border-bottom:0.5px solid var(--line)}
td{padding:9px 10px;border-bottom:0.5px solid var(--line)}
tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;margin-right:4px;display:inline-block}
.tag.fe{background:var(--accent-bg);color:var(--accent-t)}
.tag.be{background:var(--pro-bg);color:var(--pro-t)}
.badge{font-size:12px;padding:2px 9px;border-radius:6px}
.badge.run{color:var(--ok);background:var(--ok-bg)}
.badge.access{color:var(--accent-t);background:var(--accent-bg)}
.badge.down{color:var(--danger);background:var(--danger-bg)}
.chartbox{position:relative;width:100%;height:180px}
.chartbox.sm{height:150px}
.chartbox.xs{height:120px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:13px;border-bottom:0.5px solid var(--line)}
.row:last-child{border-bottom:none}
.btn{font-size:12px;padding:6px 12px;border:0.5px solid var(--line);background:var(--card);
  color:var(--t1)!important;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--soft);text-decoration:none}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--danger)} .dot.unk{background:var(--t3)}
.ub{background:var(--card);border:0.5px solid var(--line);border-radius:12px;padding:12px 14px}
.ub .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ub .uval{font-size:12px;color:var(--t2);white-space:nowrap}
.track{height:7px;background:var(--soft);border-radius:99px;margin-top:8px;overflow:hidden}
.fill{height:100%;border-radius:99px}
.src{font-size:11px;padding:1px 6px;border-radius:5px;margin-left:6px}
.src.auto{background:var(--ok-bg);color:var(--ok)}
.src.manual{background:var(--soft);color:var(--t3)}
.tg{position:relative;display:inline-block;width:38px;height:20px;vertical-align:middle}
.tg input{opacity:0;width:0;height:0;position:absolute}
.tg .sl{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer}
.tg .sl:before{content:"";position:absolute;height:16px;width:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s}
.tg input:checked + .sl{background:var(--ok)}
.tg input:checked + .sl:before{transform:translateX(18px)}
.tg.ro .sl{cursor:not-allowed;opacity:.5}
.rangebtns{display:flex;gap:4px;flex-wrap:wrap}
.rangebtns button{font-size:12px;padding:4px 10px;border:0.5px solid var(--line);background:var(--card);color:var(--t2);border-radius:7px;cursor:pointer}
.rangebtns button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.err{background:var(--danger-bg);color:var(--danger);padding:12px 14px;border-radius:10px;font-size:13px}
.warn{background:var(--warn-bg);color:var(--warn);padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:14px}
.vgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.vcard{background:var(--card);border:0.5px solid var(--line);border-radius:14px;padding:15px;display:flex;flex-direction:column;gap:9px}
.vhead{display:flex;align-items:center;gap:8px}
.vhead .nm{font-size:15px;font-weight:600}
.vrole{font-size:12px;color:var(--t3);line-height:1.5;margin-top:-5px}
.vsec{font-size:11px;color:var(--t3);letter-spacing:.03em;margin-bottom:3px}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:7px;margin:0 5px 4px 0}
.chip.ok{color:var(--ok);background:var(--ok-bg)}
.chip.warn{color:var(--warn);background:var(--warn-bg)}
.chip.danger{color:var(--danger);background:var(--danger-bg)}
.vmetrics{display:flex;flex-wrap:wrap;gap:8px}
.vmetric{background:var(--soft);border-radius:8px;padding:6px 10px;min-width:66px}
.vmetric .l{font-size:11px;color:var(--t3)}
.vmetric .v{font-size:14px;font-weight:600;margin-top:1px}
.rule{display:flex;align-items:flex-start;gap:10px;padding:10px 2px;border-bottom:0.5px solid var(--line)}
.rule:last-child{border-bottom:none}
.rule .ic{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.rule .ic.ok{background:var(--ok)}.rule .ic.warn{background:var(--warn)}.rule .ic.acted{background:var(--accent)}.rule .ic.pending{background:var(--t3)}
.rule .rn{font-size:13px;font-weight:500}
.rule .rt{font-size:12px;color:var(--t2);margin-top:2px}
.rule .rd{font-size:12px;color:var(--t3);margin-top:2px}
.eng{font-size:10px;padding:1px 6px;border-radius:5px;margin-left:6px;font-weight:400}
.eng.builtin{background:var(--accent-bg);color:var(--accent-t)}
.eng.selfheal{background:var(--ok-bg);color:var(--ok)}
.shead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.lock{border:1px dashed var(--line);border-radius:14px;padding:22px 16px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:8px;color:var(--t3);text-align:center}

/* ===== 贡献网格 ===== */
.hmwrap{overflow-x:auto;padding-bottom:4px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;width:max-content}
.hm i{width:11px;height:11px;border-radius:2px;background:var(--h0);display:block}
.hm i.l1{background:var(--h1)}.hm i.l2{background:var(--h2)}.hm i.l3{background:var(--h3)}.hm i.l4{background:var(--h4)}
.hmmon{display:grid;grid-auto-flow:column;gap:3px;width:max-content;font-size:10px;color:var(--t3);margin-bottom:3px;height:14px}
.hmleg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--t3);margin-top:8px;justify-content:flex-end}
.hmleg i{width:11px;height:11px;border-radius:2px;background:var(--h0);display:block}
.hmleg i.l1{background:var(--h1)}.hmleg i.l2{background:var(--h2)}.hmleg i.l3{background:var(--h3)}.hmleg i.l4{background:var(--h4)}
.quick{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-top:14px}
.qa{background:var(--card);border:0.5px solid var(--line);border-radius:11px;padding:12px 14px;display:block}
.qa:hover{background:var(--soft);text-decoration:none}
.qa .t{font-size:13px;font-weight:600;color:var(--t1)}
.qa .d{font-size:12px;color:var(--t3);margin-top:2px}
</style>
</head>
<body>
<div class="topbar"><div class="in">
  <a class="brand" href="#/"><span class="lg"></span>LinzeCloud</a>
  <nav class="tabs" id="tabs"></nav>
  <div class="ext">
    <a href="https://uptime.linzezhang.com">运维健康</a>
    <a href="/admin">价格设置</a>
    <a href="/admin/github">GitHub 私有</a>
  </div>
</div></div>

<div class="wrap">
  <div class="head">
    <div><h1 id="ptitle">云平台总览</h1><div class="muted" id="updated">加载中…</div></div>
    <span class="pill ok" id="health">加载中</span>
  </div>
  <div id="err"></div><div id="stale"></div>
  <div id="view"></div>
</div>

<script src="vendor/chart.umd.min.js"></script>
<script>
const D=document, C=Chart;
C.defaults.animation=false;
C.defaults.font.family='-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif';
const dark=matchMedia('(prefers-color-scheme:dark)').matches;
const ink='#8b8a83', grid=dark?'rgba(139,138,131,.18)':'rgba(139,138,131,.15)';
const PAL=['#2a78d6','#008300','#eda100','#4a3aa7','#e87ba4','#e34948','#1baf7a','#eb6834','#5a9bea','#9085e9'];
let S=null, CAN_EDIT=false, PROBED=false;

const PAGES=[
  {id:'',        name:'总览'},
  {id:'projects',name:'项目'},
  {id:'host',    name:'主机'},
  {id:'cost',    name:'成本'},
  {id:'usage',   name:'用量'},
  {id:'heal',    name:'自愈'},
  {id:'github',  name:'GitHub'},
];
function route(){return (location.hash||'#/').replace(/^#\/?/,'').split('?')[0];}

/* ---------- 小工具 ---------- */
function esc(s){return String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}
function fmtBytes(b){if(b==null)return '—';const u=['B','KB','MB','GB','TB'];let i=0,v=b;
  while(v>=1024&&i<u.length-1){v/=1024;i++}return v.toFixed(i>0&&v<100?1:0)+' '+u[i]}
function fmtKB(kb){return fmtBytes((kb||0)*1024)}
function cur(a,c){return 'A$'+(a==null?'—':a.toFixed(2))+' · ¥'+(c==null?'—':c.toFixed(2))}
function tile(l,v,s){return '<div class="tile"><div class="lab">'+l+'</div><div class="val">'+v+(s?' <span class="s">· '+s+'</span>':'')+'</div></div>'}
function daysHtml(d){if(d==null)return '';return ' <span style="color:'+(d<=7?'var(--danger)':'var(--ok)')+'">· '+d+'天</span>'}
function qa(href,t,d){return '<a class="qa" href="'+href+'"><div class="t">'+t+'</div><div class="d">'+d+'</div></a>'}

/* ---------- 贡献网格 ---------- */
const MON=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
function heatmap(cal,opt){
  opt=opt||{};
  const days=(cal&&cal.days)||[];
  if(!days.length)return '<div class="muted">暂无数据</div>';
  const mx=cal.max||1;
  const lvl=c=>c<=0?0:(c>=mx*0.66?4:(c>=mx*0.33?3:(c>=mx*0.12?2:1)));
  // 补齐到周日起始,再按 7 天切成列
  const pad=new Date(days[0].d+'T00:00:00').getDay();
  const slots=Array(pad).fill(null).concat(days);
  const cols=[];
  for(let i=0;i<slots.length;i+=7)cols.push(slots.slice(i,i+7));
  const cells=slots.map(x=>{
    if(!x)return '<i style="visibility:hidden"></i>';
    const L=lvl(x.c);
    return '<i class="'+(L?'l'+L:'')+'" title="'+x.d+' · '+x.c+(opt.unit||'')+'"></i>';
  }).join('');
  let lastMon=-1;
  const mons=cols.map(col=>{
    const f=col.find(Boolean);
    if(!f)return '<span></span>';
    const m=new Date(f.d+'T00:00:00').getMonth();
    if(m!==lastMon){lastMon=m;return '<span>'+MON[m]+'</span>';}
    return '<span></span>';
  }).join('');
  return '<div class="hmwrap"><div class="hmmon" style="grid-template-columns:repeat('+cols.length+',11px)">'+mons+'</div>'+
    '<div class="hm">'+cells+'</div></div>'+
    '<div class="hmleg"><span>少</span><i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span>多</span></div>';
}
// 网格默认滚到最右(最近的数据最重要)
function scrollHeatmaps(){D.querySelectorAll('.hmwrap').forEach(w=>{w.scrollLeft=w.scrollWidth});}

/* ---------- 图表 ---------- */
let _ch={};
function mk(id,cfg){const el=D.getElementById(id);if(!el)return;if(_ch[id]){_ch[id].destroy();delete _ch[id]}_ch[id]=new C(el,cfg)}
function donut(id,labels,data,colors){mk(id,{type:'doughnut',data:{labels:labels,datasets:[{data:data,backgroundColor:colors||labels.map((_,k)=>PAL[k%PAL.length]),borderWidth:2,borderColor:dark?'#1e1e1c':'#fff'}]},
  options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{position:'right',labels:{color:ink,boxWidth:10,font:{size:11}}}}}})}
function bar(id,labels,data,horiz,fmt){mk(id,{type:'bar',data:{labels:labels,datasets:[{data:data,backgroundColor:labels.map((_,k)=>PAL[k%PAL.length]),borderRadius:4}]},
  options:{indexAxis:horiz?'y':'x',responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:{callbacks:fmt?{label:c=>fmt(c.parsed[horiz?'x':'y'])}:{}}},
    scales:{x:{ticks:{color:ink},grid:{color:grid,display:!horiz}},y:{ticks:{color:ink},grid:{color:grid,display:horiz}}}}})}
function line(id,labels,data,color,fill){mk(id,{type:'line',data:{labels:labels,datasets:[{data:data,borderColor:color,
  backgroundColor:'rgba(139,138,131,.10)',fill:fill!==false,tension:.3,borderWidth:2,pointRadius:labels.length<=40?3:0}]},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
    scales:{y:{beginAtZero:true,ticks:{color:ink},grid:{color:grid}},x:{ticks:{color:ink,maxTicksLimit:8},grid:{display:false}}}}})}

/* ---------- 数据加载 ---------- */
async function load(){
  try{
    const r=await fetch('data/snapshot.json?t='+Date.now());
    if(!r.ok)throw new Error('快照不可用('+r.status+')');
    S=await r.json(); paint(); probeEdit();
  }catch(e){ D.getElementById('err').innerHTML='<div class="err">数据加载失败:'+esc(e.message)+'。稍后自动重试。</div>'; }
}
function probeEdit(){ if(PROBED)return; PROBED=true;
  fetch('/admin/api/prices').then(r=>{if(r.ok){CAN_EDIT=true;paint();}}).catch(()=>{}); }
function toggleRenew(el,i){
  if(!S||!S.cost||!S.cost.items[i])return;
  const name=S.cost.items[i].name, val=el.checked; el.disabled=true;
  fetch('/admin/api/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,auto_renew:val})})
    .then(r=>{if(!r.ok)throw 0;return r.json();})
    .then(()=>{S.cost.items[i].auto_renew=val;el.disabled=false;})
    .catch(()=>{el.checked=!val;el.disabled=false;alert('保存失败:请先到「价格设置」用你的邮箱登录一次再切换。');});
}

/* ---------- 渲染主流程 ---------- */
function paint(){
  if(!S)return;
  const g=S.github||{};
  D.getElementById('tabs').innerHTML=PAGES.map(p=>{
    const on=route()===p.id?' on':'';
    let n='';
    if(p.id==='')n=(S.summary&&S.summary.services_online)||'';
    if(p.id==='github')n=g.available?(g.repos_total+'仓'):'';
    if(p.id==='heal'&&S.selfheal)n=S.selfheal.armed+'/'+S.selfheal.total;
    if(p.id==='cost')n='A$'+(S.cost.month_cash_aud??'—');
    return '<a class="'+on.trim()+'" href="#/'+p.id+'">'+p.name+(n?'<span class="n">'+n+'</span>':'')+'</a>';
  }).join('');
  const cur_=PAGES.find(p=>p.id===route())||PAGES[0];
  D.getElementById('ptitle').textContent=cur_.id?('云平台 · '+cur_.name):'云平台总览';
  D.getElementById('updated').textContent='快照 '+S.updated_at+'('+S.tz+') · 每 1 分钟自动刷新'+
    (g.available?(' · GitHub '+g.collected_at):'');
  const anyDown=(S.projects||[]).some(p=>p.status==='down');
  const h=D.getElementById('health'); h.textContent=anyDown?'有异常':'全部健康'; h.className='pill '+(anyDown?'bad':'ok');
  const st=D.getElementById('stale');
  const mins=S.updated_epoch?Math.floor((Date.now()/1000-S.updated_epoch)/60):0;
  st.innerHTML=mins>=3?'<div class="warn"><b>数据可能过期</b> · 快照已 '+mins+' 分钟未更新(元自愈会自动重跑采集器)。</div>':'';
  const R={'':vOverview,'projects':vProjects,'host':vHost,'cost':vCost,'usage':vUsage,'heal':vHeal,'github':vGithub}[route()]||vOverview;
  for(const k in _ch){_ch[k].destroy();delete _ch[k];}   // 切页先销毁旧图表,避免实例堆积
  D.getElementById('view').innerHTML=R();
  (DRAW[route()]||DRAW[''])();
  scrollHeatmaps();
}
const DRAW={};

/* ================= 总览 ================= */
function vOverview(){
  const su=S.summary,g=S.github||{},o=S.ops;
  return '<div class="grid k5">'+[
    tile('服务在线',su.services_online),
    tile('当月成本','A$'+(S.cost.month_cash_aud??'—'),'¥'+(S.cost.month_cash_cny??'—')),
    tile('自动修复',(S.selfheal?S.selfheal.armed+'/'+S.selfheal.total:'—'),'条规则'),

  const riskColor=failPct>=30?'var(--warn)':'var(--ok)';
  return '<h2>Actions 额度与收费风险</h2>'+
   '<div class="grid k2">'+
    '<div class="card"><div class="shead"><b style="font-size:14px">当前收费风险</b>'+
      '<span class="pill ok">A$0 · 无风险</span></div>'+
      '<div style="font-size:13px;color:var(--t2);margin-top:8px;line-height:1.7">'+
      '公开仓 <b>'+a.public_runs_30d+'</b> 次运行 / 30 天 &mdash; <b style="color:var(--ok)">不花钱</b>。'+
      'GitHub 对公开仓的标准 runner <b>免费且不限量</b>,'+
      '已实测抽样 <b>'+(bv.sampled_runs||0)+'</b> 次运行的计费时长合计 <b>'+(bv.billable_ms||0)+' ms</b>(即 0 分钟)。'+
      '</div>'+
      '<div class="track" style="margin-top:12px"><div class="fill" style="width:1.5%;background:var(--ok)"></div></div>'+
      '<div class="muted" style="font-size:11px;margin-top:6px">免费额度 '+a.free_tier_minutes+' 分钟/月 &mdash; '+
      '<b>只被私有仓消耗</b>,公开仓不占用</div>'+
    '</div>'+
    '<div class="card"><div class="shead"><b style="font-size:14px">私有仓 Actions</b>'+
      '<span class="chip warn">需授权</span></div>'+
      '<div style="font-size:13px;color:var(--t2);margin-top:8px;line-height:1.7">'+
      '有 <b>'+(a.private_repos_unreadable||0)+'</b> 个私有仓的 Actions 当前令牌读不到('+esc(a.private_status)+')。'+
      '<b>只有私有仓会消耗那 2000 分钟/月</b>,所以这是唯一的潜在收费点。'+
      '授权后这里会显示真实已用分钟与触顶预测,<b>在此之前不做任何估算</b>。</div>'+
      '<div style="margin-top:10px;padding-top:10px;border-top:0.5px solid var(--line)">'+
      '<div class="muted" style="font-size:12px">30 天失败率 <b style="color:'+riskColor+'">'+failPct.toFixed(1)+'%</b>'+
      '('+(c.failure||0)+' 失败 / '+done+' 已完成)&mdash; 失败本身不额外收费,但会拖慢反馈</div></div>'+
    '</div>'+
   '</div>';
}

function vGithub(){
  const g=S.github;
  if(!g||!g.available)return '<div class="warn">GitHub 采集尚未产出。'+esc((g&&g.note)||'')+'</div>';
  const ciB=r=>{const c=r.ci_conclusion;if(c==null&&!r.ci_state)return '<span class="muted">—</span>';
    return r.ci_ok?'<span style="color:var(--ok)">通过</span>':'<span style="color:var(--danger)">'+esc(c||r.ci_state)+'</span>';};
  const rows=(g.public_repos||[]).map(r=>
    '<tr><td><a href="'+r.url+'" target="_blank">'+esc(r.name)+'</a></td><td class="muted">'+esc(r.top_lang)+'</td>'+
    '<td>'+r.commits_7d+'</td><td>'+r.commits_30d+'</td><td>'+r.branches+'</td><td>'+(r.open_pr??'—')+'</td><td>'+(r.open_issue??'—')+'</td>'+
    '<td class="muted">'+fmtKB(r.size_kb)+'</td><td class="muted">'+fmtBytes(r.release_bytes)+'</td><td>'+ciB(r)+'</td><td class="muted">'+esc(r.pushed_at)+'</td></tr>').join('');
  const cap=g.capability||{};
  return '<div class="grid k5">'+[
    tile('仓库',g.repos_total,g.public+' 公开 / '+g.private+' 私有'),
    tile('提交 7d',g.commits_7d,'30天 '+g.commits_30d),
    tile('待处理','PR '+g.open_pr,'Issue '+g.open_issue),
    tile('CI 失败',g.ci_fail,'分支 '+g.branches),
    tile('存储',fmtKB(g.git_size_kb),'Release '+fmtBytes(g.release_bytes))
  ].join('')+'</div>'+
  actionsPanel(g)+
  '<h2>贡献网格 · 一年 '+((g.calendar||{}).total||0)+' 次</h2>'+
  '<div class="card">'+heatmap(g.calendar,{unit:' 次提交'})+'</div>'+
  '<h2>仓库清单 · 公开仓</h2><div class="sub">采集 '+esc(g.collected_at)+' · 每 1 分钟刷新 · '+esc(g.note)+'</div>'+
  '<div class="card p0 scroll"><table><thead><tr><th>仓库</th><th>语言</th><th>7d</th><th>30d</th><th>分支</th><th>PR</th><th>Issue</th><th>Git 占用</th><th>Release</th><th>CI</th><th>最近 push</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  (g.private>0?'<div class="grid k2" style="margin-top:12px">'+
    '<div class="lock"><div style="font-size:15px;font-weight:600;color:var(--t2)">另有 '+g.private+' 个私有仓</div><div>明细不在公开页展示</div><a class="btn" href="/admin/github">登录查看私有全量</a></div>'+
    '<div class="card"><div class="muted" style="margin-bottom:6px">私有页能看到什么</div><div style="font-size:13px;color:var(--t2)">全部 '+g.repos_total+' 个仓的完整明细(含私有)+ 子项目 + Release 占用 + CI 通过率。用你本人的 Cloudflare Access 登录,匿名访问被拦。</div></div></div>':'')+
  '<h2>频率与吞吐</h2>'+
  '<div class="grid k2">'+
    '<div class="card"><div class="shead"><div class="muted">提交频率 · 近 90 天</div>'+
      '<span class="muted" style="font-size:11px">来自贡献日历</span></div>'+
      '<div class="chartbox sm" style="margin-top:6px"><canvas id="gCommitTrend"></canvas></div></div>'+
    '<div class="card"><div class="shead"><div class="muted">Actions 运行 · 近 14 天</div>'+
      '<span class="muted" style="font-size:11px">'+((g.actions&&g.actions.daily_max)||0)+' 次/天峰值</span></div>'+
      '<div class="chartbox sm" style="margin-top:6px"><canvas id="gRunTrend"></canvas></div></div>'+
  '</div>'+
  (g.throughput?('<div class="grid k4" style="margin-top:12px">'+[
    tile('PR 新建 · 30天',g.throughput.pr_created_30d??'—'),
    tile('PR 合并 · 30天',g.throughput.pr_merged_30d??'—','近7天 '+(g.throughput.pr_merged_7d??'—')),
    tile('PR 待处理',g.throughput.pr_open??'—'),
    tile('Issue · 30天','新建 '+(g.throughput.issue_created_30d??'—'),'关闭 '+(g.throughput.issue_closed_30d??'—'))
  ].join('')+'</div>'):'')+
  '<h2>工程数据可视化</h2>'+
  '<div class="grid k3">'+
    '<div class="card"><div class="muted" style="margin-bottom:6px">各仓 30 天提交</div><div class="chartbox sm"><canvas id="gC30"></canvas></div></div>'+
    '<div class="card"><div class="muted" style="margin-bottom:6px">语言字节占比</div><div class="chartbox sm"><canvas id="gLang"></canvas></div></div>'+
    '<div class="card"><div class="muted" style="margin-bottom:6px">各仓 Git 占用</div><div class="chartbox sm"><canvas id="gSize"></canvas></div></div>'+
  '</div>'+
  (g.actions?('<div class="grid k2" style="margin-top:12px">'+
    '<div class="card"><div class="muted" style="margin-bottom:6px">Actions 结论分布 · 30 天</div><div class="chartbox sm"><canvas id="gConcl"></canvas></div></div>'+
    '<div class="card"><div class="muted" style="margin-bottom:6px">各仓 Actions 运行量与失败率 · 30 天</div><div class="chartbox sm"><canvas id="gRunRepo"></canvas></div></div>'+
  '</div>'):'')+
  '<h2>Monorepo 子项目活跃度</h2>'+
  '<div class="card p0 scroll"><table><thead><tr><th>子项目</th><th>所在仓</th><th>路径</th><th>30 天提交</th><th>最近提交</th></tr></thead><tbody>'+
    ((g.subprojects||[]).map(s=>'<tr><td>'+esc(s.project)+'</td><td class="muted">'+esc(s.repo)+'</td><td class="muted">'+esc(s.path)+'</td><td>'+(s.commits_30d??'—')+'</td><td class="muted">'+(s.last_commit_at||'—')+'</td></tr>').join('')||'<tr><td colspan="5" class="muted">暂无</td></tr>')+
  '</tbody></table></div>'+
  '<div class="card" style="margin-top:16px"><div class="vsec" style="margin-bottom:6px">采集能力</div>'+
    '<div style="font-size:13px;color:var(--t2)">Traffic 访问流量:<b>'+esc(cap.traffic||'—')+'</b><br>Actions 账单分钟/费用:<b>'+esc(cap.billing||'—')+'</b>'+
    '<br>API 余量:<b>'+((g.rate||{}).remaining??'—')+' / '+((g.rate||{}).limit??'—')+'</b>(每分钟仅耗约 2 点)</div>'+
    '<div class="muted" style="font-size:12px;margin-top:6px">授权含 Administration:read 的只读令牌后 Traffic 自动采集;不可用时如实标注,绝不编造费用。</div></div>';
}
DRAW['github']=function(){
  const g=S.github; if(!g||!g.available)return;
  const rp=(g.public_repos||[]).slice().sort((a,b)=>b.commits_30d-a.commits_30d);
  bar('gC30',rp.map(r=>r.name),rp.map(r=>r.commits_30d),true);
  const L={}; (g.public_repos||[]).forEach(r=>{const ls=r.languages||{};for(const k in ls)L[k]=(L[k]||0)+ls[k];});
  const le=Object.entries(L).sort((a,b)=>b[1]-a[1]).slice(0,8);
  donut('gLang',le.map(x=>x[0]),le.map(x=>x[1]));
  const rs=(g.public_repos||[]).slice().sort((a,b)=>b.size_kb-a.size_kb);
  bar('gSize',rs.map(r=>r.name),rs.map(r=>+(r.size_kb/1024).toFixed(1)),true,v=>v+' MB');
  // 提交频率:贡献日历近 90 天
  const cd=((g.calendar||{}).days||[]).slice(-90);
  line('gCommitTrend',cd.map(x=>x.d.slice(5)),cd.map(x=>x.c),'#2a78d6');
  const A=g.actions; if(!A)return;
  // Actions 近 14 天运行
  mk('gRunTrend',{type:'bar',data:{labels:(A.daily14||[]).map(x=>x.d.slice(5)),
    datasets:[{data:(A.daily14||[]).map(x=>x.c),backgroundColor:'#4a3aa7',borderRadius:3}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:ink,maxTicksLimit:7},grid:{display:false}},y:{ticks:{color:ink},grid:{color:grid}}}}});
  const c=A.conclusions||{};
  donut('gConcl',['成功','失败','取消','跳过'],[c.success||0,c.failure||0,c.cancelled||0,c.skipped||0],
    ['#1baf7a','#e34948','#eda100','#8b8a83']);
  const br=(A.by_repo||[]).filter(r=>r.runs_30d);
  mk('gRunRepo',{type:'bar',data:{labels:br.map(r=>r.name),datasets:[
    {label:'成功',data:br.map(r=>r.success||0),backgroundColor:'#1baf7a',stack:'s',borderRadius:3},
    {label:'失败',data:br.map(r=>r.failure||0),backgroundColor:'#e34948',stack:'s',borderRadius:3}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:ink,boxWidth:10,font:{size:10}}}},
      scales:{x:{stacked:true,ticks:{color:ink},grid:{color:grid}},y:{stacked:true,ticks:{color:ink}}}}});
};

addEventListener('hashchange',paint);
load();
setInterval(load,60*1000);
</script>
