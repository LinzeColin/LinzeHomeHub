# 拷到你仓的 .github/workflows/ 下，改三处：项目目录、key、以及在哪一步之后调用。
#
# ★ 为什么单独一个 workflow 而不是塞进你的生产流水线：
#   生产流水线（尤其带投递/SMTP 的）改动风险高、门禁多。
#   这份只做一件事——把状态写回仓里，出问题也不会影响业务。
#   等跑稳了再考虑合并进主流水线。
name: report flow state

on:
  workflow_run:
    workflows: ["<把你那条真正干活的 workflow 名字填这里>"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write          # 只需要写回本仓，不需要别的

concurrency:
  group: flow-state-${{ github.ref }}
  cancel-in-progress: false          # 状态回写不许被取消，取消=这一轮没记录

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}

      - name: 写回这一步的状态
        run: |
          # ★ 报忧和报喜一样重要：上游 workflow 失败就如实写 blocked
          if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            STATE=healthy; NOTE="上游流水线成功"
          else
            STATE=blocked;  NOTE="上游流水线 ${{ github.event.workflow_run.conclusion }}"
          fi
          python3 <项目目录>/scripts/report_flow_state.py \
            --project-dir '<项目目录>' \
            --key '<BL-XXX.stage>' \
            --state "$STATE" --note "$NOTE"

      - name: 提交
        run: |
          git config user.name  "flow-state-bot"
          git config user.email "flow-state-bot@users.noreply.github.com"
          git add '*/docs/governance/flow_state.json' 'docs/governance/flow_state.json' || true
          git diff --cached --quiet && echo "状态没变，不产生空提交" && exit 0
          git commit -m "chore(flow): 回写业务流步骤状态 [skip ci]"
          git push
