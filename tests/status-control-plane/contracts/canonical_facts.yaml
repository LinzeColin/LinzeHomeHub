  - name: GitHub Actions checkout
    version: v7.0.1
    license: MIT
    use: repository_checkout_in_ci
  - name: GitHub Actions setup-python
    version: v7.0.0
    license: MIT
    use: deterministic_python_ci
  - name: Playwright Test
    version: 1.62.0
    license: Apache-2.0
    use: browser_accessibility_and_security_tests
  - name: Gatus
    license: Apache-2.0
    use: retain_existing_deterministic_endpoint_probes
  - name: PyJWT
    version: 2.13.0
    license: MIT
    use: Cloudflare_Access_JWT_verification
  - name: cryptography
    version: 49.0.0
    license: Apache-2.0 OR BSD-3-Clause
