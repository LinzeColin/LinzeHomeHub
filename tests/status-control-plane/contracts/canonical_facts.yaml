api_version: status.linzezhang.com/canonical-facts/v1
product:
  name: status.linzezhang.com
  ui_name_zh: 云平台总览
  taskpack_version: v0.0.0.1
  taskpack_state: FROZEN_FOR_EXECUTION
  target_repository: LinzeColin/LinzeHomeHub
  target_area: status
  repository_development_mode: continuously_evolving
  freeze_main: false
  language: zh-CN
approval:
  owner_authorized_final_delivery: true
  authorized_at: '2026-07-27'
  codex_may_create_or_change_version: false
  scope_and_acceptance_frozen: true
runtime_invariants:
  production_agent_dependency: false
  production_llm_calls: 0
  production_token_consumption: 0
  macos_launchd_allowed: false
  local_machine_persistent_runtime_allowed: false
  chat_session_dependency_allowed: false
  real_time_soak_required: false
  background_wait_required: false
authorities:
  code_and_governance: LinzeHomeHub/status
  long_term_structured_facts: Private-Database
  runtime_compute: OVH
  runtime_cache_journal_idempotency_outbox: OVH SQLite
  cold_backup_and_large_private_objects: Cloudflare R2
  optional_rebuildable_query_index: Cloudflare D1
  geographic_backup: OCI Object Storage
data_rules:
  github_is_not_for:
  - low_latency_transactions
  - locks
  - queues
  - cursors
  - high_frequency_logs
  - reconstructable_runtime_state
  private_database_contains:
  - structured_operational_summaries
  - release_facts
  - incident_conclusions
  - recovery_facts
  - object_references
  - content_hashes
  - schema_versions
  r2_contains:
  - large_files
  - binary_files
  - privacy_sensitive_objects
  - cold_repository_backups
  d1_default_enabled: false
  no_new_fact_no_git_commit: true
  default_batch_sync: daily
  immediate_sync_events:
  - release
  - incident
  - recovery
execution_subjects:
  research_observation:
    mutable: true
    formal_evidence_subject: false
  integration_base:
    binding: latest_origin_main_at_execution_start
    immutable_within_worktree: true
  candidate_subject:
    binding: post_reconciliation_commit
    immutable: true
    formal_verifier_subject: true
  deployment_subject:
    binding: deployed_artifact_digest
    immutable: true
    must_match_candidate_artifact: true
reconciliation_states:
- ALREADY_SATISFIED
- APPLY_CLEAN
- ADAPT_REQUIRED
- UPSTREAM_EQUIVALENT
- CONTRACT_CONFLICT
- ENVIRONMENT_BLOCKED
- OBSOLETE
condition_semantics:
  truth_values:
  - true
  - false
  - UNKNOWN
  non_pass_states:
  - UNKNOWN
  - UNAVAILABLE
  - STALE
  - UNVERIFIED
  - NOT_RUN
  - ABSTAIN
  portfolio_health_dimensions:
  - coverage_health
  - runtime_health
capability_axes:
- declared
- implemented
- verified
- packaged
- deployed
- operational
- recoverable
canonical_entities:
- business_line
- project
- repository
- component
- runtime
- capability
- dependency
- intent
- task
- run
- session
- commit
- artifact
- deployment
- evidence
- probe
- backup
- recovery
- skill
- policy
