name: Dual-Plane Governance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dual-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装冻结的治理解析依赖
        run: python3 -m pip install --disable-pip-version-check "PyYAML==6.0.3"
      - name: 运行唯一的全仓双平面合规校验器
        run: |
          set -Eeuo pipefail
          SCRIPT="machine/tools/check_dual_plane_ci.py"
          [[ -f "$SCRIPT" ]] || { echo "FAIL: 缺少 $SCRIPT" >&2; exit 1; }
          python3 "$SCRIPT" --root . --require-projects
      - name: kit 漂移门（副本必须与 Governance 唯一真源一致）
        run: |
          set -Eeuo pipefail
          SCRIPT="machine/tools/check_kit_drift.py"
          [[ -f "$SCRIPT" ]] || { echo "FAIL: 缺少 $SCRIPT" >&2; exit 1; }
          python3 "$SCRIPT" --root .
