name: deploy
# 不再部署，也不再调用 Coolify（不需要任何令牌）。线上由服务器每 5 分钟拉取 main 自动部署（见 deploy/pull/）。
# 这里只做「合入 main 之前先证明镜像能构建、能起来、内容对」的检查。
# 文件名与 workflow 名保留为 deploy：status 面板与每日巡检按这个名字判断「部署链路是否通」。
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 构建镜像（与服务器同一份 Dockerfile）
        run: docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" -t home-hub:ci .
      - name: 起容器并冒烟
        run: |
          set -Eeuo pipefail
          docker run -d --name hh -p 8080:80 home-hub:ci
          for i in $(seq 1 20); do curl -fsS -o /tmp/index.html http://127.0.0.1:8080/ && break; sleep 1; done
          grep -q 'Linze Home Hub' /tmp/index.html
          test "$(curl -fsS http://127.0.0.1:8080/version.txt)" = "$GITHUB_SHA"
